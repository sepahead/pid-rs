# cargo-deny configuration. Run locally with `cargo deny --all-features --locked check`
# (or `just deny`) — --all-features so the `parallel` dependency subtree is scanned, as in CI.
# https://embarkstudios.github.io/cargo-deny/

[advisories]
version = 2
yanked = "deny"
# No advisory exceptions are permitted for the 1.x release line. The 1.0 MSRV is Rust 1.89 so the
# workspace can use nalgebra 0.35 / simba 0.10, which removes the unmaintained `paste` dependency.
ignore = []

[licenses]
version = 2
# Permissive licenses compatible with this project's MIT OR Apache-2.0 terms.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "Zlib",
    "Unicode-3.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
