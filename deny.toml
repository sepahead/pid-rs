# cargo-deny configuration. Run locally with `cargo deny --all-features --locked check`
# (or `just deny`) — --all-features so the `parallel` dependency subtree is scanned, as in CI.
# https://embarkstudios.github.io/cargo-deny/

[advisories]
version = 2
yanked = "deny"
# `paste` is unmaintained, not a vulnerability. It is pulled in by nalgebra 0.33 -> simba 0.9;
# removing it requires nalgebra 0.35, whose Rust 1.89 MSRV exceeds this workspace's Rust 1.83.
# Keep this exception narrow and re-evaluate when an MSRV-compatible nalgebra drops `paste`.
ignore = ["RUSTSEC-2024-0436"]

[licenses]
version = 2
# Permissive licenses compatible with this project's MIT OR Apache-2.0 terms.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "Zlib",
    "Unicode-3.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
