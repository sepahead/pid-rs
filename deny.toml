# cargo-deny configuration. Run locally with `cargo deny --all-features --locked check`
# (or `just deny`) — --all-features so the `parallel` dependency subtree is scanned, as in CI.
# https://embarkstudios.github.io/cargo-deny/

[advisories]
version = 2
yanked = "deny"
# No advisory exceptions are permitted for the 0.9 review or proposed 1.0 boundary. The workspace
# MSRV is Rust 1.89, so it can use nalgebra 0.35 / simba 0.10 and avoid the unmaintained `paste`
# dependency. Version 0.9 makes no 1.x compatibility promise.
ignore = []

[licenses]
version = 2
# Permissive licenses compatible with this project's MIT OR Apache-2.0 terms.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "Zlib",
    "Unicode-3.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
