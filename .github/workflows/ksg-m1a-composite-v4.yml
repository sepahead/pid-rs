name: KSG M1a composite v4 (retired)

# C4's attempt-1 hosted run failed in the static-validation step's preflight.  R4 is permanently
# unissued.  This historical workflow has no automatic trigger and cannot grant
# v5 or scientific credit; the append-only successor has its own workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired-no-credit:
    name: Retired v4 contract — no qualification credit
    runs-on: ubuntu-24.04
    steps:
      - name: Refuse reuse of the failed v4 qualification route
        run: |
          printf '%s\n' \
            'Composite-v4 is retired after failed attempt-1 run 32079866461.' \
            'R4 is unissued. Use the separately versioned composite-v5 contract.' >&2
          exit 1
