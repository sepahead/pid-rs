name: KSG M1a composite v6 (retired)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    name: Refuse retired composite-v6 qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Preserve the failed attempt-1 and local-recorder boundaries
        env:
          PUBLISHED_C6: 0c3afa0ab5b264370072a18d24655df35b90574c
          FAILED_CI_ATTEMPT_1_RUN: "32139920717"
          SUCCESSFUL_CODEQL_ATTEMPT_1_RUN: "32139921184"
          FAILED_CONTRACT_ATTEMPT_1_RUN: "32139920743"
        run: |
          set -euo pipefail
          test "${FAILED_CI_ATTEMPT_1_RUN}" != "0"
          echo "Composite v6 is retired after failed attempt-1 CI run ${FAILED_CI_ATTEMPT_1_RUN} and contract run ${FAILED_CONTRACT_ATTEMPT_1_RUN} for ${PUBLISHED_C6}." >&2
          echo "Repository CI terminated with 45 jobs: 44 success and sole failure job 95719898423 at step 11, Rebuild papers and check cross-toolchain text, geometry, fonts, and workflow renders." >&2
          echo "Both hosted failures reached the bounded missing-rg dependency surface; CodeQL run ${SUCCESSFUL_CODEQL_ATTEMPT_1_RUN} cannot transfer qualification credit." >&2
          echo "Exact hosted diagnostic: composite publication PDF v6 adjudication: missing command: rg" >&2
          echo "The exact C6 local recorder is separately unsatisfiable because its 65536-byte internal-command cap is smaller than two required authority blobs." >&2
          echo "R6 is permanently unissued; use the composite-v7 workflow for a fresh C7 qualification." >&2
          exit 1
