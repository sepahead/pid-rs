name: KSG M1a composite v8 (retired)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    name: Refuse retired composite-v8 qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Preserve the terminal C8 retained-binding defect and refuse credit
        env:
          CI_ATTEMPT_1_FAILED_JOB: "96176246476"
          CI_ATTEMPT_1_LOG_SHA256: 0c475bce091b1f2ae414b6325ec0b46caae5f375ee5b4e87bd989688915d6fc4
          CI_ATTEMPT_1_LOG_SIZE: "136873"
          CI_ATTEMPT_1_RUN: "32286213706"
          FAILED_CONTRACT_ATTEMPT_1_JOB: "96176246257"
          FAILED_CONTRACT_ATTEMPT_1_LOG_SHA256: 63be55db45dbf212881ede76b8c4ae70cd4bad28de0c49bd4b12d0b70a515d0e
          FAILED_CONTRACT_ATTEMPT_1_LOG_SIZE: "59731"
          FAILED_CONTRACT_ATTEMPT_1_RUN: "32286213774"
          FAILURE_MARKER: "certified SxPID2 claim check failed: release-audit just dependency line exact digest changed"
          PUBLISHED_C8: 7c80d48db415279fc4d744eadb1515797606912b
          STALE_BINDING_COUNT: "5"
        run: |
          set -euo pipefail
          test "${FAILED_CONTRACT_ATTEMPT_1_RUN}" != "0"
          test "${FAILED_CONTRACT_ATTEMPT_1_JOB}" != "0"
          test "${CI_ATTEMPT_1_RUN}" != "0"
          test "${CI_ATTEMPT_1_FAILED_JOB}" != "0"
          test "${STALE_BINDING_COUNT}" = "5"
          echo "Composite v8 is retired at ${PUBLISHED_C8}." >&2
          echo "${FAILURE_MARKER}" >&2
          echo "Dedicated attempt-1 run ${FAILED_CONTRACT_ATTEMPT_1_RUN}, job ${FAILED_CONTRACT_ATTEMPT_1_JOB}, failed at step 10 after reaching the retained certified-SxPID2 surface; raw log ${FAILED_CONTRACT_ATTEMPT_1_LOG_SIZE} bytes sha256 ${FAILED_CONTRACT_ATTEMPT_1_LOG_SHA256}; later PDF, static-contract, and artifact-upload steps were skipped." >&2
          echo "Repository CI attempt-1 run ${CI_ATTEMPT_1_RUN} completed failure with 44 successful jobs and sole failed job ${CI_ATTEMPT_1_FAILED_JOB}, step 22; raw failed-job log ${CI_ATTEMPT_1_LOG_SIZE} bytes sha256 ${CI_ATTEMPT_1_LOG_SHA256}." >&2
          echo "The marker is the first fail-closed edge. Read-only sequential digest-repin analysis identified five changed bindings, and source reconstruction guards that exact set without establishing unique counterfactual necessity or order. The diagnosis changed no theorem statement, mathematical-claim semantic content, estimator result, or PDF byte." >&2
          echo "CodeQL attempt 1 succeeded, but no C8 observation transfers qualification to C9; no L8 record is installed and R8 is permanently unissued." >&2
          echo "Use the composite-v9 workflow and a fresh identity-bound L9 record for C9 qualification." >&2
          exit 1
