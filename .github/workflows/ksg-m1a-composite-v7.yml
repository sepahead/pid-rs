name: KSG M1a composite v7 (retired)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    name: Refuse retired composite-v7 qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Preserve both terminal C7 hosted defect boundaries and refuse credit
        env:
          CI_ATTEMPT_1_FAILED_JOB: "96080962981"
          CI_ATTEMPT_1_LOG_SHA256: b760292f9e448ce4e83148adc9a7675697193cac4904716eb450494f4646ff9c
          CI_ATTEMPT_1_LOG_SIZE: "126388"
          CI_ATTEMPT_1_RUN: "32257016662"
          FAILED_ACTION_ROUTE: actions/upload-artifact
          FAILED_CONTRACT_ATTEMPT_1_JOB: "96080963533"
          FAILED_CONTRACT_ATTEMPT_1_LOG_SHA256: b935661a497e3dc257b7ba552c866d1ff52bc8269182a75f961b3e9dfa193b01
          FAILED_CONTRACT_ATTEMPT_1_LOG_SIZE: "1843"
          FAILED_CONTRACT_ATTEMPT_1_RUN: "32257017103"
          PUBLISHED_C7: 23b69abafb4bfdaab4b2321eb6cee7be7e1cd32e
          TRUNCATED_UPLOAD_ARTIFACT_REF: 043fb46d1a93c77aae656e7c1c64a875d1fc6a0
        run: |
          set -euo pipefail
          test "${FAILED_CONTRACT_ATTEMPT_1_RUN}" != "0"
          test "${FAILED_CONTRACT_ATTEMPT_1_JOB}" != "0"
          test "${#TRUNCATED_UPLOAD_ARTIFACT_REF}" = "39"
          test "${CI_ATTEMPT_1_RUN}" != "0"
          test "${CI_ATTEMPT_1_FAILED_JOB}" != "0"
          echo "Composite v7 is retired after dedicated attempt-1 run ${FAILED_CONTRACT_ATTEMPT_1_RUN}, job ${FAILED_CONTRACT_ATTEMPT_1_JOB}, failed during Set up job for ${PUBLISHED_C7}; raw log ${FAILED_CONTRACT_ATTEMPT_1_LOG_SIZE} bytes sha256 ${FAILED_CONTRACT_ATTEMPT_1_LOG_SHA256}." >&2
          echo "##[error]The action ${FAILED_ACTION_ROUTE}@${TRUNCATED_UPLOAD_ARTIFACT_REF} is not allowed in sepahead/pid-rs because all actions must be pinned to a full-length commit SHA." >&2
          echo "No checkout or repository command ran in that dedicated hosted attempt, and no dedicated v7 static artifact was uploaded." >&2
          echo "Repository CI attempt-1 run ${CI_ATTEMPT_1_RUN} completed failure with 44 successful jobs and sole failed job ${CI_ATTEMPT_1_FAILED_JOB}, step 11 Rebuild papers and check cross-toolchain text, geometry, fonts, and workflow renders; raw failed-job log ${CI_ATTEMPT_1_LOG_SIZE} bytes sha256 ${CI_ATTEMPT_1_LOG_SHA256}." >&2
          echo "mathematical workflow PDF check: extracted report text/layout changed across toolchains" >&2
          echo "That CI run retained coverage, source-state, and SBOM artifacts only; it retained no generated workflow PDF, extracted text, or text diff." >&2
          echo "The committed workflow PDF/content is not classified as defective by this marker; the strict layout comparator was the reached failure." >&2
          echo "CodeQL attempt 1 succeeded, but no C7 hosted observation transfers qualification to C8; no L7 record is installed and R7 is permanently unissued." >&2
          echo "Use the composite-v8 workflow and a fresh identity-bound L8 record for C8 qualification." >&2
          exit 1
