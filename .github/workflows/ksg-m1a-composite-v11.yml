name: KSG M1a composite v11

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ksg-m1a-composite-v11-${{ github.sha }}
  cancel-in-progress: false

jobs:
  validate-contract:
    name: Validate fresh C9-to-C11 bounded contract
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: "${{ github.sha }}"
      - name: Normalize only reviewed Actions checkout residues
        run: |
          git config --local commit.gpgsign false
          git config --local tag.gpgsign false
          python3 -I -S -B scripts/normalize-actions-checkout-worktree-config.py
          python3 -I -S -B scripts/normalize-actions-checkout-git-info-exclude.py
      - name: Refuse retries and non-main qualification events
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_EVENT_NAME}" = "push"
          test "${GITHUB_REF}" = "refs/heads/main"
          test "${GITHUB_RUN_ATTEMPT}" = "1"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14.6"
      - name: Require the reviewed GIL-enabled CPython lane
        run: >-
          python3 -I -S -B -c 'import sys; raise SystemExit(0 if
          sys.implementation.name == "cpython" and
          sys.version_info == (3, 14, 6, "final", 0) and
          sys._is_gil_enabled() else 1)'
      - name: Validate external action pins
        run: |
          set -euo pipefail
          python3 -I -S -B scripts/check-github-action-pins.py > "${RUNNER_TEMP}/pins.json"
          python3 -O -I -S -B scripts/check-github-action-pins.py > "${RUNNER_TEMP}/pins.opt.json"
          cmp --silent "${RUNNER_TEMP}/pins.json" "${RUNNER_TEMP}/pins.opt.json"
          python3 -I -S -B scripts/check-github-action-pins-self-test.py > "${RUNNER_TEMP}/pins-self.json"
          python3 -O -I -S -B scripts/check-github-action-pins-self-test.py > "${RUNNER_TEMP}/pins-self.opt.json"
          cmp --silent "${RUNNER_TEMP}/pins-self.json" "${RUNNER_TEMP}/pins-self.opt.json"
      - name: Validate v11 capture and normalization hostile suites
        run: |
          set -euo pipefail
          python3 -I -S -B scripts/normalize-actions-checkout-worktree-config-self-test.py
          python3 -O -I -S -B scripts/normalize-actions-checkout-worktree-config-self-test.py
          python3 -I -S -B scripts/normalize-actions-checkout-git-info-exclude-self-test.py
          python3 -O -I -S -B scripts/normalize-actions-checkout-git-info-exclude-self-test.py
          python3 -I -S -B scripts/capture-ksg-m1a-composite-v11.py --self-test > "${RUNNER_TEMP}/hosted.json"
          python3 -O -I -S -B scripts/capture-ksg-m1a-composite-v11.py --self-test > "${RUNNER_TEMP}/hosted.opt.json"
          cmp --silent "${RUNNER_TEMP}/hosted.json" "${RUNNER_TEMP}/hosted.opt.json"
          python3 -I -S -B scripts/capture-ksg-m1a-composite-v11-local-closure.py --self-test > "${RUNNER_TEMP}/local.json"
          python3 -O -I -S -B scripts/capture-ksg-m1a-composite-v11-local-closure.py --self-test > "${RUNNER_TEMP}/local.opt.json"
          cmp --silent "${RUNNER_TEMP}/local.json" "${RUNNER_TEMP}/local.opt.json"
      - name: Exercise the real committed production roster
        run: |
          set -euo pipefail
          python3 -I -S -B scripts/capture-ksg-m1a-composite-v11-local-closure.py --preflight-live > "${RUNNER_TEMP}/preflight.json"
          python3 -O -I -S -B scripts/capture-ksg-m1a-composite-v11-local-closure.py --preflight-live > "${RUNNER_TEMP}/preflight.opt.json"
          cmp --silent "${RUNNER_TEMP}/preflight.json" "${RUNNER_TEMP}/preflight.opt.json"
      - name: Validate the current self-excluding source projection
        run: |
          set -euo pipefail
          python3 -I -S -B scripts/check-current-source-state-v1.py
          python3 -O -I -S -B scripts/check-current-source-state-v1.py
          python3 -I -S -B scripts/check-current-source-state-v1-self-test.py > "${RUNNER_TEMP}/source-self.json"
          python3 -O -I -S -B scripts/check-current-source-state-v1-self-test.py > "${RUNNER_TEMP}/source-self.opt.json"
          cmp --silent "${RUNNER_TEMP}/source-self.json" "${RUNNER_TEMP}/source-self.opt.json"
      - name: Validate independent v11 semantics and hostile suite
        run: |
          set -euo pipefail
          python3 -I -S -B scripts/check-ksg-m1a-composite-v11-self-test.py > "${RUNNER_TEMP}/self.json"
          python3 -O -I -S -B scripts/check-ksg-m1a-composite-v11-self-test.py > "${RUNNER_TEMP}/self.opt.json"
          cmp --silent "${RUNNER_TEMP}/self.json" "${RUNNER_TEMP}/self.opt.json"
          python3 -I -S -B scripts/check-ksg-m1a-composite-v11.py --workflow > "${RUNNER_TEMP}/ksg-m1a-composite-v11-static.json"
          python3 -O -I -S -B scripts/check-ksg-m1a-composite-v11.py --workflow > "${RUNNER_TEMP}/static.opt.json"
          cmp --silent "${RUNNER_TEMP}/ksg-m1a-composite-v11-static.json" "${RUNNER_TEMP}/static.opt.json"
      - name: Upload exact v11 static result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          compression-level: 0
          if-no-files-found: error
          name: ksg-m1a-composite-v11-static-${{ github.sha }}
          path: ${{ runner.temp }}/ksg-m1a-composite-v11-static.json
          retention-days: 90
