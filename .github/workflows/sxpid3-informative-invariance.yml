name: SxPID3 informative-invariance verification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/sxpid3-informative-invariance.yml
      - audit/formal/lean-sxpid3-informative-invariance/**
      - audit/formal/lean/PidFiniteConvergence.lean
      - audit/formal/lean/PidFiniteConvergence/Deterministic.lean
      - audit/formal/lean/PidFiniteConvergence/SxEventBridge.lean
      - audit/formal/lean/lake-manifest.json
      - audit/formal/lean/lakefile.toml
      - audit/formal/lean/lean-toolchain
      - Cargo.lock
      - Cargo.toml
      - crates/pid-core/Cargo.toml
      - crates/pid-core/build.rs
      - crates/pid-core/build_support.rs
      - crates/pid-core/identity/**
      - crates/pid-core/src/**
      - crates/pid-core/tests/sxpid_informative_invariance.rs
      - crates/pid-runlog/**
      - method-catalog.json
      - scripts/check-lean-finite-convergence.py
      - scripts/check-lean-sxpid3-informative-invariance.py
      - scripts/check-lean-sxpid3-informative-invariance-self-test.py
      - scripts/check-lean-sxpid3-informative-invariance-parity.py
      - scripts/check-sxpid3-informative-invariance.py
      - scripts/check-sxpid3-informative-invariance-self-test.py
      - justfile.sxpid3-informative-invariance
  push:
    branches: [main]
    paths:
      - .github/workflows/sxpid3-informative-invariance.yml
      - audit/formal/lean-sxpid3-informative-invariance/**
      - audit/formal/lean/PidFiniteConvergence.lean
      - audit/formal/lean/PidFiniteConvergence/Deterministic.lean
      - audit/formal/lean/PidFiniteConvergence/SxEventBridge.lean
      - audit/formal/lean/lake-manifest.json
      - audit/formal/lean/lakefile.toml
      - audit/formal/lean/lean-toolchain
      - Cargo.lock
      - Cargo.toml
      - crates/pid-core/Cargo.toml
      - crates/pid-core/build.rs
      - crates/pid-core/build_support.rs
      - crates/pid-core/identity/**
      - crates/pid-core/src/**
      - crates/pid-core/tests/sxpid_informative_invariance.rs
      - crates/pid-runlog/**
      - method-catalog.json
      - scripts/check-lean-finite-convergence.py
      - scripts/check-lean-sxpid3-informative-invariance.py
      - scripts/check-lean-sxpid3-informative-invariance-self-test.py
      - scripts/check-lean-sxpid3-informative-invariance-parity.py
      - scripts/check-sxpid3-informative-invariance.py
      - scripts/check-sxpid3-informative-invariance-self-test.py
      - justfile.sxpid3-informative-invariance

permissions:
  contents: read

concurrency:
  group: sxpid3-informative-invariance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lean-replay:
    name: Source-bound Lean 4.33 replay and hostile mutations
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install pinned Elan launcher
        shell: bash
        env:
          ELAN_ARCHIVE_SHA256: df0b2b3a439961ffcbb3985214365ffe40f49bc871df04dff268c7d8e21ca8b2
          ELAN_ARCHIVE_URL: https://github.com/leanprover/elan/releases/download/v4.2.3/elan-x86_64-unknown-linux-gnu.tar.gz
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/elan-x86_64-unknown-linux-gnu.tar.gz"
          install_root="$RUNNER_TEMP/elan-v4.2.3"
          curl --fail --location --proto '=https' --retry 5 --show-error \
            --tlsv1.2 --output "$archive" "$ELAN_ARCHIVE_URL"
          printf '%s  %s\n' "$ELAN_ARCHIVE_SHA256" "$archive" \
            | sha256sum --check --strict
          mkdir -p "$install_root"
          tar -xzf "$archive" -C "$install_root"
          "$install_root/elan-init" -y --default-toolchain none --no-modify-path
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: audit/formal/lean/.lake/packages
          key: sxpid3-informative-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('audit/formal/lean/lean-toolchain') }}-${{ hashFiles('audit/formal/lean/lake-manifest.json') }}-${{ github.sha }}
          restore-keys: sxpid3-informative-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('audit/formal/lean/lean-toolchain') }}-${{ hashFiles('audit/formal/lean/lake-manifest.json') }}
      - name: Fetch pinned Mathlib cache
        working-directory: audit/formal/lean
        run: |
          set -euo pipefail
          test ! -e .lake/build && test ! -L .lake/build
          test ! -e .lake/config && test ! -L .lake/config
          lake exe cache get
      - name: Replay checker and hostile suite with normal/optimized byte parity
        run: python3 -I -S -B scripts/check-lean-sxpid3-informative-invariance-parity.py

  bounded-exact:
    name: Exact binary corpus and hostile mutations
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Replay exact checker and hostile suite in both Python modes
        run: |
          set -euo pipefail
          python3 -I -S -B scripts/check-sxpid3-informative-invariance.py
          python3 -O -I -S -B scripts/check-sxpid3-informative-invariance.py
          python3 -I -S -B scripts/check-sxpid3-informative-invariance-self-test.py
          python3 -O -I -S -B scripts/check-sxpid3-informative-invariance-self-test.py

  rust-regression:
    name: Stable Rust categorical refinement regression
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: "1.89"
      - name: Run the public-API informative-invariance regression
        run: cargo test --locked -p pid-core --no-default-features --test sxpid_informative_invariance
