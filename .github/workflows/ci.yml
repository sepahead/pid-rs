name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  workspace-test:
    name: Workspace default / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo test --locked --workspace --exclude pid-python

  ksg-harmonic-assurance:
    name: KSG integer-harmonic arithmetic and phase isolation
    runs-on: ubuntu-24.04
    # The wrapper replays both the immutable C3 checkpoint and the settled hosted-follow-up
    # commit. The historical and follow-up hostile suites run sequentially in both Python modes.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          # pull_request defaults to a synthetic merge; custody requires the exact PR head.
          ref: "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Replay the frozen arithmetic corpus and exact enclosure
        run: |
          set -euo pipefail
          python3 scripts/generate-ksg-local-arithmetic-oracle.py
          python3 -O scripts/generate-ksg-local-arithmetic-oracle.py
          python3 scripts/check-ksg-harmonic-exact-enclosure.py
          python3 -O scripts/check-ksg-harmonic-exact-enclosure.py
          python3 scripts/check-ksg-harmonic-exact-enclosure-self-test.py
          python3 -O scripts/check-ksg-harmonic-exact-enclosure-self-test.py
      - name: Replay the bounded modular certificate
        run: |
          set -euo pipefail
          python3 scripts/generate-ksg-harmonic-modular-certificate.py
          python3 -O scripts/generate-ksg-harmonic-modular-certificate.py
          python3 scripts/check-ksg-harmonic-modular-certificate.py
          python3 -O scripts/check-ksg-harmonic-modular-certificate.py
          python3 scripts/check-ksg-harmonic-modular-certificate-self-test.py
          python3 -O scripts/check-ksg-harmonic-modular-certificate-self-test.py
      - name: Replay every scoped revision route and its mutations
        run: |
          set -euo pipefail
          for route in \
            --claim-only \
            --release-only \
            --source-only \
            --exact-only \
            --binary64-only \
            --enclosure-only \
            --catalog-only
          do
            python3 scripts/check-ksg-harmonic-revision.py "$route"
            python3 -O scripts/check-ksg-harmonic-revision.py "$route"
          done
          # The self-tests also require the unscoped lifecycle gate to remain red while the
          # active packet is integration_no_go.
          python3 scripts/check-ksg-harmonic-revision-self-test.py --claim-only
          python3 -O scripts/check-ksg-harmonic-revision-self-test.py --claim-only
          python3 scripts/check-ksg-harmonic-revision-self-test.py
          python3 -O scripts/check-ksg-harmonic-revision-self-test.py
      - name: Verify the exact KSG-only Git phase envelope
        run: |
          set -euo pipefail
          worktree_config=".git/config.worktree"
          expected_worktree_config_sha256="443a5f645c23c3d0c0aa09f634b2ad111d46ef61946b598a2fb311678ab47454"
          if [[ ! -d .git || -L .git ]]; then
            printf 'expected a real .git directory at the Actions checkout root\n' >&2
            exit 1
          fi
          if [[ -e "$worktree_config" || -L "$worktree_config" ]]; then
            if [[ ! -f "$worktree_config" || -L "$worktree_config" ]]; then
              printf 'refusing non-regular checkout worktree config: %s\n' \
                "$worktree_config" >&2
              exit 1
            fi
            if [[ "$(stat -c '%h' "$worktree_config")" != "1" ]]; then
              printf 'refusing hard-linked checkout worktree config: %s\n' \
                "$worktree_config" >&2
              exit 1
            fi
            if ! printf '%s  %s\n' \
              "$expected_worktree_config_sha256" "$worktree_config" \
              | sha256sum --check --strict --status
            then
              printf 'checkout worktree config bytes are not the reviewed inert residue\n' >&2
              exit 1
            fi
            unlink -- "$worktree_config"
          fi
          if [[ -e "$worktree_config" || -L "$worktree_config" ]]; then
            printf 'checkout worktree config survived exact normalization\n' >&2
            exit 1
          fi
          scripts/check-ksg-c3-checkpoint.sh
      # Keep ignored build/cache material outside the exact-source custody boundary above.
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Bind ordered KSG and inclusive Ehrlich counts to production paths
        run: |
          set -euo pipefail
          require_summary() {
            local expected="$1"
            local label="$2"
            local output="$3"
            local summary_count
            summary_count="$(printf '%s\n' "$output" | \
              grep -Ec "^test result: ok\\. ${expected} passed; 0 failed; 0 ignored; 0 measured; [0-9]+ filtered out; finished in [^;]+s$" || true)"
            if [[ "$summary_count" -ne 1 ]]; then
              printf '%s\n' "$output" >&2
              printf 'expected one exact successful %s-test harness summary for %s, observed %s\n' \
                "$expected" "$label" "$summary_count" >&2
              exit 1
            fi
          }
          run_witness() {
            local label="$1"
            local test_name="$2"
            shift 2
            local listing count output
            listing="$(cargo test "$@" "$test_name" -- --list 2>&1)"
            count="$(printf '%s\n' "$listing" | grep -c ': test$' || true)"
            if [[ "$count" -ne 1 ]]; then
              printf '%s\n' "$listing" >&2
              printf 'expected one %s witness, observed %s\n' "$label" "$count" >&2
              exit 1
            fi
            output="$(cargo test "$@" "$test_name" -- --exact 2>&1)"
            printf '%s\n' "$output"
            require_summary 1 "$label" "$output"
          }
          for profile in debug release
          do
            profile_args=(--locked)
            if [[ "$profile" == release ]]; then
              profile_args+=(--release)
            fi
            run_witness "W1 $profile" \
              ksg::tests::ksg_ordered_count_witness_reaches_production_diagnostics \
              "${profile_args[@]}" -p pid-core --all-features --lib
            run_witness "W2 $profile" \
              isx::tests::ehrlich_inclusive_counts_reach_the_exact_integer_harmonic_local_term \
              "${profile_args[@]}" -p pid-core --all-features --lib
            run_witness "W2b $profile" \
              isx::tests::ehrlich_all_unique_rows_attain_the_structural_zero_count_endpoint \
              "${profile_args[@]}" -p pid-core --all-features --lib
          done
      - name: Require twelve serial tests before parallel bit equality
        run: |
          set -euo pipefail
          run_profile() {
            local label="$1"
            shift
            local listing count output summary_count
            listing="$(cargo test "$@" -- --list 2>&1)"
            count="$(printf '%s\n' "$listing" | grep -c ': test$' || true)"
            if [[ "$count" -ne 12 ]]; then
              printf '%s\n' "$listing" >&2
              printf 'expected 12 parallel_bit_identity tests for %s, observed %s\n' \
                "$label" "$count" >&2
              exit 1
            fi
            output="$(cargo test "$@" 2>&1)"
            printf '%s\n' "$output"
            summary_count="$(printf '%s\n' "$output" | \
              grep -Ec "^test result: ok\\. 12 passed; 0 failed; 0 ignored; 0 measured; 0 filtered out; finished in [^;]+s$" || true)"
            if [[ "$summary_count" -ne 1 ]]; then
              printf 'expected one exact 12-test successful harness summary for %s, observed %s\n' \
                "$label" "$summary_count" >&2
              exit 1
            fi
          }
          run_profile serial-debug \
            --locked -p pid-core --no-default-features \
            --features experimental-pipelines --test parallel_bit_identity
          run_profile serial-release \
            --locked --release -p pid-core --no-default-features \
            --features experimental-pipelines --test parallel_bit_identity
          run_profile parallel-debug \
            --locked -p pid-core --no-default-features \
            --features experimental-pipelines,parallel --test parallel_bit_identity
          run_profile parallel-release \
            --locked --release -p pid-core --no-default-features \
            --features experimental-pipelines,parallel --test parallel_bit_identity

  formal-finite-convergence:
    name: Finite-alphabet, dependency-color, support-change, and KSG harmonic proof cores
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: Install pinned Elan
        shell: bash
        env:
          ELAN_ARCHIVE_SHA256: df0b2b3a439961ffcbb3985214365ffe40f49bc871df04dff268c7d8e21ca8b2
          ELAN_ARCHIVE_URL: https://github.com/leanprover/elan/releases/download/v4.2.3/elan-x86_64-unknown-linux-gnu.tar.gz
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/elan-x86_64-unknown-linux-gnu.tar.gz"
          install_root="$RUNNER_TEMP/elan-v4.2.3"
          curl --fail --location --proto '=https' --retry 5 --show-error \
            --tlsv1.2 --output "$archive" "$ELAN_ARCHIVE_URL"
          printf '%s  %s\n' "$ELAN_ARCHIVE_SHA256" "$archive" \
            | sha256sum --check --strict
          mkdir -p "$install_root"
          tar -xzf "$archive" -C "$install_root"
          "$install_root/elan-init" -y --default-toolchain none --no-modify-path
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: audit/formal/lean/.lake
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('audit/formal/lean/lean-toolchain') }}-${{ hashFiles('audit/formal/lean/lake-manifest.json') }}-${{ github.sha }}
          restore-keys: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('audit/formal/lean/lean-toolchain') }}-${{ hashFiles('audit/formal/lean/lake-manifest.json') }}
      - name: Fetch the Mathlib cache and build
        working-directory: audit/formal/lean
        run: |
          set -euo pipefail
          lake exe cache get
          lake build
      - name: Replay formal declarations with Lean's kernel checker
        working-directory: audit/formal/lean
        run: lake env leanchecker PidFiniteConvergence
      - run: python3 scripts/check-lean-finite-convergence.py
      - run: python3 scripts/check-lean-finite-convergence-self-test.py
      - run: python3 scripts/check-lean-ksg-integer-harmonic.py
      - run: python3 -O scripts/check-lean-ksg-integer-harmonic.py
      - run: python3 scripts/check-lean-ksg-integer-harmonic-self-test.py
      - run: python3 -O scripts/check-lean-ksg-integer-harmonic-self-test.py
      - run: python3 scripts/check-lean-citation-edge-countermodel.py
      - run: python3 scripts/check-lean-citation-edge-countermodel-self-test.py

  formal-pdf-structure:
    name: Formal LaTeX / PDF inventory and cross-toolchain structure
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: Install pinned Elan
        shell: bash
        env:
          ELAN_ARCHIVE_SHA256: df0b2b3a439961ffcbb3985214365ffe40f49bc871df04dff268c7d8e21ca8b2
          ELAN_ARCHIVE_URL: https://github.com/leanprover/elan/releases/download/v4.2.3/elan-x86_64-unknown-linux-gnu.tar.gz
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/elan-x86_64-unknown-linux-gnu.tar.gz"
          install_root="$RUNNER_TEMP/elan-v4.2.3"
          curl --fail --location --proto '=https' --retry 5 --show-error \
            --tlsv1.2 --output "$archive" "$ELAN_ARCHIVE_URL"
          printf '%s  %s\n' "$ELAN_ARCHIVE_SHA256" "$archive" \
            | sha256sum --check --strict
          mkdir -p "$install_root"
          tar -xzf "$archive" -C "$install_root"
          "$install_root/elan-init" -y --default-toolchain none --no-modify-path
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: audit/formal/lean/.lake
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('audit/formal/lean/lean-toolchain') }}-${{ hashFiles('audit/formal/lean/lake-manifest.json') }}-${{ github.sha }}
          restore-keys: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('audit/formal/lean/lean-toolchain') }}-${{ hashFiles('audit/formal/lean/lake-manifest.json') }}
      - name: Fetch the Mathlib cache and build
        working-directory: audit/formal/lean
        run: |
          set -euo pipefail
          lake exe cache get
          lake build
      - name: Check the typed citation edge and adjacent-arrow countermodel
        run: |
          python3 scripts/check-citation-edge-countermodel.py
          python3 scripts/check-citation-edge-countermodel-self-test.py
      - name: Install the runner TeX toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            chktex \
            latexmk \
            lacheck \
            lmodern \
            poppler-utils \
            texlive-fonts-extra \
            texlive-fonts-recommended \
            texlive-latex-extra \
            texlive-plain-generic
      - name: Rebuild warning-free papers and compare text, page geometry, and embedded fonts
        run: scripts/check-formal-pdf-set.sh --cross-toolchain

  certified-sxpid-reference:
    name: Exact-count directed-rounding SxPID2 reference
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/certified-sxpid
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Install pinned Elan
        shell: bash
        env:
          ELAN_ARCHIVE_SHA256: df0b2b3a439961ffcbb3985214365ffe40f49bc871df04dff268c7d8e21ca8b2
          ELAN_ARCHIVE_URL: https://github.com/leanprover/elan/releases/download/v4.2.3/elan-x86_64-unknown-linux-gnu.tar.gz
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/elan-x86_64-unknown-linux-gnu.tar.gz"
          install_root="$RUNNER_TEMP/elan-v4.2.3"
          curl --fail --location --proto '=https' --retry 5 --show-error \
            --tlsv1.2 --output "$archive" "$ELAN_ARCHIVE_URL"
          printf '%s  %s\n' "$ELAN_ARCHIVE_SHA256" "$archive" \
            | sha256sum --check --strict
          mkdir -p "$install_root"
          tar -xzf "$archive" -C "$install_root"
          "$install_root/elan-init" -y --default-toolchain none --no-modify-path
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: audit/formal/lean/.lake
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('audit/formal/lean/lean-toolchain') }}-${{ hashFiles('audit/formal/lean/lake-manifest.json') }}-${{ github.sha }}
          restore-keys: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('audit/formal/lean/lean-toolchain') }}-${{ hashFiles('audit/formal/lean/lake-manifest.json') }}
      - run: >-
          cargo fetch --locked
          --manifest-path audit/tools/certified-sxpid/Cargo.toml
      - run: cargo fmt --manifest-path audit/tools/certified-sxpid/Cargo.toml --all --check
      - run: >-
          cargo test --locked
          --manifest-path audit/tools/certified-sxpid/Cargo.toml
      - run: >-
          cargo clippy --locked
          --manifest-path audit/tools/certified-sxpid/Cargo.toml
          --all-targets -- -D warnings
      - run: >-
          RUSTDOCFLAGS="-D warnings" cargo doc --locked --no-deps
          --manifest-path audit/tools/certified-sxpid/Cargo.toml
      - run: python3 audit/tools/certified-sxpid/scripts/check-static-policy.py
      - run: python3 audit/tools/certified-sxpid/scripts/check-static-policy-self-test.py
      - run: python3 audit/tools/certified-sxpid/scripts/check-independent-verifier.py
      - run: python3 -O audit/tools/certified-sxpid/scripts/check-independent-verifier.py
      - run: python3 audit/tools/certified-sxpid/scripts/check-exact-products.py
      - run: python3 audit/tools/certified-sxpid/scripts/check-exact-products-self-test.py
      - run: python3 audit/tools/certified-sxpid/scripts/check-nonsyntactic-zero-boundary.py
      - run: python3 audit/tools/certified-sxpid/scripts/challenge-exact-products.py
      - name: Fetch the Mathlib cache and build
        working-directory: audit/formal/lean
        run: |
          set -euo pipefail
          lake exe cache get
          lake build
      - run: python3 scripts/check-lean-exact-log-product.py
      - run: python3 scripts/check-certified-sxpid2-claim.py
      - run: python3 scripts/check-certified-sxpid2-claim-self-test.py
      - run: cargo install cargo-deny --locked --version 0.20.2
      - run: >-
          cargo deny --manifest-path audit/tools/certified-sxpid/Cargo.toml
          --config audit/tools/certified-sxpid/deny.toml check

  certified-sxpid-msrv:
    name: Exact-count SxPID2 reference / MSRV 1.89
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/certified-sxpid-msrv
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: "1.89"
      - run: >-
          cargo test --locked
          --manifest-path audit/tools/certified-sxpid/Cargo.toml

  core-features:
    name: Core ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: no-default-features
            flags: --no-default-features
          - label: parallel
            flags: --no-default-features --features parallel
          - label: experimental-continuous
            flags: --no-default-features --features experimental-continuous
          - label: experimental-hyperbolic
            flags: --no-default-features --features experimental-hyperbolic
          - label: experimental-heuristics
            flags: --no-default-features --features experimental-heuristics
          - label: experimental-hierarchy
            flags: --no-default-features --features experimental-hierarchy
          - label: research-mixed-dimension-pid3
            flags: --no-default-features --features research-mixed-dimension-pid3
          - label: experimental-pipelines
            flags: --no-default-features --features experimental-pipelines
          - label: experimental-all
            flags: --no-default-features --features experimental-all
          - label: all-features
            flags: --all-features
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - shell: bash
        env:
          # An inherited feature-shaped variable is ambient input, not a Cargo activation.
          CARGO_FEATURE_PID_RS_AMBIENT_SENTINEL: inherited-not-cargo
        run: cargo test --locked -p pid-core ${{ matrix.flags }}

  release-scope-coherence:
    name: Release scope and scientific evidence coherence
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: nightly-2026-06-16
          targets: aarch64-apple-darwin
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install exact Z3 for bounded PID and KSG algebra proofs
        shell: bash
        env:
          Z3_ARCHIVE_SHA256: 7288c49a5bd6dbafd7b0b0d1f65956b91672da24b08f09242919af159be3418e
          Z3_ARCHIVE_URL: https://github.com/Z3Prover/z3/releases/download/z3-4.16.0/z3-4.16.0-x64-glibc-2.39.zip
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/z3-4.16.0-x64-glibc-2.39.zip"
          install_root="$RUNNER_TEMP/z3-4.16.0"
          curl --fail --location --proto '=https' --retry 5 --show-error \
            --tlsv1.2 --output "$archive" "$Z3_ARCHIVE_URL"
          printf '%s  %s\n' "$Z3_ARCHIVE_SHA256" "$archive" | sha256sum --check --strict
          mkdir "$install_root"
          unzip -q "$archive" -d "$install_root"
          z3_bin="$install_root/z3-4.16.0-x64-glibc-2.39/bin/z3"
          test -x "$z3_bin"
          dirname "$z3_bin" >> "$GITHUB_PATH"
      - run: cargo install cargo-public-api --locked --version 0.52.0
      - run: python3 scripts/check-software-identity.py
      - run: python3 scripts/check-software-identity-self-test.py
      - run: python3 scripts/check-method-catalog.py
      - run: python3 scripts/check-method-catalog-self-test.py
      - run: python3 scripts/check-ecosystem-capabilities.py
      - run: python3 scripts/check-ecosystem-capabilities-self-test.py
      - run: python3 scripts/check-z3-pid2-algebra.py
      - run: python3 scripts/check-z3-pid2-algebra-self-test.py
      - run: python3 scripts/check-z3-ksg-integer-harmonic.py
      - run: python3 -O scripts/check-z3-ksg-integer-harmonic.py
      - run: python3 scripts/check-z3-ksg-integer-harmonic-self-test.py
      - run: python3 -O scripts/check-z3-ksg-integer-harmonic-self-test.py
      - run: python3 scripts/check-release-scope.py
      - run: scripts/check-release-scope-self-test.sh
      - run: python3 scripts/generate-finite-alphabet-plugin-oracle.py
      - run: python3 scripts/generate-dependency-colored-sxpid-oracle.py
      - run: python3 scripts/generate-support-change-tolerant-sxpid-oracle.py
      - run: python3 scripts/generate-ksg-local-arithmetic-oracle.py
      - run: python3 scripts/generate-sxpid2-exhaustive-oracle.py
      - run: python3 scripts/check-markdown-math.py
      - run: python3 scripts/check-markdown-math-self-test.py
      - run: python3 scripts/check-review-evidence.py
      - run: python3 scripts/check-review-evidence-self-test.py
      - run: scripts/check-public-api-snapshots.sh
        env:
          PID_RS_PUBLIC_API_TOOLCHAIN: nightly-2026-06-16
      - run: scripts/check-public-api-snapshots-self-test.sh
        env:
          PID_RS_PUBLIC_API_TOOLCHAIN: nightly-2026-06-16
      - name: Build docs for every feature profile
        shell: bash
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo +stable doc --locked -p pid-core --no-deps
          cargo +stable doc --locked -p pid-core --no-default-features --no-deps
          for feature in \
            parallel \
            experimental-continuous \
            experimental-hyperbolic \
            experimental-heuristics \
            experimental-hierarchy \
            research-mixed-dimension-pid3 \
            experimental-pipelines \
            experimental-all
          do
            cargo +stable doc --locked -p pid-core \
              --no-default-features --features "$feature" --no-deps
          done
          cargo +stable doc --locked -p pid-core --no-default-features --all-features --no-deps

  cross-platform-all-features:
    name: All features / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo test --locked -p pid-core --all-features

  release-numerics:
    name: Release-mode numerical fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo test --locked --release -p pid-core --all-features

  msrv:
    name: MSRV 1.89 / ${{ matrix.features }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - features: default
            flags: ""
          - features: no-default-features
            flags: --no-default-features
          - features: all-features
            flags: --all-features
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: "1.89"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - shell: bash
        run: cargo check --locked --workspace ${{ matrix.flags }}

  lint:
    name: Rustfmt + Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo fmt --all --check
      - run: cargo fmt --manifest-path fuzz/Cargo.toml --all --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

  docs:
    name: Rustdoc + docs.rs configuration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo doc --locked -p pid-core --no-default-features --no-deps
      - run: cargo doc --locked --workspace --all-features --no-deps
      - run: cargo test --locked --doc -p pid-core --no-default-features
      - run: cargo test --locked --doc -p pid-core --all-features
      - run: cargo test --locked --doc -p pid-runlog --all-features
      # `--lib` is required: under `--all-features` these packages expose several buildable
      # targets (the `exp0` bin, examples, benches), and cargo refuses to forward trailing
      # rustdoc arguments to more than one target.
      - run: cargo rustdoc --locked -p pid-core --all-features --lib -- --cfg docsrs
      - run: cargo rustdoc --locked -p pid-runlog --all-features --lib -- --cfg docsrs

  property-tests:
    name: Deterministic property and identity suites
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo test --locked -p pid-core --all-features --test discrete_pid_properties
      - run: cargo test --locked -p pid-core --all-features --test sxpid_properties
      - run: cargo test --locked -p pid-core --all-features --test sxpid_axioms
      - run: cargo test --locked -p pid-core --all-features --test parallel_bit_identity

  fuzz-corpus:
    name: Fixed fuzz corpus smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo install cargo-fuzz --locked --version 0.13.2
      - run: cd fuzz && sha256sum --check corpus/SHA256SUMS
      - shell: bash
        run: |
          for target in \
            matrix_shape public_configs_shells quantizer_sxpid experimental_antichain \
            runlog_json_manifest experimental_hyperbolic resource_budgets
          do
            cargo fuzz run "$target" -- -runs=128 -max_len=16384 -seed=424242
          done

  miri:
    name: Miri / pure safe-Rust boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MIRIFLAGS: -Zmiri-strict-provenance
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: nightly
          components: miri
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo miri setup
      - run: cargo miri test --locked -p pid-core --lib --no-default-features matrix::tests
      - run: cargo miri test --locked -p pid-core --lib --no-default-features resource::tests

  coverage:
    name: Coverage threshold
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo install cargo-llvm-cov --locked --version 0.8.7
      - run: >-
          cargo llvm-cov --locked --workspace --exclude pid-python --all-features
          --lcov --output-path lcov.info --fail-under-lines 70
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-lcov
          path: lcov.info
          if-no-files-found: error

  static-release-quality:
    name: Package + semver + unused dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo install cargo-semver-checks --locked --version 0.48.0
      - run: cargo install cargo-machete --locked --version 0.9.2
      - run: cargo install cargo-local-registry --locked --version 0.2.12
      - run: python -m pip install cffconvert==2.0.0
      - run: cffconvert --validate -i CITATION.cff
      - name: Check candidate or exact tagged release metadata
        shell: bash
        run: scripts/check-current-release-state.sh
      - run: scripts/check-release-state-self-test.sh
      - run: scripts/check-handoff-intake.py
      - run: scripts/check-handoff-intake-self-test.py
      - run: scripts/collect-repository-snapshot.py --validate audit/evidence/repository-snapshot.json
      - run: scripts/check-repository-snapshot-self-test.sh
      - run: scripts/repin-pidrs-self-test.sh
      - run: cargo machete
      - name: Check SemVer against the latest earlier 1.x tag
        shell: bash
        run: |
          baseline="$(git tag --list 'v1.*' --sort=-version:refname \
            | awk -v current="${GITHUB_REF_NAME:-}" '$0 != current { print; exit }')"
          if [[ -n "$baseline" ]]; then
            cargo semver-checks check-release -p pid-core --baseline-rev "$baseline"
          else
            # The 0.9 review boundary is intentionally breaking from 0.4. The permissive major
            # policy inventories those breaks; it does not claim that 1.x compatibility has begun.
            cargo semver-checks check-release -p pid-core \
              --baseline-rev ad489f5bf5e15c164c599d069a6bee0f338c0e48 --release-type major
          fi
      - run: cargo publish --locked -p pid-runlog --dry-run
      - name: Build and test the exact package archives against a temporary registry
        run: scripts/verify-package-archives.sh

  smoke:
    name: Examples + exp0 + run-log replay
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo run --locked --release -p pid-core --all-features --example ksg_and_pid
      - run: cargo run --locked --release -p pid-core --example discrete_sxpid
      - shell: bash
        run: |
          cargo run --locked -p pid-core --all-features --bin exp0 -- \
            --seeds 1 --summary-json /tmp/summary.json --runlog /tmp/run.jsonl
          cargo run --locked -p pid-runlog --bin pid-runlog-replay -- \
            --validate /tmp/run.jsonl

  supply-chain:
    name: Supply chain without advisory exceptions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --all-features --locked

  sbom:
    name: Workspace CycloneDX SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo install cargo-cyclonedx --locked --version 0.5.9
      - run: cargo cyclonedx --all --all-features --format json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: workspace-sbom
          path: "**/*.cdx.json"
          if-no-files-found: error

  secrets:
    name: Secret scan (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned gitleaks
        shell: bash
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output /tmp/gitleaks.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" \
            | sha256sum --check
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
      - name: Self-test narrow public-digest allowlists
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          import tempfile
          from pathlib import Path

          config = Path.cwd() / ".gitleaks.toml"
          # Construct a high-entropy-looking public digest without embedding a 64-hex fixture in CI.
          digest = "0123456789abcdef" * 4
          quote = '"'
          positive_only = (
              (
                  "audit/evidence/repository-snapshot.json",
                  f'{quote}api_projection_sha256{quote}: {quote}{digest}{quote},',
              ),
              (
                  "release-scope-1.0.json",
                  f'{quote}public_api_snapshot_sha256{quote}: {quote}{digest}{quote},',
              ),
              (
                  "audit/api/public-api/pid-core-signature-revisions.json",
                  f'{quote}public_api_snapshot_sha256{quote}: {quote}{digest}{quote},',
              ),
              (
                  "audit/evidence/fable5-ksg-rev4-settled-hostile-20260727T120200Z-context.md",
                  f'123 {quote}public_api_snapshot_sha256{quote}: {quote}{digest}{quote},',
              ),
          )
          cases = (
              (
                  "claims/KSG-INTEGER-HARMONIC-001/active-packet-v4.json",
                  f'{quote}mutant_token_stream_sha256{quote}: {quote}{digest}{quote},',
                  (
                      f'mutant_token_stream_sha256 = {quote}{digest}{quote},',
                      f'{quote}mutant_token_stream_sha256: {quote}{digest}{quote},',
                      f'mutant_token_stream_sha256{quote}: {quote}{digest}{quote},',
                      f'{quote}token_stream_sha256{quote}: {quote}{digest}{quote},',
                  ),
              ),
              (
                  "claims/KSG-INTEGER-HARMONIC-001/failures/smtlib-shape-and-snapshot-v4.json",
                  f'{quote}token_stream_sha256{quote}: {quote}{digest}{quote},',
                  (
                      f'token_stream_sha256 = {quote}{digest}{quote},',
                      f'{quote}token_stream_sha256: {quote}{digest}{quote},',
                      f'token_stream_sha256{quote}: {quote}{digest}{quote},',
                      f'{quote}mutant_token_stream_sha256{quote}: {quote}{digest}{quote},',
                  ),
              ),
              (
                  "scripts/check-ksg-harmonic-revision.py",
                  f'{quote}mutant_token_stream_sha256{quote}: {quote}{digest}{quote},',
                  (
                      f'mutant_token_stream_sha256 = {quote}{digest}{quote},',
                      f'{quote}mutant_token_stream_sha256: {quote}{digest}{quote},',
                      f'mutant_token_stream_sha256{quote}: {quote}{digest}{quote},',
                      f'{quote}token_stream_sha256{quote}: {quote}{digest}{quote},',
                  ),
              ),
              (
                  "scripts/check-z3-ksg-integer-harmonic.py",
                  f'token_stream_sha256={quote}{digest}{quote},',
                  (
                      f'{quote}token_stream_sha256{quote}: {quote}{digest}{quote},',
                      f'{quote}token_stream_sha256 = {quote}{digest}{quote},',
                      f'token_stream_sha256{quote} = {quote}{digest}{quote},',
                      f'mutant_token_stream_sha256 = {quote}{digest}{quote},',
                  ),
              ),
          )

          def scan(files):
              with tempfile.TemporaryDirectory(prefix="pid-rs-gitleaks-self-test-") as raw:
                  root = Path(raw) / "source"
                  root.mkdir()
                  for relative, line in files:
                      destination = root / relative
                      destination.parent.mkdir(parents=True, exist_ok=True)
                      destination.write_text(line + "\n", encoding="utf-8")
                  report = Path(raw) / "report.json"
                  completed = subprocess.run(
                      (
                          "/tmp/gitleaks",
                          "dir",
                          ".",
                          "--config",
                          str(config),
                          "--gitleaks-ignore-path",
                          "/dev/null",
                          "--redact",
                          "--no-banner",
                          "--report-format",
                          "json",
                          "--report-path",
                          str(report),
                      ),
                      cwd=root,
                      check=False,
                      stdout=subprocess.DEVNULL,
                      stderr=subprocess.PIPE,
                      text=True,
                  )
                  findings = json.loads(report.read_text(encoding="utf-8")) if report.exists() else []
                  return completed.returncode, findings, completed.stderr

          intended_files = positive_only + tuple((path, intended) for path, intended, _ in cases)
          code, findings, stderr = scan(intended_files)
          if code != 0 or findings:
              raise SystemExit(f"intended public-digest controls were rejected: {stderr}")

          detected = 0
          for path, line in intended_files:
              key = next(
                  candidate
                  for candidate in (
                      "public_api_snapshot_sha256",
                      "api_projection_sha256",
                      "mutant_token_stream_sha256",
                      "token_stream_sha256",
                  )
                  if candidate in line
              )
              original_negatives = (
                  ("nearby_path", path + ".nearby", line),
                  ("nearby_key", path, line.replace(key, "nearby_" + key, 1)),
                  ("nonhex_value", path, line.replace(digest, "g" + digest[1:], 1)),
                  ("secret_prefix", path, line.replace(digest, "secret_" + digest, 1)),
              )
              for negative_class, negative_path, negative_line in original_negatives:
                  code, findings, stderr = scan(((negative_path, negative_line),))
                  if code != 1 or len(findings) != 1 or findings[0].get("RuleID") != "generic-api-key":
                      raise SystemExit(
                          f"public-digest {negative_class} control escaped for {path}: "
                          f"exit={code}, findings={len(findings)}, stderr={stderr}"
                      )
                  detected += 1

          for path, _, malformed in cases:
              for line in malformed:
                  code, findings, stderr = scan(((path, line),))
                  if code != 1 or len(findings) != 1 or findings[0].get("RuleID") != "generic-api-key":
                      raise SystemExit(
                          f"malformed public-digest control escaped for {path}: "
                          f"exit={code}, findings={len(findings)}, stderr={stderr}"
                      )
                  detected += 1
          if detected != 48:
              raise SystemExit(f"expected 48 rejected controls, observed {detected}")
          print("Gitleaks public-digest allowlist self-test passed: 8 intended, 48 rejected")
          PY
      - run: /tmp/gitleaks git --redact --no-banner --log-opts="--all" .

  python:
    name: Python ${{ matrix.python }} / NumPy ${{ matrix.numpy }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
            numpy: "1.26.4"
          - os: macos-latest
            python: "3.11"
            numpy: "1.26.4"
          - os: windows-latest
            python: "3.11"
            numpy: "1.26.4"
          - os: ubuntu-latest
            python: "3.12"
            numpy: "1.26.4"
          - os: ubuntu-latest
            python: "3.13"
            numpy: "2.5.1"
          - os: ubuntu-latest
            python: "3.14"
            numpy: "2.5.1"
          - os: macos-latest
            python: "3.14"
            numpy: "2.5.1"
          - os: windows-latest
            python: "3.14"
            numpy: "2.5.1"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: python -m pip install maturin==1.14.1 numpy==${{ matrix.numpy }} pytest==9.1.1 mypy==1.19.1
      - run: maturin build --release --locked --manifest-path crates/pid-python/Cargo.toml --out dist
      - run: python -m pip install --no-index --find-links dist pid-core-rs==0.9.0
      - run: python -m pip check
      - run: pytest crates/pid-python/tests -q
      # Maturin exposes one private native submodule; the narrow allowlist keeps the public package
      # root checked exhaustively.
      - run: >-
          python -m mypy.stubtest pid_core_rs
          --allowlist crates/pid-python/stubtest.allowlist
      - shell: bash
        run: |
          python - <<'PY'
          import pathlib
          import zipfile

          wheels = list(pathlib.Path("dist").glob("*.whl"))
          assert len(wheels) == 1, wheels
          with zipfile.ZipFile(wheels[0]) as archive:
              names = archive.namelist()
          assert any(name.endswith("pid_core_rs/__init__.pyi") for name in names), names
          assert any(name.endswith("py.typed") for name in names), names
          assert any(".dist-info/sboms/" in name for name in names), names
          PY

  python-experimental-smoke:
    name: Python experimental namespace smoke
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: python -m pip install maturin==1.14.1 numpy==2.5.1 pytest==9.1.1
      - run: >-
          maturin build --release --locked
          --manifest-path crates/pid-python/Cargo.toml
          --features python-experimental --out dist
      - run: python -m pip install --no-index --find-links dist pid-core-rs==0.9.0
      - run: python -m pip check
      - run: pytest crates/pid-python/tests -q
        env:
          PID_CORE_RS_EXPECT_EXPERIMENTAL: "1"
