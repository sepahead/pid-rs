name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  workspace-test:
    name: Workspace default / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo test --locked --workspace --exclude pid-python

  advisory-archive-accounting:
    name: Bounded inert advisory-archive accounting
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Check bounded accounting and hostile mutations in both Python modes
        run: |
          set -euo pipefail
          python3 -I -S -B scripts/check-advisory-councils-archive.py > "${RUNNER_TEMP}/advisory.json"
          python3 -O -I -S -B scripts/check-advisory-councils-archive.py > "${RUNNER_TEMP}/advisory.optimized.json"
          cmp --silent "${RUNNER_TEMP}/advisory.json" "${RUNNER_TEMP}/advisory.optimized.json"
          python3 -I -S -B scripts/check-advisory-councils-archive-self-test.py > "${RUNNER_TEMP}/advisory-self.json"
          python3 -O -I -S -B scripts/check-advisory-councils-archive-self-test.py > "${RUNNER_TEMP}/advisory-self.optimized.json"
          cmp --silent "${RUNNER_TEMP}/advisory-self.json" "${RUNNER_TEMP}/advisory-self.optimized.json"

  ksg-harmonic-assurance:
    name: KSG integer-harmonic arithmetic and phase isolation
    runs-on: ubuntu-24.04
    # The wrapper replays both the immutable C3 checkpoint and the settled hosted-follow-up
    # commit. The historical and follow-up hostile suites run sequentially in both Python modes.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          # pull_request defaults to a synthetic merge; custody requires the exact PR head.
          ref: "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Enforce exact GitHub Action pins and mutation closure
        run: |
          set -euo pipefail
          python3 -I -S -B scripts/check-github-action-pins.py > "${RUNNER_TEMP}/action-pins.json"
          python3 -O -I -S -B scripts/check-github-action-pins.py > "${RUNNER_TEMP}/action-pins.optimized.json"
          cmp --silent "${RUNNER_TEMP}/action-pins.json" "${RUNNER_TEMP}/action-pins.optimized.json"
          python3 -I -S -B scripts/check-github-action-pins-self-test.py > "${RUNNER_TEMP}/action-pins-self.json"
          python3 -O -I -S -B scripts/check-github-action-pins-self-test.py > "${RUNNER_TEMP}/action-pins-self.optimized.json"
          cmp --silent "${RUNNER_TEMP}/action-pins-self.json" "${RUNNER_TEMP}/action-pins-self.optimized.json"
      - name: Replay the frozen arithmetic corpus and exact enclosure
        run: |
          set -euo pipefail
          python3 scripts/generate-ksg-local-arithmetic-oracle.py
          python3 -O scripts/generate-ksg-local-arithmetic-oracle.py
          python3 scripts/check-ksg-harmonic-exact-enclosure.py
          python3 -O scripts/check-ksg-harmonic-exact-enclosure.py
          python3 scripts/check-ksg-harmonic-exact-enclosure-self-test.py
          python3 -O scripts/check-ksg-harmonic-exact-enclosure-self-test.py
      - name: Replay the bounded modular certificate
        run: |
          set -euo pipefail
          python3 scripts/generate-ksg-harmonic-modular-certificate.py
          python3 -O scripts/generate-ksg-harmonic-modular-certificate.py
          python3 scripts/check-ksg-harmonic-modular-certificate.py
          python3 -O scripts/check-ksg-harmonic-modular-certificate.py
          python3 scripts/check-ksg-harmonic-modular-certificate-self-test.py
          python3 -O scripts/check-ksg-harmonic-modular-certificate-self-test.py
      - name: Replay every scoped revision route and its mutations
        run: |
          set -euo pipefail
          # The descendant gate replays five live-applicable revision-4 routes and the complete
          # current catalog authority. Exact-tree replay alone retains the superseded release-only
          # route and the separately historical-only frozen catalog route.
          python3 -I -S -B scripts/check-ksg-harmonic-revision-v4-preservation.py
          python3 -O -I -S -B scripts/check-ksg-harmonic-revision-v4-preservation.py
          python3 -I -S -B scripts/check-ksg-harmonic-revision-v4-preservation.py --historical-tree-replay
          python3 -O -I -S -B scripts/check-ksg-harmonic-revision-v4-preservation.py --historical-tree-replay
          python3 -I -S -B scripts/check-ksg-harmonic-revision-v4-preservation-self-test.py
          python3 -O -I -S -B scripts/check-ksg-harmonic-revision-v4-preservation-self-test.py
      - name: Verify the exact KSG-only Git phase envelope
        run: |
          set -euo pipefail
          worktree_config=".git/config.worktree"
          expected_worktree_config_sha256="443a5f645c23c3d0c0aa09f634b2ad111d46ef61946b598a2fb311678ab47454"
          if [[ ! -d .git || -L .git ]]; then
            printf 'expected a real .git directory at the Actions checkout root\n' >&2
            exit 1
          fi
          if [[ -e "$worktree_config" || -L "$worktree_config" ]]; then
            if [[ ! -f "$worktree_config" || -L "$worktree_config" ]]; then
              printf 'refusing non-regular checkout worktree config: %s\n' \
                "$worktree_config" >&2
              exit 1
            fi
            if [[ "$(stat -c '%h' "$worktree_config")" != "1" ]]; then
              printf 'refusing hard-linked checkout worktree config: %s\n' \
                "$worktree_config" >&2
              exit 1
            fi
            if ! printf '%s  %s\n' \
              "$expected_worktree_config_sha256" "$worktree_config" \
              | sha256sum --check --strict --status
            then
              printf 'checkout worktree config bytes are not the reviewed inert residue\n' >&2
              exit 1
            fi
            unlink -- "$worktree_config"
          fi
          if [[ -e "$worktree_config" || -L "$worktree_config" ]]; then
            printf 'checkout worktree config survived exact normalization\n' >&2
            exit 1
          fi
          scripts/check-ksg-c3-checkpoint.sh
      - name: Verify the current KSG M1a direct-child lifecycle
        run: |
          set -euo pipefail
          anchor="bbdfda40f0a49a2260b10eafdcb438fc61ae94e9"
          head="$(git rev-parse HEAD)"
          python3 -I -S -B scripts/check-ksg-m1a-phase.py --validate-policy-only
          python3 -O -I -S -B scripts/check-ksg-m1a-phase.py --validate-policy-only
          python3 -I -S -B scripts/check-ksg-m1a-phase-self-test.py
          python3 -O -I -S -B scripts/check-ksg-m1a-phase-self-test.py
          if [[ "$GITHUB_EVENT_NAME" == "push" ]] \
            && [[ "$GITHUB_REF" == "refs/heads/main" ]] \
            && [[ "$head" == "$GITHUB_SHA" ]] \
            && [[ "$(git rev-list --parents -n 1 "$head" | wc -w | tr -d ' ')" == "2" ]] \
            && [[ "$(git rev-parse "${head}^")" == "$anchor" ]]
          then
            if git show-ref --verify --quiet refs/heads/main
            then
              if [[ "$(git rev-parse refs/heads/main)" != "$head" ]]
              then
                printf 'pre-existing local main does not resolve to the captured push SHA\n' >&2
                exit 1
              fi
              git switch main
            else
              git switch --create main "$head"
            fi
            if [[ "$(git symbolic-ref --short HEAD)" != "main" ]] \
              || [[ "$(git rev-parse HEAD)" != "$head" ]]
            then
              printf 'failed to attach exact pushed SHA to the ephemeral local main branch\n' >&2
              exit 1
            fi
            candidate_tree="$(git rev-parse "${head}^{tree}")"
            python3 -I -S -B scripts/check-ksg-m1a-phase.py \
              --mode postcommit \
              --expected-candidate-tree "$candidate_tree" \
              --checkpoint-commit "$head"
            python3 -O -I -S -B scripts/check-ksg-m1a-phase.py \
              --mode postcommit \
              --expected-candidate-tree "$candidate_tree" \
              --checkpoint-commit "$head"
          else
            printf 'current checkout is not the exact direct-child push on main; M1a credit replay not applicable\n'
          fi
      # BEGIN KSG_M1A_HOSTED_RECOVERY_WORKFLOW_V1
      - name: Verify the KSG M1a hosted-recovery lifecycle
        run: |
          set -euo pipefail
          failed_correction="7473e62acef6077c2c1147e09d5d1297f2a2874b"
          composite_receipt="audit/evidence/ksg-rev4-m1a-composite-receipt-v3-2026-08-13.json"
          head="$(git rev-parse HEAD)"
          expected_checkout_sha="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          if [[ "$head" != "$expected_checkout_sha" ]]
          then
            printf 'checked-out HEAD does not equal the event-specific exact source SHA\n' >&2
            exit 1
          fi
          parent_record="$(git rev-list --parents -n 1 "$head")"
          read -r -a parent_fields <<< "$parent_record"
          if [[ "${#parent_fields[@]}" -lt 1 ]] \
            || [[ "${parent_fields[0]}" != "$head" ]]
          then
            printf 'cannot resolve the exact checked-out commit parent record\n' >&2
            exit 1
          fi
          parent_count="$(( ${#parent_fields[@]} - 1 ))"
          direct_parent=""
          if [[ "$parent_count" == "1" ]]
          then
            direct_parent="${parent_fields[1]}"
          fi
          python3 -I -S -B scripts/check-ksg-m1a-hosted-recovery.py \
            --validate-policy-only
          python3 -O -I -S -B scripts/check-ksg-m1a-hosted-recovery.py \
            --validate-policy-only
          python3 -I -S -B scripts/check-ksg-m1a-hosted-recovery-self-test.py
          python3 -O -I -S -B scripts/check-ksg-m1a-hosted-recovery-self-test.py
          if [[ "$parent_count" == "1" ]] \
            && [[ "$direct_parent" == "$failed_correction" ]]
          then
            candidate_tree="$(git rev-parse "${head}^{tree}")"
            # Validate the exact sole-child recovery before push. Pull-request and diagnostic
            # checkouts stay detached and receive no hosted or lifecycle credit.
            if git symbolic-ref -q HEAD >/dev/null
            then
              printf 'exact hosted-recovery checkout is unexpectedly attached before candidate validation\n' >&2
              exit 1
            fi
            python3 -I -S -B scripts/check-ksg-m1a-hosted-recovery.py \
              --mode candidate-commit \
              --expected-candidate-tree "$candidate_tree" \
              --checkpoint-commit "$head"
            python3 -O -I -S -B scripts/check-ksg-m1a-hosted-recovery.py \
              --mode candidate-commit \
              --expected-candidate-tree "$candidate_tree" \
              --checkpoint-commit "$head"
          fi
          if [[ "$GITHUB_EVENT_NAME" == "push" ]] \
            && [[ "$GITHUB_REF" == "refs/heads/main" ]] \
            && [[ "$head" == "$GITHUB_SHA" ]] \
            && [[ "$parent_count" == "1" ]] \
            && [[ "$direct_parent" == "$failed_correction" ]]
          then
            if git show-ref --verify --quiet refs/heads/main
            then
              if [[ "$(git rev-parse refs/heads/main)" != "$head" ]]
              then
                printf 'pre-existing local main does not resolve to the captured hosted-recovery SHA\n' >&2
                exit 1
              fi
              git switch main
            else
              git switch --create main "$head"
            fi
            if [[ "$(git symbolic-ref --short HEAD)" != "main" ]] \
              || [[ "$(git rev-parse HEAD)" != "$head" ]]
            then
              printf 'failed to attach exact hosted-recovery SHA to ephemeral local main\n' >&2
              exit 1
            fi
            candidate_tree="$(git rev-parse "${head}^{tree}")"
            python3 -I -S -B scripts/check-ksg-m1a-hosted-recovery.py \
              --mode postcommit \
              --expected-candidate-tree "$candidate_tree" \
              --checkpoint-commit "$head"
            python3 -O -I -S -B scripts/check-ksg-m1a-hosted-recovery.py \
              --mode postcommit \
              --expected-candidate-tree "$candidate_tree" \
              --checkpoint-commit "$head"
          else
            printf 'current checkout is not the exact sole-child hosted-recovery push on main; strict postcommit replay is not applicable and no credit is granted\n'
          fi
          if [[ -f "$composite_receipt" ]]
          then
            receipt_recovery="$(
              python3 -I -S -B - "$composite_receipt" <<'PY'
          import json
          from pathlib import Path
          import re
          import sys


          def unique(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError(f"duplicate key: {key}")
                  result[key] = value
              return result


          raw = Path(sys.argv[1]).read_bytes()
          if len(raw) > 24 * 1024 * 1024:
              raise SystemExit("composite receipt exceeds the reviewed JSON bound")
          try:
              value = json.loads(raw, object_pairs_hook=unique)
          except (UnicodeDecodeError, ValueError, json.JSONDecodeError) as error:
              raise SystemExit(f"composite receipt is not strict JSON: {error}") from None
          recovery = value.get("hosted_recovery") if isinstance(value, dict) else None
          commit = recovery.get("commit") if isinstance(recovery, dict) else None
          if not isinstance(commit, str) or re.fullmatch(r"[0-9a-f]{40}", commit) is None:
              raise SystemExit("composite receipt recovery commit is malformed")
          sys.stdout.write(commit)
          PY
            )"
            if [[ "$GITHUB_EVENT_NAME" == "push" ]] \
              && [[ "$GITHUB_REF" == "refs/heads/main" ]] \
              && [[ "$head" == "$GITHUB_SHA" ]] \
              && [[ "$parent_count" == "1" ]] \
              && [[ "$direct_parent" == "$receipt_recovery" ]]
            then
              if git symbolic-ref -q HEAD >/dev/null
              then
                printf 'exact composite-receipt checkout is unexpectedly attached before descendant validation\n' >&2
                exit 1
              fi
              python3 -I -S -B scripts/check-ksg-m1a-hosted-recovery.py \
                --validate-composite-receipt < "$composite_receipt"
              python3 -O -I -S -B scripts/check-ksg-m1a-hosted-recovery.py \
                --validate-composite-receipt < "$composite_receipt"
            else
              printf 'composite receipt is retained outside its exact direct-child push; sole-child validation is not applicable and no credit is granted\n'
            fi
          fi
      # END KSG_M1A_HOSTED_RECOVERY_WORKFLOW_V1
      # Keep ignored build/cache material outside the exact-source custody boundary above.
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Bind ordered KSG and inclusive Ehrlich counts to production paths
        run: |
          set -euo pipefail
          require_summary() {
            local expected="$1"
            local label="$2"
            local output="$3"
            local summary_count
            summary_count="$(printf '%s\n' "$output" | \
              grep -Ec "^test result: ok\\. ${expected} passed; 0 failed; 0 ignored; 0 measured; [0-9]+ filtered out; finished in [^;]+s$" || true)"
            if [[ "$summary_count" -ne 1 ]]; then
              printf '%s\n' "$output" >&2
              printf 'expected one exact successful %s-test harness summary for %s, observed %s\n' \
                "$expected" "$label" "$summary_count" >&2
              exit 1
            fi
          }
          run_witness() {
            local label="$1"
            local test_name="$2"
            shift 2
            local listing count output
            listing="$(cargo test "$@" "$test_name" -- --list 2>&1)"
            count="$(printf '%s\n' "$listing" | grep -c ': test$' || true)"
            if [[ "$count" -ne 1 ]]; then
              printf '%s\n' "$listing" >&2
              printf 'expected one %s witness, observed %s\n' "$label" "$count" >&2
              exit 1
            fi
            output="$(cargo test "$@" "$test_name" -- --exact 2>&1)"
            printf '%s\n' "$output"
            require_summary 1 "$label" "$output"
          }
          for profile in debug release
          do
            profile_args=(--locked)
            if [[ "$profile" == release ]]; then
              profile_args+=(--release)
            fi
            run_witness "W1 $profile" \
              ksg::tests::ksg_ordered_count_witness_reaches_production_diagnostics \
              "${profile_args[@]}" -p pid-core --all-features --lib
            run_witness "W1b predecessor $profile" \
              ksg::tests::ksg_strict_radius_predecessor_reaches_both_backends \
              "${profile_args[@]}" -p pid-core --all-features --lib
            run_witness "W1b predecessor swapped $profile" \
              ksg::tests::ksg_strict_radius_predecessor_preserves_swapped_ordered_counts \
              "${profile_args[@]}" -p pid-core --all-features --lib
            run_witness "W1b xblocks $profile" \
              ksg::tests::xblocks_strict_radius_predecessor_reaches_both_backends \
              "${profile_args[@]}" -p pid-core --all-features --lib
            run_witness "W1b xblocks swapped $profile" \
              ksg::tests::xblocks_strict_radius_predecessor_preserves_selected_bits_when_marginals_swap \
              "${profile_args[@]}" -p pid-core --all-features --lib
            run_witness "W1b overflow parity $profile" \
              ksg::kdtree_parity_tests::overflowing_coordinate_span_returns_numerical_instability_on_both_backends \
              "${profile_args[@]}" -p pid-core --all-features --lib
            run_witness "W2 $profile" \
              isx::tests::ehrlich_inclusive_counts_reach_the_exact_integer_harmonic_local_term \
              "${profile_args[@]}" -p pid-core --all-features --lib
            run_witness "W2b $profile" \
              isx::tests::ehrlich_all_unique_rows_attain_the_structural_zero_count_endpoint \
              "${profile_args[@]}" -p pid-core --all-features --lib
          done
      - name: Require twelve serial tests before parallel bit equality
        run: |
          set -euo pipefail
          run_profile() {
            local label="$1"
            shift
            local listing count output summary_count
            listing="$(cargo test "$@" -- --list 2>&1)"
            count="$(printf '%s\n' "$listing" | grep -c ': test$' || true)"
            if [[ "$count" -ne 12 ]]; then
              printf '%s\n' "$listing" >&2
              printf 'expected 12 parallel_bit_identity tests for %s, observed %s\n' \
                "$label" "$count" >&2
              exit 1
            fi
            output="$(cargo test "$@" 2>&1)"
            printf '%s\n' "$output"
            summary_count="$(printf '%s\n' "$output" | \
              grep -Ec "^test result: ok\\. 12 passed; 0 failed; 0 ignored; 0 measured; 0 filtered out; finished in [^;]+s$" || true)"
            if [[ "$summary_count" -ne 1 ]]; then
              printf 'expected one exact 12-test successful harness summary for %s, observed %s\n' \
                "$label" "$summary_count" >&2
              exit 1
            fi
          }
          run_profile serial-debug \
            --locked -p pid-core --no-default-features \
            --features experimental-pipelines --test parallel_bit_identity
          run_profile serial-release \
            --locked --release -p pid-core --no-default-features \
            --features experimental-pipelines --test parallel_bit_identity
          run_profile parallel-debug \
            --locked -p pid-core --no-default-features \
            --features experimental-pipelines,parallel --test parallel_bit_identity
          run_profile parallel-release \
            --locked --release -p pid-core --no-default-features \
            --features experimental-pipelines,parallel --test parallel_bit_identity

  formal-finite-convergence:
    name: Formal proof cores, frozen Lean 4.33.0 replay, and historical packet custody
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: Normalize reviewed Git info/exclude checkout residue
        run: python3 -I -S -B scripts/normalize-actions-checkout-git-info-exclude.py
      - name: Select compatible Python 3.12 series for packet policy self-tests
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Check local Lean 4.32.2 source and policy/custody controls (Darwin reviewed pins; Linux hosted_pending; no live archive replay)
        run: |
          python3 -I -S -B scripts/check-lean-kernel-14576-self-test.py
          python3 -O -I -S -B scripts/check-lean-kernel-14576-self-test.py
          python3 -I -S -B scripts/check-lean-toolchain-custody-self-test.py
          python3 -O -I -S -B scripts/check-lean-toolchain-custody-self-test.py
      - name: Install pinned Elan
        shell: bash
        env:
          ELAN_ARCHIVE_SHA256: df0b2b3a439961ffcbb3985214365ffe40f49bc871df04dff268c7d8e21ca8b2
          ELAN_ARCHIVE_URL: https://github.com/leanprover/elan/releases/download/v4.2.3/elan-x86_64-unknown-linux-gnu.tar.gz
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/elan-x86_64-unknown-linux-gnu.tar.gz"
          install_root="$RUNNER_TEMP/elan-v4.2.3"
          curl --fail --location --proto '=https' --retry 5 --show-error \
            --tlsv1.2 --output "$archive" "$ELAN_ARCHIVE_URL"
          printf '%s  %s\n' "$ELAN_ARCHIVE_SHA256" "$archive" \
            | sha256sum --check --strict
          mkdir -p "$install_root"
          tar -xzf "$archive" -C "$install_root"
          "$install_root/elan-init" -y --default-toolchain none --no-modify-path
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: audit/formal/lean/.lake/packages
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('audit/formal/lean/lean-toolchain') }}-${{ hashFiles('audit/formal/lean/lake-manifest.json') }}-${{ github.sha }}
          restore-keys: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('audit/formal/lean/lean-toolchain') }}-${{ hashFiles('audit/formal/lean/lake-manifest.json') }}
      - name: Fetch the Mathlib cache and build
        working-directory: audit/formal/lean
        run: |
          set -euo pipefail
          test ! -e .lake/build && test ! -L .lake/build
          test ! -e .lake/config && test ! -L .lake/config
          lake exe cache get
          lake build PidFiniteConvergence
      - name: Replay formal declarations with Lean's kernel checker
        working-directory: audit/formal/lean
        run: lake env leanchecker --fresh PidFiniteConvergence
      - run: python3 scripts/check-lean-finite-convergence.py
      - run: python3 -O scripts/check-lean-finite-convergence.py
      - run: python3 scripts/check-lean-finite-convergence-self-test.py
      - run: python3 -O scripts/check-lean-finite-convergence-self-test.py
      - run: python3 -I -S -B scripts/check-lean-toolchain-freeze.py
      - run: python3 -O -I -S -B scripts/check-lean-toolchain-freeze.py
      - run: python3 -I -S -B scripts/check-lean-toolchain-freeze-self-test.py
      - run: python3 -O -I -S -B scripts/check-lean-toolchain-freeze-self-test.py
      - run: python3 scripts/check-lean-ksg-integer-harmonic.py
      - run: python3 -O scripts/check-lean-ksg-integer-harmonic.py
      - run: python3 scripts/check-lean-ksg-integer-harmonic-self-test.py
      - run: python3 -O scripts/check-lean-ksg-integer-harmonic-self-test.py
      - run: python3 scripts/check-lean-citation-edge-countermodel.py
      - run: python3 scripts/check-lean-citation-edge-countermodel-self-test.py

  formal-pdf-structure:
    name: Formal LaTeX / PDF inventory and cross-toolchain structure
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: Normalize reviewed Git info/exclude checkout residue
        run: python3 -I -S -B scripts/normalize-actions-checkout-git-info-exclude.py
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install the hash-pinned PDF verifier dependency
        run: |
          python -m pip install \
            --disable-pip-version-check \
            --no-cache-dir \
            --no-deps \
            --require-hashes \
            --requirement audit/formal/requirements-pdf.txt
      - name: Install hash-pinned Pandoc for Markdown paper rebuilds
        shell: bash
        env:
          PANDOC_ARCHIVE_SHA256: c7edd535941c48be6a362081a748272837de81ae11777202d9c341d3d8261c9a
          PANDOC_BINARY_SHA256: 867c5fc83e6b18991d1880e040867d31d09a0d5e68b0bfae362d2fbc71cf25ce
          PANDOC_ARCHIVE_URL: https://github.com/jgm/pandoc/releases/download/3.10.2/pandoc-3.10.2-linux-amd64.tar.gz
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/pandoc-3.10.2-linux-amd64.tar.gz"
          install_root="$RUNNER_TEMP/pandoc-3.10.2"
          if [[ -e "$archive" || -L "$archive" || -e "$install_root" || -L "$install_root" ]]; then
            echo "refusing pre-existing Pandoc archive or install path" >&2
            exit 1
          fi
          curl --fail --location --proto '=https' --retry 5 --show-error \
            --tlsv1.2 --output "$archive" "$PANDOC_ARCHIVE_URL"
          printf '%s  %s\n' "$PANDOC_ARCHIVE_SHA256" "$archive" \
            | sha256sum --check --strict
          mkdir -m 0700 -- "$install_root"
          mkdir -m 0700 -- "$install_root/bin"
          tar -xzf "$archive" -C "$install_root/bin" --strip-components=2 -- \
            pandoc-3.10.2/bin/pandoc
          pandoc_bin="$install_root/bin/pandoc"
          if [[ ! -f "$pandoc_bin" || -L "$pandoc_bin" || ! -x "$pandoc_bin" ]]; then
            echo "hash-pinned Pandoc archive lacks the expected direct executable" >&2
            exit 1
          fi
          if [[ "$(stat -c '%h' "$pandoc_bin")" != "1" ]]; then
            echo "hash-pinned Pandoc executable is multiply linked" >&2
            exit 1
          fi
          printf '%s  %s\n' "$PANDOC_BINARY_SHA256" "$pandoc_bin" \
            | sha256sum --check --strict
          if [[ "$("$pandoc_bin" --version | sed -n '1p')" != "pandoc 3.10.2" ]]; then
            echo "hash-pinned Pandoc executable reports an unexpected version" >&2
            exit 1
          fi
          printf 'PID_RS_CI_PANDOC_BIN=%s\n' "$install_root/bin" >> "$GITHUB_ENV"
      - name: Install pinned Elan
        shell: bash
        env:
          ELAN_ARCHIVE_SHA256: df0b2b3a439961ffcbb3985214365ffe40f49bc871df04dff268c7d8e21ca8b2
          ELAN_ARCHIVE_URL: https://github.com/leanprover/elan/releases/download/v4.2.3/elan-x86_64-unknown-linux-gnu.tar.gz
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/elan-x86_64-unknown-linux-gnu.tar.gz"
          install_root="$RUNNER_TEMP/elan-v4.2.3"
          curl --fail --location --proto '=https' --retry 5 --show-error \
            --tlsv1.2 --output "$archive" "$ELAN_ARCHIVE_URL"
          printf '%s  %s\n' "$ELAN_ARCHIVE_SHA256" "$archive" \
            | sha256sum --check --strict
          mkdir -p "$install_root"
          tar -xzf "$archive" -C "$install_root"
          "$install_root/elan-init" -y --default-toolchain none --no-modify-path
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: audit/formal/lean/.lake/packages
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('audit/formal/lean/lean-toolchain') }}-${{ hashFiles('audit/formal/lean/lake-manifest.json') }}-${{ github.sha }}
          restore-keys: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('audit/formal/lean/lean-toolchain') }}-${{ hashFiles('audit/formal/lean/lake-manifest.json') }}
      - name: Fetch the Mathlib cache and build
        working-directory: audit/formal/lean
        run: |
          set -euo pipefail
          test ! -e .lake/build && test ! -L .lake/build
          test ! -e .lake/config && test ! -L .lake/config
          lake exe cache get
          lake build PidFiniteConvergence
      - name: Check the typed citation edge and adjacent-arrow countermodel
        run: |
          python3 scripts/check-citation-edge-countermodel.py
          python3 scripts/check-citation-edge-countermodel-self-test.py
      - name: Check the zeta-to-PID transfer firewall
        run: |
          python3 -I -S -B scripts/check-zeta-pid-transfer-firewall.py
          python3 -O -I -S -B scripts/check-zeta-pid-transfer-firewall.py
          python3 -I -S -B scripts/check-zeta-pid-transfer-firewall-self-test.py
          python3 -O -I -S -B scripts/check-zeta-pid-transfer-firewall-self-test.py
      - name: Install the runner TeX toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            chktex \
            fontconfig \
            latexmk \
            lacheck \
            librsvg2-bin \
            libxml2-utils \
            lmodern \
            poppler-utils \
            ripgrep \
            texlive-fonts-extra \
            texlive-fonts-recommended \
            texlive-latex-extra \
            texlive-luatex \
            texlive-plain-generic
      - name: Bind the Ubuntu PDF compatibility toolchain
        shell: bash
        env:
          TAGPDF_STY_SHA256: 298d6440fe967d7dec16da07706608bab17d7a0c7dfca35e4c5580721ecfba80
          HGENERIC_TESTPHASE_SHA256: 71231fc80fb413725007c5fddfe80b423f3fbcda3deee2088cbe3a3366e6588f
          PDFMANAGEMENT_TESTPHASE_SHA256: 3434029eb57d5a364358ea153dd4ba0eb8a31408585d5ea0e9d7cf9096c56e5b
        run: |
          set -euo pipefail
          tagpdf_sty=/usr/share/texlive/texmf-dist/tex/latex/tagpdf/tagpdf.sty
          hgeneric_testphase=/usr/share/texlive/texmf-dist/tex/latex/pdfmanagement-testphase/hgeneric-testphase.def
          pdfmanagement_testphase=/usr/share/texlive/texmf-dist/tex/latex/pdfmanagement-testphase/pdfmanagement-testphase.ltx
          if [[ "$(/usr/bin/kpsewhich tagpdf.sty)" != "$tagpdf_sty" ]]; then
            echo "Ubuntu tagpdf does not resolve to the reviewed compatibility target" >&2
            exit 1
          fi
          if [[ ! -f "$tagpdf_sty" || -L "$tagpdf_sty" ]]; then
            echo "reviewed Ubuntu tagpdf source is absent, nonregular, or symbolic" >&2
            exit 1
          fi
          if ! printf '%s  %s\n' "$TAGPDF_STY_SHA256" "$tagpdf_sty" \
            | /usr/bin/sha256sum --check --strict >/dev/null
          then
            echo "reviewed Ubuntu tagpdf source digest changed" >&2
            exit 1
          fi
          if [[ "$(/usr/bin/grep -Fxc '\ProvidesExplPackage {tagpdf} {2024-02-04} {0.98v}' \
              "$tagpdf_sty")" != "1" ]]; then
            echo "reviewed Ubuntu tagpdf declaration changed" >&2
            exit 1
          fi
          if /usr/bin/grep -Fq '\__tag_tree_update_openaction:' "$tagpdf_sty"; then
            echo "reviewed Ubuntu tagpdf unexpectedly has the native OpenAction update" >&2
            exit 1
          fi
          if [[ "$(/usr/bin/kpsewhich hgeneric-testphase.def)" != "$hgeneric_testphase" ]]; then
            echo "Ubuntu hgeneric does not resolve to the reviewed compatibility target" >&2
            exit 1
          fi
          if [[ ! -f "$hgeneric_testphase" || -L "$hgeneric_testphase" ]]; then
            echo "reviewed Ubuntu hgeneric source is absent, nonregular, or symbolic" >&2
            exit 1
          fi
          if ! printf '%s  %s\n' "$HGENERIC_TESTPHASE_SHA256" "$hgeneric_testphase" \
            | /usr/bin/sha256sum --check --strict >/dev/null
          then
            echo "reviewed Ubuntu hgeneric source digest changed" >&2
            exit 1
          fi
          if ! /usr/bin/grep -Fq \
              '\ProvidesFile{hgeneric-testphase.def}[2023-12-09 v0.96d %' \
              "$hgeneric_testphase"; then
            echo "reviewed Ubuntu hgeneric declaration changed" >&2
            exit 1
          fi
          if /usr/bin/grep -Fq 'l__hyp_link_Contents_tl' "$hgeneric_testphase"; then
            echo "reviewed Ubuntu hgeneric unexpectedly has native URI Contents state" >&2
            exit 1
          fi
          if [[ "$(/usr/bin/kpsewhich pdfmanagement-testphase.ltx)" \
              != "$pdfmanagement_testphase" ]]; then
            echo "Ubuntu pdfmanagement does not resolve to the reviewed compatibility target" >&2
            exit 1
          fi
          if [[ ! -f "$pdfmanagement_testphase" || -L "$pdfmanagement_testphase" ]]; then
            echo "reviewed Ubuntu pdfmanagement source is absent, nonregular, or symbolic" >&2
            exit 1
          fi
          if ! printf '%s  %s\n' "$PDFMANAGEMENT_TESTPHASE_SHA256" \
              "$pdfmanagement_testphase" \
            | /usr/bin/sha256sum --check --strict >/dev/null
          then
            echo "reviewed Ubuntu pdfmanagement source digest changed" >&2
            exit 1
          fi
          if [[ "$(/usr/bin/grep -Fxc \
              '\ProvidesExplFile{pdfmanagement-testphase.ltx}{2023-12-09}{0.96d}' \
              "$pdfmanagement_testphase")" != "1" ]]; then
            echo "reviewed Ubuntu pdfmanagement declaration changed" >&2
            exit 1
          fi
          if /usr/bin/grep -Fq \
              '\pdf_string_from_unicode:nnN {utf8/string}{#2}' \
              "$pdfmanagement_testphase"; then
            echo "reviewed Ubuntu pdfmanagement unexpectedly has native ASCII filespec F" >&2
            exit 1
          fi
          printf 'PID_RS_CI_TAGPDF_STY=%s\n' "$tagpdf_sty" >> "$GITHUB_ENV"
          printf 'PID_RS_CI_HGENERIC_TESTPHASE=%s\n' "$hgeneric_testphase" >> "$GITHUB_ENV"
          printf 'PID_RS_CI_PDFMANAGEMENT_TESTPHASE=%s\n' \
            "$pdfmanagement_testphase" >> "$GITHUB_ENV"
      - name: Rebuild papers and check cross-toolchain text, geometry, fonts, and workflow renders
        env:
          PANDOC_BINARY_SHA256: 867c5fc83e6b18991d1880e040867d31d09a0d5e68b0bfae362d2fbc71cf25ce
          TAGPDF_STY_SHA256: 298d6440fe967d7dec16da07706608bab17d7a0c7dfca35e4c5580721ecfba80
          HGENERIC_TESTPHASE_SHA256: 71231fc80fb413725007c5fddfe80b423f3fbcda3deee2088cbe3a3366e6588f
          PDFMANAGEMENT_TESTPHASE_SHA256: 3434029eb57d5a364358ea153dd4ba0eb8a31408585d5ea0e9d7cf9096c56e5b
        run: |
          set -euo pipefail
          /usr/bin/test -x /usr/bin/rg
          test "$(command -v rg)" = "/usr/bin/rg"
          /usr/bin/rg --version >/dev/null
          expected_pandoc_bin="$RUNNER_TEMP/pandoc-3.10.2/bin"
          if [[ "$PID_RS_CI_PANDOC_BIN" != "$expected_pandoc_bin" ]]; then
            echo "Pandoc bin directory differs from the hash-pinned install path" >&2
            exit 1
          fi
          pandoc_bin="$PID_RS_CI_PANDOC_BIN/pandoc"
          verify_pandoc_binary() {
            if [[ ! -f "$pandoc_bin" || -L "$pandoc_bin" || ! -x "$pandoc_bin" ]]; then
              echo "hash-pinned Pandoc executable is absent or unsafe" >&2
              exit 1
            fi
            if [[ "$(/usr/bin/stat -c '%h' "$pandoc_bin")" != "1" ]]; then
              echo "hash-pinned Pandoc executable is multiply linked" >&2
              exit 1
            fi
            if ! printf '%s  %s\n' "$PANDOC_BINARY_SHA256" "$pandoc_bin" \
              | /usr/bin/sha256sum --check --strict >/dev/null
            then
              echo "hash-pinned Pandoc executable digest changed" >&2
              exit 1
            fi
            if [[ "$("$pandoc_bin" --version | /usr/bin/sed -n '1p')" != "pandoc 3.10.2" ]]; then
              echo "hash-pinned Pandoc executable reports an unexpected version" >&2
              exit 1
            fi
          }
          verify_pandoc_binary
          tagpdf_sty=/usr/share/texlive/texmf-dist/tex/latex/tagpdf/tagpdf.sty
          hgeneric_testphase=/usr/share/texlive/texmf-dist/tex/latex/pdfmanagement-testphase/hgeneric-testphase.def
          pdfmanagement_testphase=/usr/share/texlive/texmf-dist/tex/latex/pdfmanagement-testphase/pdfmanagement-testphase.ltx
          verify_tagpdf_compat_toolchain() {
            if [[ "$PID_RS_CI_TAGPDF_STY" != "$tagpdf_sty" \
                || "$(/usr/bin/kpsewhich tagpdf.sty)" != "$tagpdf_sty" ]]; then
              echo "Ubuntu tagpdf compatibility path changed after preflight" >&2
              exit 1
            fi
            if [[ ! -f "$tagpdf_sty" || -L "$tagpdf_sty" ]]; then
              echo "reviewed Ubuntu tagpdf source became absent, nonregular, or symbolic" >&2
              exit 1
            fi
            if ! printf '%s  %s\n' "$TAGPDF_STY_SHA256" "$tagpdf_sty" \
              | /usr/bin/sha256sum --check --strict >/dev/null
            then
              echo "reviewed Ubuntu tagpdf source digest changed after preflight" >&2
              exit 1
            fi
            if [[ "$(/usr/bin/grep -Fxc '\ProvidesExplPackage {tagpdf} {2024-02-04} {0.98v}' \
                "$tagpdf_sty")" != "1" ]]; then
              echo "reviewed Ubuntu tagpdf declaration changed after preflight" >&2
              exit 1
            fi
            if /usr/bin/grep -Fq '\__tag_tree_update_openaction:' "$tagpdf_sty"; then
              echo "reviewed Ubuntu tagpdf acquired the native OpenAction update" >&2
              exit 1
            fi
          }
          verify_pdfresources_compat_toolchain() {
            if [[ "$PID_RS_CI_HGENERIC_TESTPHASE" != "$hgeneric_testphase" \
                || "$(/usr/bin/kpsewhich hgeneric-testphase.def)" != "$hgeneric_testphase" ]]; then
              echo "Ubuntu hgeneric compatibility path changed after preflight" >&2
              exit 1
            fi
            if [[ ! -f "$hgeneric_testphase" || -L "$hgeneric_testphase" ]]; then
              echo "reviewed Ubuntu hgeneric source became absent, nonregular, or symbolic" >&2
              exit 1
            fi
            if ! printf '%s  %s\n' "$HGENERIC_TESTPHASE_SHA256" "$hgeneric_testphase" \
              | /usr/bin/sha256sum --check --strict >/dev/null
            then
              echo "reviewed Ubuntu hgeneric source digest changed after preflight" >&2
              exit 1
            fi
            if ! /usr/bin/grep -Fq \
                '\ProvidesFile{hgeneric-testphase.def}[2023-12-09 v0.96d %' \
                "$hgeneric_testphase"; then
              echo "reviewed Ubuntu hgeneric declaration changed after preflight" >&2
              exit 1
            fi
            if /usr/bin/grep -Fq 'l__hyp_link_Contents_tl' "$hgeneric_testphase"; then
              echo "reviewed Ubuntu hgeneric acquired native URI Contents state" >&2
              exit 1
            fi
            if [[ "$PID_RS_CI_PDFMANAGEMENT_TESTPHASE" != "$pdfmanagement_testphase" \
                || "$(/usr/bin/kpsewhich pdfmanagement-testphase.ltx)" \
                  != "$pdfmanagement_testphase" ]]; then
              echo "Ubuntu pdfmanagement compatibility path changed after preflight" >&2
              exit 1
            fi
            if [[ ! -f "$pdfmanagement_testphase" || -L "$pdfmanagement_testphase" ]]; then
              echo "reviewed Ubuntu pdfmanagement source became absent, nonregular, or symbolic" >&2
              exit 1
            fi
            if ! printf '%s  %s\n' "$PDFMANAGEMENT_TESTPHASE_SHA256" \
                "$pdfmanagement_testphase" \
              | /usr/bin/sha256sum --check --strict >/dev/null
            then
              echo "reviewed Ubuntu pdfmanagement source digest changed after preflight" >&2
              exit 1
            fi
            if [[ "$(/usr/bin/grep -Fxc \
                '\ProvidesExplFile{pdfmanagement-testphase.ltx}{2023-12-09}{0.96d}' \
                "$pdfmanagement_testphase")" != "1" ]]; then
              echo "reviewed Ubuntu pdfmanagement declaration changed after preflight" >&2
              exit 1
            fi
            if /usr/bin/grep -Fq \
                '\pdf_string_from_unicode:nnN {utf8/string}{#2}' \
                "$pdfmanagement_testphase"; then
              echo "reviewed Ubuntu pdfmanagement acquired native ASCII filespec F" >&2
              exit 1
            fi
          }
          verify_tagpdf_compat_toolchain
          verify_pdfresources_compat_toolchain
          gate_home="$RUNNER_TEMP/pid-rs-formal-pdf-home"
          gate_tmp="$RUNNER_TEMP/pid-rs-formal-pdf-tmp"
          elan_home="$HOME/.elan"
          formal_tool_path="$pythonLocation/bin/luaotfload-tool"
          luaotfload_source="$(/usr/bin/readlink -f /usr/bin/luaotfload-tool)"
          if [[ "$luaotfload_source" != "/usr/share/texlive/texmf-dist/scripts/luaotfload/luaotfload-tool.lua" ]]; then
            echo "unexpected Ubuntu luaotfload-tool target: $luaotfload_source" >&2
            exit 1
          fi
          if [[ -e "$formal_tool_path" || -L "$formal_tool_path" ]]; then
            echo "refusing to replace a pre-existing setup-python luaotfload-tool path" >&2
            exit 1
          fi
          formal_tool_stage="$(/usr/bin/mktemp "$pythonLocation/bin/.pid-rs-luaotfload-tool.XXXXXX")"
          cleanup_formal_tool_stage() {
            if [[ -n "$formal_tool_stage" ]]; then
              /usr/bin/rm -f -- "$formal_tool_stage"
            fi
          }
          trap cleanup_formal_tool_stage EXIT
          /usr/bin/install -m 0755 "$luaotfload_source" "$formal_tool_stage"
          /usr/bin/cmp -s "$luaotfload_source" "$formal_tool_stage"
          if ! /usr/bin/ln -T -- "$formal_tool_stage" "$formal_tool_path"; then
            echo "setup-python luaotfload-tool destination appeared before publication" >&2
            exit 1
          fi
          /usr/bin/rm -- "$formal_tool_stage"
          formal_tool_stage=""
          trap - EXIT
          /usr/bin/cmp -s "$luaotfload_source" "$formal_tool_path"
          workflow_path="$PID_RS_CI_PANDOC_BIN:$pythonLocation/bin:/usr/local/bin:/usr/local/sbin:/usr/bin:/bin:/usr/sbin:/sbin"
          formal_pdf_path="$PID_RS_CI_PANDOC_BIN:$elan_home/bin:$pythonLocation/bin:/usr/local/bin:/usr/local/sbin:/usr/bin:/bin:/usr/sbin:/sbin"
          verify_formal_command_selection() {
            local command_name resolved expected
            resolved="$(/usr/bin/env -i "PATH=$formal_pdf_path" /usr/bin/sh -c 'command -v pandoc')"
            if [[ "$resolved" != "$pandoc_bin" ]]; then
              echo "sanitized formal-PDF path does not select the hash-pinned Pandoc" >&2
              exit 1
            fi
            for command_name in elan lake lean; do
              expected="$elan_home/bin/$command_name"
              resolved="$(/usr/bin/env -i "PATH=$formal_pdf_path" \
                /usr/bin/sh -c 'command -v "$1"' sh "$command_name")"
              if [[ "$resolved" != "$expected" ]]; then
                echo "sanitized formal-PDF path does not select the Elan $command_name proxy" >&2
                exit 1
              fi
            done
          }
          verify_formal_command_selection
          for clean_path in "$gate_home" "$gate_tmp"; do
            if [[ -e "$clean_path" || -L "$clean_path" ]]; then
              echo "refusing a pre-existing formal-PDF clean-state path: $clean_path" >&2
              exit 1
            fi
          done
          /usr/bin/mkdir -m 0700 -- "$gate_home" "$gate_tmp"
          gate_lean_toolchain="leanprover/lean4:v4.33.0"
          if ! /usr/bin/printf '%s\n' "$gate_lean_toolchain" \
            | /usr/bin/cmp -s - audit/formal/lean/lean-toolchain
          then
            echo "formal-PDF clean-home Lean toolchain differs from the tracked pin" >&2
            exit 1
          fi
          /usr/bin/env -i \
            "PATH=$formal_pdf_path" \
            "HOME=$gate_home" \
            "TMPDIR=$gate_tmp" \
            "ELAN_HOME=$gate_home/.elan" \
            LC_ALL=C \
            LANG=C \
            TZ=UTC \
            "$elan_home/bin/elan" toolchain install "$gate_lean_toolchain"
          if [[ ! -d "$gate_home/.elan" || -L "$gate_home/.elan" ]]; then
            echo "formal-PDF clean-home Elan state is not a direct directory" >&2
            exit 1
          fi
          verify_pandoc_binary
          verify_tagpdf_compat_toolchain
          verify_pdfresources_compat_toolchain
          verify_formal_command_selection
          exec /usr/bin/env -i \
            "PATH=$formal_pdf_path" \
            "HOME=$gate_home" \
            "TMPDIR=$gate_tmp" \
            "ELAN_HOME=$gate_home/.elan" \
            LC_ALL=C \
            LANG=C \
            TZ=UTC \
            "PID_RS_PDF_GATE_PATH=$workflow_path" \
            "PID_RS_PDF_GATE_HOME=$gate_home" \
            "PID_RS_PDF_GATE_TMPDIR=$gate_tmp" \
            bash --noprofile --norc scripts/check-formal-pdf-set.sh --cross-toolchain

  certified-sxpid-reference:
    name: Exact-count directed-rounding SxPID2 reference
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/certified-sxpid
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Install pinned Elan
        shell: bash
        env:
          ELAN_ARCHIVE_SHA256: df0b2b3a439961ffcbb3985214365ffe40f49bc871df04dff268c7d8e21ca8b2
          ELAN_ARCHIVE_URL: https://github.com/leanprover/elan/releases/download/v4.2.3/elan-x86_64-unknown-linux-gnu.tar.gz
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/elan-x86_64-unknown-linux-gnu.tar.gz"
          install_root="$RUNNER_TEMP/elan-v4.2.3"
          curl --fail --location --proto '=https' --retry 5 --show-error \
            --tlsv1.2 --output "$archive" "$ELAN_ARCHIVE_URL"
          printf '%s  %s\n' "$ELAN_ARCHIVE_SHA256" "$archive" \
            | sha256sum --check --strict
          mkdir -p "$install_root"
          tar -xzf "$archive" -C "$install_root"
          "$install_root/elan-init" -y --default-toolchain none --no-modify-path
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: audit/formal/lean/.lake/packages
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('audit/formal/lean/lean-toolchain') }}-${{ hashFiles('audit/formal/lean/lake-manifest.json') }}-${{ github.sha }}
          restore-keys: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('audit/formal/lean/lean-toolchain') }}-${{ hashFiles('audit/formal/lean/lake-manifest.json') }}
      - run: >-
          cargo fetch --locked
          --manifest-path audit/tools/certified-sxpid/Cargo.toml
      - run: cargo fmt --manifest-path audit/tools/certified-sxpid/Cargo.toml --all --check
      - run: >-
          cargo test --locked
          --manifest-path audit/tools/certified-sxpid/Cargo.toml
      - run: >-
          cargo clippy --locked
          --manifest-path audit/tools/certified-sxpid/Cargo.toml
          --all-targets -- -D warnings
      - run: >-
          RUSTDOCFLAGS="-D warnings" cargo doc --locked --no-deps
          --manifest-path audit/tools/certified-sxpid/Cargo.toml
      - run: python3 audit/tools/certified-sxpid/scripts/check-static-policy.py
      - run: python3 audit/tools/certified-sxpid/scripts/check-static-policy-self-test.py
      - run: python3 audit/tools/certified-sxpid/scripts/check-independent-verifier.py
      - run: python3 -O audit/tools/certified-sxpid/scripts/check-independent-verifier.py
      - run: python3 audit/tools/certified-sxpid/scripts/check-exact-products.py
      - run: python3 audit/tools/certified-sxpid/scripts/check-exact-products-self-test.py
      - run: python3 audit/tools/certified-sxpid/scripts/check-nonsyntactic-zero-boundary.py
      - run: python3 audit/tools/certified-sxpid/scripts/challenge-exact-products.py
      - name: Fetch the Mathlib cache and build
        working-directory: audit/formal/lean
        run: |
          set -euo pipefail
          test ! -e .lake/build && test ! -L .lake/build
          test ! -e .lake/config && test ! -L .lake/config
          lake exe cache get
          lake build PidFiniteConvergence
      - run: python3 scripts/check-lean-exact-log-product.py
      - run: python3 -I -S -B scripts/check-certified-sxpid2-claim.py
      - run: python3 -O -I -S -B scripts/check-certified-sxpid2-claim.py
      - run: python3 -I -S -B scripts/check-certified-sxpid2-claim-self-test.py
      - run: python3 -O -I -S -B scripts/check-certified-sxpid2-claim-self-test.py
      - run: cargo install cargo-deny --locked --version 0.20.2
      - run: >-
          cargo deny --manifest-path audit/tools/certified-sxpid/Cargo.toml
          --config audit/tools/certified-sxpid/deny.toml check

