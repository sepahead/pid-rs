  release-scope-coherence:
    name: Release scope and scientific evidence coherence
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: nightly-2026-06-16
          targets: aarch64-apple-darwin
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install exact Z3 for bounded PID and KSG algebra proofs
        shell: bash
        env:
          Z3_ARCHIVE_SHA256: 7288c49a5bd6dbafd7b0b0d1f65956b91672da24b08f09242919af159be3418e
          Z3_ARCHIVE_URL: https://github.com/Z3Prover/z3/releases/download/z3-4.16.0/z3-4.16.0-x64-glibc-2.39.zip
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/z3-4.16.0-x64-glibc-2.39.zip"
          install_root="$RUNNER_TEMP/z3-4.16.0"
          curl --fail --location --proto '=https' --retry 5 --show-error \
            --tlsv1.2 --output "$archive" "$Z3_ARCHIVE_URL"
          printf '%s  %s\n' "$Z3_ARCHIVE_SHA256" "$archive" | sha256sum --check --strict
          mkdir "$install_root"
          unzip -q "$archive" -d "$install_root"
          z3_bin="$install_root/z3-4.16.0-x64-glibc-2.39/bin/z3"
          test -x "$z3_bin"
          dirname "$z3_bin" >> "$GITHUB_PATH"
      - run: cargo install cargo-public-api --locked --version 0.52.0
      - run: python3 scripts/check-software-identity.py
      - run: python3 scripts/check-software-identity-self-test.py
      - run: python3 -S -B scripts/check-method-catalog.py
      - run: python3 -O -S -B scripts/check-method-catalog.py
      - run: python3 -S -B scripts/check-method-catalog-self-test.py
      - run: python3 -O -S -B scripts/check-method-catalog-self-test.py
      - run: python3 -S -B scripts/check-finite-convergence-document-semantics.py
      - run: python3 -O -S -B scripts/check-finite-convergence-document-semantics.py
      - run: python3 -S -B scripts/check-finite-convergence-document-semantics-self-test.py
      - run: python3 -O -S -B scripts/check-finite-convergence-document-semantics-self-test.py
      - run: python3 scripts/check-ecosystem-capabilities.py
      - run: python3 scripts/check-ecosystem-capabilities-self-test.py
      - run: python3 scripts/check-z3-pid2-algebra.py
      - run: python3 scripts/check-z3-pid2-algebra-self-test.py
      - run: python3 scripts/check-z3-ksg-integer-harmonic.py
      - run: python3 -O scripts/check-z3-ksg-integer-harmonic.py
      - run: python3 scripts/check-z3-ksg-integer-harmonic-self-test.py
      - run: python3 -O scripts/check-z3-ksg-integer-harmonic-self-test.py
      - run: python3 scripts/check-release-scope.py
      - run: scripts/check-release-scope-self-test.sh
      - run: python3 scripts/generate-finite-alphabet-plugin-oracle.py
      - run: python3 scripts/generate-dependency-colored-sxpid-oracle.py
      - run: python3 scripts/generate-support-change-tolerant-sxpid-oracle.py
      - run: python3 scripts/generate-exact-binary64-sum-oracle.py
      - run: python3 -O scripts/generate-exact-binary64-sum-oracle.py
      - run: python3 scripts/generate-ksg-local-arithmetic-oracle.py
      - run: python3 scripts/generate-sxpid2-exhaustive-oracle.py
      - run: python3 scripts/check-markdown-math.py
      - run: python3 scripts/check-markdown-math-self-test.py
      - run: python3 scripts/check-review-evidence.py
      - run: python3 scripts/check-review-evidence-self-test.py
      - run: python3 -I -S -B scripts/check-source-errata.py
      - run: python3 -O -I -S -B scripts/check-source-errata.py
      - run: python3 -I -S -B scripts/check-source-errata-self-test.py
      - run: python3 -O -I -S -B scripts/check-source-errata-self-test.py
      - run: python3 -I -S -B scripts/check-assurance-registry-typed-view-v1.py
      - run: python3 -O -I -S -B scripts/check-assurance-registry-typed-view-v1.py
      - run: python3 -I -S -B scripts/check-assurance-registry-typed-view-v1-self-test.py
      - run: python3 -O -I -S -B scripts/check-assurance-registry-typed-view-v1-self-test.py
      - run: python3 -I -S -B scripts/check-methods-summary.py
      - run: python3 -O -I -S -B scripts/check-methods-summary.py
      - run: python3 -I -S -B scripts/check-methods-summary-self-test.py
      - run: python3 -O -I -S -B scripts/check-methods-summary-self-test.py
      - run: python3 -I -S -B scripts/check-pid-mathematical-audit-protocol.py
      - run: python3 -O -I -S -B scripts/check-pid-mathematical-audit-protocol.py
      - run: python3 -I -S -B scripts/check-pid-mathematical-audit-protocol-self-test.py
      - run: python3 -O -I -S -B scripts/check-pid-mathematical-audit-protocol-self-test.py
      - run: python3 -I -S -B scripts/check-current-source-state-v1.py
      - run: python3 -O -I -S -B scripts/check-current-source-state-v1.py
      - run: python3 -I -S -B scripts/check-current-source-state-v1-self-test.py
      - run: python3 -O -I -S -B scripts/check-current-source-state-v1-self-test.py
      - name: Generate and separately replay post-commit source identity
        shell: bash
        env:
          POST_COMMIT_SOURCE_STATE_ARTIFACT: ${{ runner.temp }}/pid-rs-post-commit-source-state-v2.json
        run: |
          set -euo pipefail
          set -o noclobber
          umask 077
          test ! -e "$POST_COMMIT_SOURCE_STATE_ARTIFACT"
          test ! -e "$POST_COMMIT_SOURCE_STATE_ARTIFACT.optimized"
          python3 -I -S -B scripts/check-post-commit-source-state-v2.py --emit \
            > "$POST_COMMIT_SOURCE_STATE_ARTIFACT"
          python3 -O -I -S -B scripts/check-post-commit-source-state-v2.py --emit \
            > "$POST_COMMIT_SOURCE_STATE_ARTIFACT.optimized"
          cmp "$POST_COMMIT_SOURCE_STATE_ARTIFACT" \
            "$POST_COMMIT_SOURCE_STATE_ARTIFACT.optimized"
          python3 -I -S -B scripts/check-post-commit-source-state-v2.py \
            --validate-stdin < "$POST_COMMIT_SOURCE_STATE_ARTIFACT"
          python3 -O -I -S -B scripts/check-post-commit-source-state-v2.py \
            --validate-stdin < "$POST_COMMIT_SOURCE_STATE_ARTIFACT"
          python3 -I -S -B scripts/check-post-commit-source-state-v2-self-test.py
          python3 -O -I -S -B scripts/check-post-commit-source-state-v2-self-test.py
      - name: Upload post-commit source identity
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: post-commit-source-state-v2-${{ github.sha }}
          path: ${{ runner.temp }}/pid-rs-post-commit-source-state-v2.json
          if-no-files-found: error
      - run: scripts/check-public-api-snapshots.sh
        env:
          PID_RS_PUBLIC_API_TOOLCHAIN: nightly-2026-06-16
      - run: scripts/check-public-api-snapshots-self-test.sh
        env:
          PID_RS_PUBLIC_API_TOOLCHAIN: nightly-2026-06-16
      - name: Build docs for every feature profile
        shell: bash
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo +stable doc --locked -p pid-core --no-deps
          cargo +stable doc --locked -p pid-core --no-default-features --no-deps
          for feature in \
            parallel \
            experimental-continuous \
            experimental-hyperbolic \
            experimental-heuristics \
            experimental-hierarchy \
            research-mixed-dimension-pid3 \
            experimental-pipelines \
            experimental-all
          do
            cargo +stable doc --locked -p pid-core \
              --no-default-features --features "$feature" --no-deps
          done
          cargo +stable doc --locked -p pid-core --no-default-features --all-features --no-deps

  cross-platform-all-features:
    name: All features / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo test --locked -p pid-core --all-features

  release-numerics:
    name: Release-mode numerical fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo test --locked --release -p pid-core --all-features

  msrv:
    name: MSRV 1.89 / ${{ matrix.features }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - features: default
            flags: ""
          - features: no-default-features
            flags: --no-default-features
          - features: all-features
            flags: --all-features
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: "1.89"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - shell: bash
        run: cargo check --locked --workspace ${{ matrix.flags }}

  lint:
    name: Rustfmt + Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo fmt --all --check
      - run: cargo fmt --manifest-path fuzz/Cargo.toml --all --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

  docs:
    name: Rustdoc + docs.rs configuration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo doc --locked -p pid-core --no-default-features --no-deps
      - run: cargo doc --locked --workspace --all-features --no-deps
      - run: cargo test --locked --doc -p pid-core --no-default-features
      - run: cargo test --locked --doc -p pid-core --all-features
      - run: cargo test --locked --doc -p pid-runlog --all-features
      # `--lib` is required: under `--all-features` these packages expose several buildable
      # targets (the `exp0` bin, examples, benches), and cargo refuses to forward trailing
      # rustdoc arguments to more than one target.
      - run: cargo rustdoc --locked -p pid-core --all-features --lib -- --cfg docsrs
      - run: cargo rustdoc --locked -p pid-runlog --all-features --lib -- --cfg docsrs

  property-tests:
    name: Deterministic property and identity suites
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo test --locked -p pid-core --all-features --test discrete_pid_properties
      - run: cargo test --locked -p pid-core --all-features --test sxpid_properties
      - run: cargo test --locked -p pid-core --all-features --test sxpid_axioms
      - run: cargo test --locked -p pid-core --all-features --test parallel_bit_identity

  fuzz-corpus:
    name: Fixed fuzz corpus smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo install cargo-fuzz --locked --version 0.13.2
      - run: cd fuzz && sha256sum --check corpus/SHA256SUMS
      - shell: bash
        run: |
          for target in \
            matrix_shape public_configs_shells quantizer_sxpid experimental_antichain \
            runlog_json_manifest experimental_hyperbolic resource_budgets
          do
            cargo fuzz run "$target" -- -runs=128 -max_len=16384 -seed=424242
          done

  miri:
    name: Miri / pure safe-Rust boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MIRIFLAGS: -Zmiri-strict-provenance
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: nightly
          components: miri
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo miri setup
      - run: cargo miri test --locked -p pid-core --lib --no-default-features matrix::tests
      - run: cargo miri test --locked -p pid-core --lib --no-default-features resource::tests

  coverage:
    name: Coverage threshold
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo install cargo-llvm-cov --locked --version 0.8.7
      - run: >-
          cargo llvm-cov --locked --workspace --exclude pid-python --all-features
          --lcov --output-path lcov.info --fail-under-lines 70
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-lcov
          path: lcov.info
          if-no-files-found: error

  static-release-quality:
    name: Package + semver + unused dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.98.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo install cargo-semver-checks --locked --version 0.49.0
      - run: test "$(cargo semver-checks --version)" = "cargo-semver-checks 0.49.0"
      - run: cargo install cargo-machete --locked --version 0.9.2
      - run: cargo install cargo-local-registry --locked --version 0.2.12
      - run: python -m pip install cffconvert==2.0.0
      - run: cffconvert --validate -i CITATION.cff
      - name: Check candidate or exact tagged release metadata
        shell: bash
        run: scripts/check-current-release-state.sh
      - run: scripts/check-release-state-self-test.sh
      - run: scripts/check-handoff-intake.py
      - run: scripts/check-handoff-intake-self-test.py
      - run: scripts/collect-repository-snapshot.py --validate audit/evidence/repository-snapshot.json
      - run: scripts/check-repository-snapshot-self-test.sh
      - run: scripts/repin-pidrs-self-test.sh
      - run: cargo machete
      - name: Check SemVer against the latest earlier 1.x tag
        shell: bash
        run: |
          baseline="$(git tag --list 'v1.*' --sort=-version:refname \
            | awk -v current="${GITHUB_REF_NAME:-}" '$0 != current { print; exit }')"
          if [[ -n "$baseline" ]]; then
            cargo semver-checks check-release -p pid-core --baseline-rev "$baseline"
          else
            # The 0.9 review boundary is intentionally breaking from 0.4. The permissive major
            # policy inventories those breaks; it does not claim that 1.x compatibility has begun.
            cargo semver-checks check-release -p pid-core \
              --baseline-rev ad489f5bf5e15c164c599d069a6bee0f338c0e48 --release-type major
          fi
      - run: cargo publish --locked -p pid-runlog --dry-run
      - name: Build and test the exact package archives against a temporary registry
        run: scripts/verify-package-archives.sh

  smoke:
    name: Examples + exp0 + run-log replay
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo run --locked --release -p pid-core --all-features --example ksg_and_pid
      - run: cargo run --locked --release -p pid-core --example discrete_sxpid
      - shell: bash
        run: |
          cargo run --locked -p pid-core --all-features --bin exp0 -- \
            --seeds 1 --summary-json /tmp/summary.json --runlog /tmp/run.jsonl
          cargo run --locked -p pid-runlog --bin pid-runlog-replay -- \
            --validate /tmp/run.jsonl

  supply-chain:
    name: Supply chain without advisory exceptions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --all-features --locked

  sbom:
    name: Workspace CycloneDX SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo install cargo-cyclonedx --locked --version 0.5.9
      - run: cargo cyclonedx --all --all-features --format json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: workspace-sbom
          path: "**/*.cdx.json"
          if-no-files-found: error

  secrets:
    name: Secret scan (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned gitleaks
        shell: bash
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output /tmp/gitleaks.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" \
            | sha256sum --check
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
      - name: Self-test narrow public-digest allowlists
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          import tempfile
          from pathlib import Path

          config = Path.cwd() / ".gitleaks.toml"
          ignore = Path.cwd() / ".gitleaksignore"
          expected_ignored_fingerprints = (
              "9dcdf32f18076eefc768194079b4abf437009737:"
              "claims/SX-CERTIFIED-AVERAGED-PID3-001/claim-v1.md:generic-api-key:19",
              "5b4f3758d688dfd06d6072374922b00abad27ecf:"
              "claims/SX-CERTIFIED-AVERAGED-PID3-001/claim-v1.md:generic-api-key:19",
          )
          actual_ignored_fingerprints = tuple(ignore.read_text(encoding="utf-8").splitlines())
          if actual_ignored_fingerprints != expected_ignored_fingerprints:
              raise SystemExit(
                  "historical public-prose ignore fingerprints changed: "
                  f"{actual_ignored_fingerprints!r}"
              )
          # Construct a high-entropy-looking public digest without embedding a 64-hex fixture in CI.
          digest = "0123456789abcdef" * 4
          quote = '"'
          pid3_public_prose = (
              "18-key serialization order, "
              "108-coordinate certificate, resource policy, independent-verification"
          )
          pid3_public_preceding = (
              "The canonical count-table transport, natural-log specialization,"
          )
          positive_only = (
              (
                  "audit/evidence/repository-snapshot.json",
                  f'{quote}api_projection_sha256{quote}: {quote}{digest}{quote},',
              ),
              (
                  "release-scope-1.0.json",
                  f'{quote}public_api_snapshot_sha256{quote}: {quote}{digest}{quote},',
              ),
              (
                  "audit/api/public-api/pid-core-signature-revisions.json",
                  f'{quote}public_api_snapshot_sha256{quote}: {quote}{digest}{quote},',
              ),
              (
                  "audit/evidence/fable5-ksg-rev4-settled-hostile-20260727T120200Z-context.md",
                  f'123 {quote}public_api_snapshot_sha256{quote}: {quote}{digest}{quote},',
              ),
              (
                  "claims/SX-CERTIFIED-AVERAGED-PID3-001/claim-v1.md",
                  pid3_public_preceding + "\n" + pid3_public_prose,
              ),
          )
          cases = (
              (
                  "audit/evidence/workflow-pdf-lualatex-format-hosted-receipt-2026-08-06.json",
                  f'{quote}job_api_sha256{quote}: {quote}{digest}{quote},',
                  (
                      f'job_api_sha256 = {quote}{digest}{quote},',
                      f'{quote}job_api_sha256: {quote}{digest}{quote},',
                      f'job_api_sha256{quote}: {quote}{digest}{quote},',
                      f'{quote}job_api_sha256{quote} = {quote}{digest}{quote},',
                  ),
              ),
              (
                  "claims/KSG-INTEGER-HARMONIC-001/active-packet-v4.json",
                  f'{quote}mutant_token_stream_sha256{quote}: {quote}{digest}{quote},',
                  (
                      f'mutant_token_stream_sha256 = {quote}{digest}{quote},',
                      f'{quote}mutant_token_stream_sha256: {quote}{digest}{quote},',
                      f'mutant_token_stream_sha256{quote}: {quote}{digest}{quote},',
                      f'{quote}token_stream_sha256{quote}: {quote}{digest}{quote},',
                  ),
              ),
              (
                  "claims/KSG-INTEGER-HARMONIC-001/failures/smtlib-shape-and-snapshot-v4.json",
                  f'{quote}token_stream_sha256{quote}: {quote}{digest}{quote},',
                  (
                      f'token_stream_sha256 = {quote}{digest}{quote},',
                      f'{quote}token_stream_sha256: {quote}{digest}{quote},',
                      f'token_stream_sha256{quote}: {quote}{digest}{quote},',
                      f'{quote}mutant_token_stream_sha256{quote}: {quote}{digest}{quote},',
                  ),
              ),
              (
                  "scripts/check-ksg-harmonic-revision.py",
                  f'{quote}mutant_token_stream_sha256{quote}: {quote}{digest}{quote},',
                  (
                      f'mutant_token_stream_sha256 = {quote}{digest}{quote},',
                      f'{quote}mutant_token_stream_sha256: {quote}{digest}{quote},',
                      f'mutant_token_stream_sha256{quote}: {quote}{digest}{quote},',
                      f'{quote}token_stream_sha256{quote}: {quote}{digest}{quote},',
                  ),
              ),
              (
                  "scripts/check-z3-ksg-integer-harmonic.py",
                  f'token_stream_sha256={quote}{digest}{quote},',
                  (
                      f'{quote}token_stream_sha256{quote}: {quote}{digest}{quote},',
                      f'{quote}token_stream_sha256 = {quote}{digest}{quote},',
                      f'token_stream_sha256{quote} = {quote}{digest}{quote},',
                      f'mutant_token_stream_sha256 = {quote}{digest}{quote},',
                  ),
              ),
          )

          def scan(files):
              with tempfile.TemporaryDirectory(prefix="pid-rs-gitleaks-self-test-") as raw:
                  root = Path(raw) / "source"
                  root.mkdir()
                  for relative, line in files:
                      destination = root / relative
                      destination.parent.mkdir(parents=True, exist_ok=True)
                      destination.write_text(line + "\n", encoding="utf-8")
                  report = Path(raw) / "report.json"
                  completed = subprocess.run(
                      (
                          "/tmp/gitleaks",
                          "dir",
                          ".",
                          "--config",
                          str(config),
                          "--gitleaks-ignore-path",
                          "/dev/null",
                          "--redact",
                          "--no-banner",
                          "--report-format",
                          "json",
                          "--report-path",
                          str(report),
                      ),
                      cwd=root,
                      check=False,
                      stdout=subprocess.DEVNULL,
                      stderr=subprocess.PIPE,
                      text=True,
                  )
                  findings = json.loads(report.read_text(encoding="utf-8")) if report.exists() else []
                  return completed.returncode, findings, completed.stderr

          intended_files = positive_only + tuple((path, intended) for path, intended, _ in cases)
          code, findings, stderr = scan(intended_files)
          if code != 0 or findings:
              raise SystemExit(f"intended public-digest controls were rejected: {stderr}")

          detected = 0
          for path, line in intended_files:
              key = next(
                  candidate
                  for candidate in (
                      "public_api_snapshot_sha256",
                      "api_projection_sha256",
                      "job_api_sha256",
                      "mutant_token_stream_sha256",
                      "token_stream_sha256",
                      pid3_public_prose,
                  )
                  if candidate in line
              )
              original_negatives = (
                  ("nearby_path", path + ".nearby", line),
                  ("nearby_key", path, line.replace(key, "nearby_" + key, 1)),
                  (
                      "nonhex_value",
                      path,
                      line.replace(digest, "g" + digest[1:], 1)
                      if digest in line
                      else line.replace("108-coordinate", "109-coordinate", 1),
                  ),
                  (
                      "secret_prefix",
                      path,
                      line.replace(digest, "secret_" + digest, 1)
                      if digest in line
                      else line.replace("18-key", "secret_18-key", 1),
                  ),
              )
              for negative_class, negative_path, negative_line in original_negatives:
                  code, findings, stderr = scan(((negative_path, negative_line),))
                  if code != 1 or len(findings) != 1 or findings[0].get("RuleID") != "generic-api-key":
                      raise SystemExit(
                          f"public-digest {negative_class} control escaped for {path}: "
                          f"exit={code}, findings={len(findings)}, stderr={stderr}"
                      )
                  detected += 1

          prose_path = "claims/SX-CERTIFIED-AVERAGED-PID3-001/claim-v1.md"
          for malformed_prose in (
              "prefix " + pid3_public_prose,
              "19-key serialization order, " + "108-coordinate certificate",
              pid3_public_prose + " suffix",
          ):
              code, findings, stderr = scan(
                  ((prose_path, pid3_public_preceding + "\n" + malformed_prose),)
              )
              if code != 1 or len(findings) != 1 or findings[0].get("RuleID") != "generic-api-key":
                  raise SystemExit(
                      "malformed public-prose control escaped: "
                      f"exit={code}, findings={len(findings)}, stderr={stderr}"
                  )
              detected += 1

          for path, _, malformed in cases:
              for line in malformed:
                  code, findings, stderr = scan(((path, line),))
                  if code != 1 or len(findings) != 1 or findings[0].get("RuleID") != "generic-api-key":
                      raise SystemExit(
                          f"malformed public-digest control escaped for {path}: "
                          f"exit={code}, findings={len(findings)}, stderr={stderr}"
                      )
                  detected += 1
          if detected != 63:
              raise SystemExit(f"expected 63 rejected controls, observed {detected}")
          print("Gitleaks narrow-allowlist self-test passed: 10 intended, 63 rejected")
          PY
      - run: /tmp/gitleaks git --redact --no-banner --log-opts="--all" .

  python:
    name: Python ${{ matrix.python }} / NumPy ${{ matrix.numpy }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
            numpy: "1.26.4"
          - os: macos-latest
            python: "3.11"
            numpy: "1.26.4"
          - os: windows-latest
            python: "3.11"
            numpy: "1.26.4"
          - os: ubuntu-latest
            python: "3.12"
            numpy: "1.26.4"
          - os: ubuntu-latest
            python: "3.13"
            numpy: "2.5.1"
          - os: ubuntu-latest
            python: "3.14"
            numpy: "2.5.1"
          - os: macos-latest
            python: "3.14"
            numpy: "2.5.1"
          - os: windows-latest
            python: "3.14"
            numpy: "2.5.1"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: python -m pip install maturin==1.14.1 numpy==${{ matrix.numpy }} pytest==9.1.1 mypy==1.19.1
      - run: maturin build --release --locked --manifest-path crates/pid-python/Cargo.toml --out dist
      - run: python -m pip install --no-index --find-links dist pid-core-rs==0.9.0
      - run: python -m pip check
      - run: pytest crates/pid-python/tests -q
      # Maturin exposes one private native submodule; the narrow allowlist keeps the public package
      # root checked exhaustively.
      - run: >-
          python -m mypy.stubtest pid_core_rs
          --allowlist crates/pid-python/stubtest.allowlist
      - shell: bash
        run: |
          python - <<'PY'
          import pathlib
          import zipfile

          wheels = list(pathlib.Path("dist").glob("*.whl"))
          assert len(wheels) == 1, wheels
          with zipfile.ZipFile(wheels[0]) as archive:
              names = archive.namelist()
          assert any(name.endswith("pid_core_rs/__init__.pyi") for name in names), names
          assert any(name.endswith("py.typed") for name in names), names
          assert any(".dist-info/sboms/" in name for name in names), names
          PY

  python-experimental-smoke:
    name: Python experimental namespace smoke
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: python -m pip install maturin==1.14.1 numpy==2.5.1 pytest==9.1.1
      - run: >-
          maturin build --release --locked
          --manifest-path crates/pid-python/Cargo.toml
          --features python-experimental --out dist
      - run: python -m pip install --no-index --find-links dist pid-core-rs==0.9.0
      - run: python -m pip check
      - run: pytest crates/pid-python/tests -q
        env:
          PID_CORE_RS_EXPECT_EXPERIMENTAL: "1"
