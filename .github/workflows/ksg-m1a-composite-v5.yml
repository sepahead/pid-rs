name: KSG M1a composite v5 (retired)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    name: Refuse retired composite-v5 qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Preserve the failed attempt-1 boundary
        env:
          PUBLISHED_C5: be862b155d710573ec95356fc1cbe9a96a2b83b9
          FAILED_CI_ATTEMPT_1_RUN: "32107469096"
          SUCCESSFUL_CODEQL_ATTEMPT_1_RUN: "32107469060"
          FAILED_CONTRACT_ATTEMPT_1_RUN: "32107469077"
        run: |
          set -euo pipefail
          echo "Composite v5 is retired after failed attempt-1 CI run ${FAILED_CI_ATTEMPT_1_RUN} and contract run ${FAILED_CONTRACT_ATTEMPT_1_RUN} for ${PUBLISHED_C5}." >&2
          echo "CodeQL run ${SUCCESSFUL_CODEQL_ATTEMPT_1_RUN} cannot transfer qualification credit across the failed C5 boundary." >&2
          echo "R5 is permanently unissued; use the composite-v6 workflow for a fresh C6 qualification." >&2
          exit 1
