version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    # Retain security updates while suppressing routine version-update pull requests.
    open-pull-requests-limit: 0

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    # Retain security updates while suppressing routine version-update pull requests.
    open-pull-requests-limit: 0

  - package-ecosystem: pip
    directory: "/crates/pid-python"
    schedule:
      interval: weekly
    # Retain security updates while suppressing routine version-update pull requests.
    open-pull-requests-limit: 0
