<svg xmlns="http://www.w3.org/2000/svg" width="512pt" height="248pt" viewBox="0 0 512 248" role="img" aria-labelledby="title desc">
<title id="title">WHAT THE EXTRA BIT CONTRIBUTES</title><desc id="desc">Five signed Makkeh–Gutknecht–Wibral categorical shared-exclusions contributions at the 100-count recording width. The flag-alone term is negative. Four positive terms offset it. The Williams–Beer comparison places the whole gain at the three-input position.</desc>
<g font-family="Source Sans Pro, Arial, sans-serif">
