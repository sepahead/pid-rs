<text x="22" y="17" font-size="8.1" text-anchor="start" fill="#916400" font-weight="700">WHAT THE EXTRA BIT CONTRIBUTES</text>
<text x="15" y="37" font-size="14" text-anchor="start" fill="#1F3F60" font-weight="700">The same total can have different contributions</text>
<text x="15" y="52" font-size="9" text-anchor="start" fill="#2C3E50">Width 100 in nominal input counts. The bit records basal &gt; tuft. Values are nats per setting.</text>
<text x="15" y="73" font-size="8.5" text-anchor="start" fill="#1F6968" font-weight="700">Source rule for the atom</text>
