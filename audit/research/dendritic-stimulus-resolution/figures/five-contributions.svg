<text x="253" y="210" font-size="8.2" text-anchor="start" fill="#2C3E50">Diamond: minimum specific information (Williams–Beer)</text>
<line x1="15" y1="221" x2="497" y2="221" stroke="#D2E0E2" stroke-width="0.65"/>
<text x="15" y="237" font-size="8.7" text-anchor="start" fill="#1F3F60" font-weight="700">Sum under either method: +0.01155 nats. Best three-class decisions with or without the bit: 486 of 651 correct.</text>
