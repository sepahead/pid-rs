<text x="797" y="166" fill="#1F3F60" font-family="Liberation Sans,Arial,sans-serif" font-size="17" font-weight="bold" text-anchor="end">−0.244337</text>
<text x="410" y="196" fill="#1F6968" font-family="Liberation Sans,Arial,sans-serif" font-size="16" font-weight="bold" text-anchor="start">Force and torque together</text>
