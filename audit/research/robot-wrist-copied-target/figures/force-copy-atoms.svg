<text x="797" y="232" fill="#1F6968" font-family="Liberation Sans,Arial,sans-serif" font-size="17" font-weight="bold" text-anchor="end">+0.244337</text>
<line x1="510" y1="246" x2="736" y2="246" stroke="#2C3E50" stroke-width="1"/>
<line x1="510" y1="242" x2="510" y2="250" stroke="#2C3E50" stroke-width="1"/>
