<text x="410" y="92" fill="#1F6968" font-family="Liberation Sans,Arial,sans-serif" font-size="19" font-weight="bold" text-anchor="start">Signed atom means</text>
<text x="410" y="115" fill="#2C3E50" font-family="Liberation Sans,Arial,sans-serif" font-size="15" font-weight="normal" text-anchor="start">Nats per episode</text>
<line x1="623" y1="138" x2="623" y2="236" stroke="#2C3E50" stroke-width="1"/>
<text x="410" y="143" fill="#1F3F60" font-family="Liberation Sans,Arial,sans-serif" font-size="16" font-weight="bold" text-anchor="start">Torque alone</text>
