<line x1="14" y1="318" x2="814" y2="318" stroke="#D2E0E2" stroke-width="1.4"/>
<text x="15" y="341" fill="#1F3F60" font-family="Liberation Sans,Arial,sans-serif" font-size="16" font-weight="bold" text-anchor="start">Force reproduces 117 of 117 copied targets.</text>
<text x="15" y="364" fill="#2C3E50" font-family="Liberation Sans,Arial,sans-serif" font-size="15" font-weight="normal" text-anchor="start">After force is known, the conditional mutual information from torque is exactly 0 nats.</text>
</svg>
