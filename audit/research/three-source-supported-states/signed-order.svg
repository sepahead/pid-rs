<svg xmlns="http://www.w3.org/2000/svg" width="720" height="213" viewBox="0 0 720 213" role="img" aria-labelledby="title desc">
  <title id="title">Two directions for the signed likelihood ratio</title>
  <desc id="desc">Arrows follow the family order upward from A, a match on X or Y, where the signed factor is four thirds. At B, matching X gives one. At C, matching Y gives two.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.4" markerHeight="6.4" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#1F3F60"/>
    </marker>
  </defs>
  <g stroke="#1F3F60" stroke-width="2" fill="none">
    <path d="M 291 148 L 182 74" marker-end="url(#arrow)"/>
    <path d="M 429 148 L 538 74" marker-end="url(#arrow)"/>
  </g>
  <g stroke="#1F6968" stroke-width="1.5" fill="#F7F3E9">
    <rect x="42" y="5" width="218" height="65" rx="3"/>
    <rect x="460" y="5" width="218" height="65" rx="3"/>
  </g>
  <rect x="233" y="147" width="254" height="61" rx="3" stroke="#1F3F60" stroke-width="1.8" fill="#D2E0E2"/>
  <g font-family="Source Sans Pro, sans-serif" text-anchor="middle" fill="#2C3E50">
    <g font-size="20" font-weight="600">
      <text x="151" y="30">B · Match X</text>
      <text x="569" y="30">C · Match Y</text>
      <text x="360" y="169">A · Match X or Y</text>
    </g>
    <g font-size="18">
      <text x="151" y="54">Signed factor 1</text>
      <text x="569" y="54">Signed factor 2</text>
      <text x="360" y="193">Signed factor 4/3</text>
    </g>
    <g font-size="17" font-style="italic">
      <text x="169" y="119">decreases</text>
      <text x="553" y="119">increases</text>
    </g>
  </g>
</svg>
