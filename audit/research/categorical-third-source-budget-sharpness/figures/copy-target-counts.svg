<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="700" height="265" viewBox="0 0 700 265" role="img" aria-labelledby="title description">
  <title id="title">Two four-observation tables with the same entropies</title>
  <desc id="description">The first table has rows 100, 011 and 010. The second has rows 010, 101 and 010. A double outline marks the first table’s central occupied cell. Its row and column both have another occupied cell. The second table has no such cell. Both tables have the same row and column counts. M is measured in nats. It sums the absolute values of the five signed mean atoms for which every source group contains source three. The target copies X and source two is constant.</desc>
