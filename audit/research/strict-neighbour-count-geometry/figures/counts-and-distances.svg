<text x="55" y="124" text-anchor="start" font-size="15" font-weight="normal" fill="#2C3E50">x and y each include the query row.</text>
<text x="548" y="124" text-anchor="start" font-size="15" font-weight="normal" fill="#2C3E50">Row 0 is the query row. Each point is another row.</text>
