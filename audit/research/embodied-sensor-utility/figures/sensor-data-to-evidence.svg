<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xml:lang="en" width="1200" height="1370" viewBox="0 0 1200 1370" role="img" aria-labelledby="title desc">
<title id="title">From separate sensors to PID and fusion evaluation</title>
<desc id="desc">Diagram by Sepehr Mahmoudian. Proposed offline adapter, not an implemented camera/audio experiment. Camera 1 and camera 2 each supply RGB or grayscale images to a separate application of a declared frozen vision extractor. Audio supplies a causal waveform window to a declared feature or audio extractor. Each separate output is encoded using fixed or training-fitted bins, yielding one categorical source group per sensor, with common context held fixed. A separately measured reference supplies target Y. Aligned rows are evaluated with existing two-to-four-source categorical MGW, subset information and separately trained fusion predictors. Whole episodes are split before fitting or tuning. The lower panel shows schematic usable, partial, distorted and missing observations. Availability and quality are distinct; quality available only to an offline annotator cannot silently be supplied to a deployed predictor. All drawings are illustrative, not data or performance claims.</desc>
<defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" viewBox="0 0 12 12" refX="11" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#2C3E50"/></marker></defs>
<style>
text{font-family:"Source Sans Pro",Arial,sans-serif;fill:#2C3E50;font-size:24px}
.title{font-size:33px;font-weight:700;fill:#1F3F60}.heading{font-size:26px;font-weight:700;fill:#1F6968}.small{font-size:22px}.label{font-weight:700}.box{fill:#F7F3E9;stroke:#D2E0E2;stroke-width:2}.arrow{fill:none;stroke:#2C3E50;stroke-width:2.6;stroke-linejoin:round;marker-end:url(#arrow)}
</style>
<rect width="1200" height="1370" fill="#F7F3E9"/><rect width="1200" height="8" fill="#1F3F60"/>
<text x="40" y="56" class="title">From separate sensors to PID and fusion evaluation</text>
<text x="40" y="94" class="small">Proposed offline workflow · fixed context · one declared physical target</text>
<text x="40" y="139" class="heading">1  Raw observations</text><text x="370" y="139" class="heading">2  Separate extractors</text><text x="790" y="139" class="heading">3  Categorical sources</text>
<rect x="40" y="158" width="280" height="108" rx="10" class="box"/><text x="58" y="192" class="label">Camera 1</text><text x="58" y="224">RGB: H × W × 3</text><text x="58" y="253" class="small">or grayscale: H × W × 1</text>
<rect x="370" y="158" width="360" height="108" rx="10" class="box"/><text x="390" y="192" class="label">Frozen vision extractor</text><text x="390" y="224">This camera; context fixed</text><text x="390" y="253" class="small">Small feature vector z₁</text>
<rect x="790" y="158" width="370" height="108" rx="10" class="box"/><text x="810" y="192" class="label">Declared bins → X₁</text><text x="810" y="224">One group per camera</text><text x="810" y="253" class="small">Retain the encoding identity</text>
<path class="arrow" d="M330 212 H357"/><path class="arrow" d="M742 212 H777"/>
<rect x="40" y="286" width="280" height="108" rx="10" class="box"/><text x="58" y="320" class="label">Camera 2</text><text x="58" y="352">Its own frame + time</text><text x="58" y="381" class="small">View + calibration identity</text>
<rect x="370" y="286" width="360" height="108" rx="10" class="box"/><text x="390" y="320" class="label">Frozen vision extractor</text><text x="390" y="352">This camera; context fixed</text><text x="390" y="381" class="small">Small feature vector z₂</text>
<rect x="790" y="286" width="370" height="108" rx="10" class="box"/><text x="810" y="320" class="label">Declared bins → X₂</text><text x="810" y="352">Keep the two views separate</text><text x="810" y="381" class="small">Shared weights ≠ fused inputs</text>
<path class="arrow" d="M330 340 H357"/><path class="arrow" d="M742 340 H777"/>
<rect x="40" y="414" width="280" height="108" rx="10" class="box"/><text x="58" y="448" class="label">Pressure microphone</text><text x="58" y="480">Window ending by t</text><text x="58" y="509" class="small">Rate · units · clipping · age</text>
<rect x="370" y="414" width="360" height="108" rx="10" class="box"/><text x="390" y="448" class="label">Declared audio extractor</text><text x="390" y="480">RMS, bands, or frozen model</text><text x="390" y="509" class="small">Small feature vector z₃</text>
<rect x="790" y="414" width="370" height="108" rx="10" class="box"/><text x="810" y="448" class="label">Declared bins → X₃</text><text x="810" y="480">One group per audio view</text><text x="810" y="509" class="small">Loudness is not direction</text>
<path class="arrow" d="M330 468 H357"/><path class="arrow" d="M742 468 H777"/>
<path d="M1170 212 H1182 V610 H975 V625 M1170 340 H1182 M1170 468 H1182" fill="none" stroke="#2C3E50" stroke-width="2.6"/>
<path class="arrow" d="M975 613 V627"/>
<text x="40" y="564" class="label">Split whole episodes before fitting or tuning. Freeze all selected maps.</text>
<text x="40" y="600" class="small">Keep sensor ID, timestamps, fixed context, availability M and quality Q.</text>
<rect x="40" y="640" width="1120" height="90" rx="10" class="box"/>
<text x="60" y="677" class="heading">4  Aligned features z, categories X, and reference Y</text>
<text x="60" y="710">Reference Y comes from a separate measurement / annotation route.</text>
<path class="arrow" d="M600 742 V762 H307 V779"/><path class="arrow" d="M600 762 H893 V779"/>
<rect x="40" y="792" width="534" height="144" rx="10" class="box"/><text x="60" y="830" class="heading">5a  Offline information analysis</text><text x="60" y="865">Existing Rust: categorical MGW, 2–4 sources</text><text x="60" y="899">Signed atoms + subset MI / CMI</text><text x="60" y="925" class="small">Describes the retained feature categories</text>
<rect x="626" y="792" width="534" height="144" rx="10" class="box"/><text x="646" y="830" class="heading">5b  Separate fusion-model study</text><text x="646" y="865">Train on X or retained features z</text><text x="646" y="899">Compare all 8 subsets for 3 sources</text><text x="646" y="925" class="small">Held-out loss · outages · calibration · cost</text>
<text x="40" y="977" class="small">Quantized-feature PID does not characterize all raw pixels, audio, or a richer model input.</text>
<path d="M40 997 H1160" stroke="#D2E0E2" stroke-width="2"/>
<text x="40" y="1034" class="heading">Quality is a separate record, not a binary availability flag</text>
<g transform="translate(40,1056)"><rect width="250" height="118" rx="8" class="box"/><rect x="20" y="18" width="70" height="62" fill="#D2E0E2" stroke="#1F3F60"/><circle cx="55" cy="49" r="16" fill="#1F6968"/><text x="108" y="42" class="label">Usable</text><text x="108" y="72" class="small">M = 1</text><text x="20" y="104" class="small">Reference condition</text></g>
<g transform="translate(330,1056)"><rect width="250" height="118" rx="8" class="box"/><rect x="20" y="18" width="70" height="62" fill="#D2E0E2" stroke="#1F3F60"/><circle cx="55" cy="49" r="16" fill="#1F6968"/><rect x="53" y="18" width="37" height="62" fill="#2C3E50"/><text x="108" y="42" class="label">Partial</text><text x="108" y="72" class="small">M = 1</text><text x="20" y="104" class="small">Object partly hidden</text></g>
<g transform="translate(620,1056)"><rect width="250" height="118" rx="8" class="box"/><rect x="20" y="18" width="70" height="62" fill="#D2E0E2" stroke="#1F3F60"/><circle cx="49" cy="49" r="16" fill="#1F6968" opacity=".25"/><circle cx="61" cy="49" r="16" fill="#1F6968" opacity=".4"/><path d="M24 28 L86 72 M24 70 L86 25" stroke="#916400" stroke-width="2"/><text x="108" y="42" class="label">Distorted</text><text x="108" y="72" class="small">M = 1</text><text x="20" y="104" class="small">Blur, noise, or clipping</text></g>
<g transform="translate(910,1056)"><rect width="250" height="118" rx="8" class="box"/><rect x="20" y="18" width="70" height="62" fill="none" stroke="#743E37" stroke-dasharray="5 4"/><path d="M37 49 H73" stroke="#743E37" stroke-width="3"/><text x="108" y="42" class="label">Missing</text><text x="108" y="72" class="small">M = 0</text><text x="20" y="104" class="small">No observation</text></g>
<text x="40" y="1215">Compare supported quality regimes on common episodes and fixed encodings.</text>
<text x="40" y="1253">An offline quality label is not automatically available to either predictor.</text>
<text x="40" y="1291" class="small">Natural occlusion can depend on the target. Do not assume random dropout.</text>
<text x="40" y="1342" class="small">Schematic inputs only · no benchmark result · Sepehr Mahmoudian</text>
</svg>
