  <line x1="772.000" y1="326" x2="772.000" y2="332" stroke="#2C3E50" stroke-width="1.3" />
  <text x="772.000" y="351" font-family="Source Sans Pro, sans-serif" font-size="15" fill="#2C3E50" text-anchor="middle" font-weight="400">10</text>
  <line x1="851.000" y1="326" x2="851.000" y2="332" stroke="#2C3E50" stroke-width="1.3" />
