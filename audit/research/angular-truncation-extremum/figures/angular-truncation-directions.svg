<svg xmlns="http://www.w3.org/2000/svg" width="900" height="465" viewBox="0 0 900 465" role="img" aria-labelledby="title desc">
  <title id="title">Direction and radius of four-moment truncation error</title>
  <desc id="desc">Both panels retain four even moments. At fixed radius 0.30 both pure harmonics maximize absolute error; only the first maximizes relative error. On the first-harmonic axis, relative error crosses one part per million at radius 0.292038608776134 to 0.292038608776135.</desc>
