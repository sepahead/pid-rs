  <line x1="562" y1="177.0" x2="910" y2="177.0" stroke="#D2E0E2" stroke-width="1" />
  <text font-family="Source Sans Pro, sans-serif" font-weight="400" font-size="15" text-anchor="end" x="549" y="182.0" fill="#2C3E50">3</text>
  <line x1="562" y1="107.0" x2="910" y2="107.0" stroke="#D2E0E2" stroke-width="1" />
  <text font-family="Source Sans Pro, sans-serif" font-weight="400" font-size="15" text-anchor="end" x="549" y="112.0" fill="#2C3E50">4</text>
  <line x1="562" y1="93" x2="562" y2="319" stroke="#2C3E50" stroke-width="1" />
  <line x1="562" y1="319" x2="910" y2="319" stroke="#2C3E50" stroke-width="1" />
