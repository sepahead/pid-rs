  <rect x="629.4" y="194.733" width="11.2" height="11.2" fill="#FFFFFF" stroke="#1F3F60" />
  <rect x="662.4" y="206.4" width="11.2" height="11.2" fill="#FFFFFF" stroke="#1F3F60" />
  <rect x="695.4" y="213.4" width="11.2" height="11.2" fill="#FFFFFF" stroke="#1F3F60" />
  <rect x="728.4" y="218.067" width="11.2" height="11.2" fill="#FFFFFF" stroke="#1F3F60" />
  <rect x="761.4" y="221.4" width="11.2" height="11.2" fill="#FFFFFF" stroke="#1F3F60" />
  <rect x="794.4" y="223.9" width="11.2" height="11.2" fill="#FFFFFF" stroke="#1F3F60" />
