<?xml version='1.0' encoding='utf-8'?>
<svg aria-labelledby="title desc" xmlns="http://www.w3.org/2000/svg" width="960" height="415" viewBox="0 0 960 415" role="img">
  <title id="title">Nested source partitions and the smallest non-unit directed product</title>
  <desc id="desc">Left: successively record the first one, two and three bits of an eight-state value. The three keys that can carry nonzero atoms are 01+02+04, 02+04 and 04. Right: for each integer sample total from two through twelve, circles show the minimum possible product at a failed fine-to-coarse map for unrestricted finite alphabets; squares show the minimum with at most two fine labels. Each observation contributes its union-match count divided by its coarse-match count. A product of one means the map exists.</desc>
  <rect x="0" y="0" width="960" height="415" fill="#FFFFFF" stroke="none" />
  <line x1="480" y1="25" x2="480" y2="383" stroke="#D2E0E2" stroke-width="1.5" />
  <text font-family="Source Sans Pro, sans-serif" font-weight="600" font-size="24" text-anchor="start" x="20" y="40" fill="#1F3F60">Three nested readings</text>
  <text font-family="Source Sans Pro, sans-serif" font-weight="400" font-size="16" text-anchor="start" x="20" y="68" fill="#2C3E50">Eight possible finest readings, grouped by bit prefix</text>
  <text font-family="Source Sans Pro, sans-serif" font-weight="600" font-size="16" text-anchor="start" x="18" y="122" fill="#2C3E50">Coarse</text>
  <rect x="100.0" y="100" width="169.0" height="32" fill="#F7F3E9" stroke="#1F3F60" />
  <text font-family="Source Sans Pro, sans-serif" font-weight="400" font-size="15" text-anchor="middle" x="184.5" y="122" fill="#2C3E50">0</text>
  <rect x="269.0" y="100" width="169.0" height="32" fill="#FFFFFF" stroke="#1F3F60" />
  <text font-family="Source Sans Pro, sans-serif" font-weight="400" font-size="15" text-anchor="middle" x="353.5" y="122" fill="#2C3E50">1</text>
  <text font-family="Source Sans Pro, sans-serif" font-weight="400" font-size="15" text-anchor="start" x="100" y="153" fill="#1F6968">Possible nonzero atom at key 01+02+04</text>
  <text font-family="Source Sans Pro, sans-serif" font-weight="600" font-size="16" text-anchor="start" x="18" y="204" fill="#2C3E50">Middle</text>
  <rect x="100.0" y="182" width="84.5" height="32" fill="#F7F3E9" stroke="#1F3F60" />
  <text font-family="Source Sans Pro, sans-serif" font-weight="400" font-size="15" text-anchor="middle" x="142.25" y="204" fill="#2C3E50">00</text>
  <rect x="184.5" y="182" width="84.5" height="32" fill="#FFFFFF" stroke="#1F3F60" />
  <text font-family="Source Sans Pro, sans-serif" font-weight="400" font-size="15" text-anchor="middle" x="226.75" y="204" fill="#2C3E50">01</text>
  <rect x="269.0" y="182" width="84.5" height="32" fill="#F7F3E9" stroke="#1F3F60" />
  <text font-family="Source Sans Pro, sans-serif" font-weight="400" font-size="15" text-anchor="middle" x="311.25" y="204" fill="#2C3E50">10</text>
  <rect x="353.5" y="182" width="84.5" height="32" fill="#FFFFFF" stroke="#1F3F60" />
  <text font-family="Source Sans Pro, sans-serif" font-weight="400" font-size="15" text-anchor="middle" x="395.75" y="204" fill="#2C3E50">11</text>
  <text font-family="Source Sans Pro, sans-serif" font-weight="400" font-size="15" text-anchor="start" x="100" y="235" fill="#1F6968">Possible nonzero atom at key 02+04</text>
  <text font-family="Source Sans Pro, sans-serif" font-weight="600" font-size="16" text-anchor="start" x="18" y="286" fill="#2C3E50">Fine</text>
  <rect x="100.0" y="264" width="42.25" height="32" fill="#F7F3E9" stroke="#1F3F60" />
  <text font-family="Source Sans Pro, sans-serif" font-weight="400" font-size="15" text-anchor="middle" x="121.125" y="286" fill="#2C3E50">000</text>
  <rect x="142.25" y="264" width="42.25" height="32" fill="#FFFFFF" stroke="#1F3F60" />
  <text font-family="Source Sans Pro, sans-serif" font-weight="400" font-size="15" text-anchor="middle" x="163.375" y="286" fill="#2C3E50">001</text>
  <rect x="184.5" y="264" width="42.25" height="32" fill="#F7F3E9" stroke="#1F3F60" />
  <text font-family="Source Sans Pro, sans-serif" font-weight="400" font-size="15" text-anchor="middle" x="205.625" y="286" fill="#2C3E50">010</text>
  <rect x="226.75" y="264" width="42.25" height="32" fill="#FFFFFF" stroke="#1F3F60" />
  <text font-family="Source Sans Pro, sans-serif" font-weight="400" font-size="15" text-anchor="middle" x="247.875" y="286" fill="#2C3E50">011</text>
  <rect x="269.0" y="264" width="42.25" height="32" fill="#F7F3E9" stroke="#1F3F60" />
