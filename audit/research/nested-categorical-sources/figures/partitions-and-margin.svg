  <text font-family="Source Sans Pro, sans-serif" font-weight="400" font-size="15" text-anchor="middle" x="332.375" y="286" fill="#2C3E50">101</text>
  <rect x="353.5" y="264" width="42.25" height="32" fill="#F7F3E9" stroke="#1F3F60" />
  <text font-family="Source Sans Pro, sans-serif" font-weight="400" font-size="15" text-anchor="middle" x="374.625" y="286" fill="#2C3E50">110</text>
  <rect x="395.75" y="264" width="42.25" height="32" fill="#FFFFFF" stroke="#1F3F60" />
  <text font-family="Source Sans Pro, sans-serif" font-weight="400" font-size="15" text-anchor="middle" x="416.875" y="286" fill="#2C3E50">111</text>
  <text font-family="Source Sans Pro, sans-serif" font-weight="400" font-size="15" text-anchor="start" x="100" y="317" fill="#1F6968">Possible nonzero atom at key 04</text>
  <text font-family="Source Sans Pro, sans-serif" font-weight="400" font-size="15" text-anchor="start" x="20" y="359" fill="#2C3E50">The other 15 nodes have zero in all three atom components.</text>
  <text font-family="Source Sans Pro, sans-serif" font-weight="400" font-size="15" text-anchor="start" x="20" y="386" fill="#2C3E50">Key masks name sources. 01 is coarse, 02 middle and 04 fine.</text>
  <text font-family="Source Sans Pro, sans-serif" font-weight="600" font-size="24" text-anchor="start" x="505" y="40" fill="#1F3F60">Smallest positive departure</text>
  <text font-family="Source Sans Pro, sans-serif" font-weight="400" font-size="16" text-anchor="start" x="505" y="67" fill="#2C3E50">Minimum directed product G at a failed map</text>
  <text font-family="Source Sans Pro, sans-serif" font-weight="400" font-size="14" text-anchor="start" x="505" y="89" fill="#2C3E50">At N = 4 the circle gives 9/4 and the square gives 8/3.</text>
  <line x1="562" y1="317.0" x2="910" y2="317.0" stroke="#D2E0E2" stroke-width="1" />
