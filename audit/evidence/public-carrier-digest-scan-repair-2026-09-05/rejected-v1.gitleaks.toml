title = "pid-rs secret-scanning policy"

[extend]
useDefault = true

# Repository evidence intentionally records public SHA-256 digests under the exact JSON keys below.
# The generic API-key rule mistakes each key name plus a 64-hex digest for a credential. Every
# exception binds both the file path and complete line shape, so nearby or differently named values
# remain covered by the default rule.
[[rules]]
id = "generic-api-key"

  [[rules.allowlists]]
  description = "Public SHA-256 digest in the repository-cut evidence"
  condition = "AND"
  regexTarget = "line"
  regexes = ['''^\s*"api_projection_sha256":\s*"[0-9a-f]{64}",?\s*$''']
  paths = ['''^audit/evidence/repository-snapshot\.json$''']

  [[rules.allowlists]]
  description = "Public GitHub Actions job-API SHA-256 digests in the exact C3 hosted receipt"
  condition = "AND"
  regexTarget = "line"
  regexes = ['''^\s*"job_api_sha256":\s*"[0-9a-f]{64}",?\s*$''']
  paths = ['''^audit/evidence/workflow-pdf-lualatex-format-hosted-receipt-2026-08-06\.json$''']

  [[rules.allowlists]]
  description = "Public API-snapshot SHA-256 digest in the pinned 1.0 release scope"
  condition = "AND"
  regexTarget = "line"
  regexes = ['''^\s*"public_api_snapshot_sha256":\s*"[0-9a-f]{64}",?\s*$''']
  paths = ['''^release-scope-1\.0\.json$''']

  [[rules.allowlists]]
  description = "Public API-snapshot SHA-256 digest in the append-only signature registry"
  condition = "AND"
  regexTarget = "line"
  regexes = ['''^\s*"public_api_snapshot_sha256":\s*"[0-9a-f]{64}",?\s*$''']
  paths = ['''^audit/api/public-api/pid-core-signature-revisions\.json$''']

  [[rules.allowlists]]
  description = "Public API-snapshot SHA-256 digest copied into the frozen KSG advisory context"
  condition = "AND"
  regexTarget = "line"
  regexes = ['''^\s*[0-9]{1,6}\s+"public_api_snapshot_sha256":\s*"[0-9a-f]{64}",?\s*$''']
  paths = ['''^audit/evidence/fable5-ksg-rev4-settled-hostile-20260727T120200Z-context\.md$''']

  # Keep the four token-stream shapes below separate. A combined optional-quote/optional-prefix/
  # alternate-separator expression suppressed cross-syntax and wrong-key near misses. The hostile
  # policy matrix must continue to detect those malformed variants with the default generic rule.
  [[rules.allowlists]]
  description = "Public mutant SMT token-stream SHA-256 digest in the active KSG packet"
  condition = "AND"
  regexTarget = "line"
  regexes = ['''^\s*"mutant_token_stream_sha256":\s*"[0-9a-f]{64}",?\s*$''']
  paths = ['''^claims/KSG-INTEGER-HARMONIC-001/active-packet-v4\.json$''']

  [[rules.allowlists]]
  description = "Public SMT token-stream SHA-256 digest in the KSG shape witness"
  condition = "AND"
  regexTarget = "line"
  regexes = ['''^\s*"token_stream_sha256":\s*"[0-9a-f]{64}",?\s*$''']
  paths = ['''^claims/KSG-INTEGER-HARMONIC-001/failures/smtlib-shape-and-snapshot-v4\.json$''']

  [[rules.allowlists]]
  description = "Public mutant SMT token-stream SHA-256 digest in the KSG revision checker"
  condition = "AND"
  regexTarget = "line"
  regexes = ['''^\s*"mutant_token_stream_sha256":\s*"[0-9a-f]{64}",?\s*$''']
  paths = ['''^scripts/check-ksg-harmonic-revision\.py$''']

  [[rules.allowlists]]
  description = "Public SMT token-stream SHA-256 digests in the Z3 checker specifications"
  condition = "AND"
  regexTarget = "line"
  regexes = ['''^\s*token_stream_sha256\s*=\s*"[0-9a-f]{64}",?\s*$''']
  paths = ['''^scripts/check-z3-ksg-integer-harmonic\.py$''']

  [[rules.allowlists]]
  description = "Exact public SxPID3 coordinate-count prose, not a credential"
  condition = "AND"
  regexTarget = "line"
  # Gitleaks can retain the preceding physical line in this rule's scan context. Multiline anchors
  # keep the exception bound to exactly one complete physical line in that larger context.
  regexes = ['''(?m)^18-key serialization order, 108-coordinate certificate, resource policy, independent-verification$''']
  paths = ['''^claims/SX-CERTIFIED-AVERAGED-PID3-001/claim-v1\.md$''']

  [[rules.allowlists]]
  description = "Exact public Fin-3 carrier digest in its frozen semantic bridge"
  condition = "AND"
  regexTarget = "line"
  regexes = ['''^[ \t]*"carrier_keys_sha256":[ \t]*"eac2b9ff616cce863e48c78fb0398c8ba81a582771f7d68e619c3262929d14a2",?[ \t]*$''']
  paths = [
    '''^audit/evidence/sxpid3-mgw-v5-program-a-semantic-bridge-v4\.json$''',
    '''^scripts/check-sxpid3-mgw-v5-program-a-semantic-bridge-v4\.py$''',
  ]
