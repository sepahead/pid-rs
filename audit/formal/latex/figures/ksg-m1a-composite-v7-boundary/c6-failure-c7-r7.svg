<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xml:lang="en" width="160mm" height="90mm" viewBox="0 0 1600 900" role="img" aria-labelledby="v7-title v7-desc" data-predecessor="C6" data-failed-receipt="R6" data-successor="C7" data-receipt="R7" data-defect-count="2" data-local-defect="authority-stream-bound" data-hosted-defect="missing-ripgrep-declaration" data-r6-status="permanently-unissued">
  <title id="v7-title">Two distinct C6 operational defects keep R6 unissued; direct-child C7 repairs both and makes R7 conditional</title>
  <desc id="v7-desc">Published C6 remains immutable and R6 is permanently absent. The first defect is local: the C6 recorder requires exact authority blobs of 69,573 and 124,520 bytes but routes the committed reads through a 65,536-byte internal-command cap. The canonical counterexample binds this contradiction. The second defect is hosted: both dedicated and repository CI lanes reached the same missing command rg marker because ripgrep was omitted from their package declarations. Those two manifestations are correlated observations of one dependency-declaration defect, not independent evidence, and they do not evidence PDF-content failure. Direct-child C7 preserves every v6 publication and gate byte. A new authority-only wrapper reads a hardcoded authority path from the validated exact C7 commit with a 2 MiB bound; inherited generic probes remain unchanged at 64 KiB. C7 installs the named, not-byte-pinned ripgrep apt package, requires command -v rg to resolve exactly to /usr/bin/rg, probes /usr/bin/rg --version, and separately binds rg in the local roster. Replay r11 is the finalized C6-era predecessor replay and fresh r12 is the current C7 replay cut. R7 remains conditional on one unnumbered L7 local observation and fresh attempt-one CI7, CodeQL7, and dedicated-v7 success for exact C7. If all four terms pass, R7 changes exactly the current-source manifest, local record, hosted capture, and derived receipt. This diagram grants no science, mathematics, estimator, security, authentication, authorship, trusted-time, hermeticity, PDF-UA, renderer-independence, or independence credit.</desc>
