    <text x="1135" y="368" class="left-small">install ripgrep; require /usr/bin/rg</text>
    <text x="1135" y="398" class="left-small">probe /usr/bin/rg --version</text>
    <text x="1135" y="428" class="left-small">local roster separately binds rg</text>
    <path d="M1048 442 H1518" stroke="#D2E0E2" stroke-width="3"/>
    <text x="1282" y="473" class="small">all v6 publication + gate bytes preserved</text>
    <text x="1282" y="500" class="small">missing rg is not PDF-content failure</text>
  </g>

