<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xml:lang="en" width="160mm" height="90mm" viewBox="0 0 1600 900" role="img" aria-labelledby="v5-title v5-desc" data-predecessor="C4" data-failed-contract="v4" data-successor="C5" data-receipt="R5" data-r4-status="permanently-unissued" data-repair-count="5" data-fifth-repair="legacy-hosted-recovery-readme-token-expectation">
  <title id="v5-title">A failed C4 qualification cannot issue R4; C5 creates a fresh qualification route to R5</title>
  <desc id="v5-desc">The published C4 commit remains immutable. Its hosted CI finished with 41 successful and four failed jobs, and its dedicated composite-v4 workflow failed, so the conjunction Q4 is false and R4 is permanently unissued even though CodeQL passed. A direct-child C5 records the failure and repairs five bounded failure surfaces without changing PID or KSG results. The fifth repair replaces only a stale live README-token expectation in the legacy hosted-recovery validator; its historical Git and custody logic remains in force, and composite-v3 remains unissued. Only a fresh attempt-one run in which local gates, CI, CodeQL, and the dedicated v5 workflow all succeed can make Q5 true. R5 may then retain the successor capture, derive a typed receipt, and regenerate the self-excluding source manifest. The diagram states process custody only, not scientific validity, authentication, independence, or reproducibility.</desc>
  <defs>
    <marker id="v5-arrow-navy" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#1F3F60"/>
    </marker>
    <marker id="v5-arrow-teal" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#1F6968"/>
    </marker>
    <marker id="v5-arrow-gold" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#9A6B10"/>
    </marker>
    <pattern id="v5-blocked-hatch" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="16" stroke="#9A6B10" stroke-width="4"/>
    </pattern>
    <style>
      .eyebrow { font-family: 'Source Sans Pro', sans-serif; font-size: 25px; font-weight: 700; letter-spacing: 2px; fill: #596A73; }
      .headline { font-family: 'Source Sans Pro', sans-serif; font-size: 40px; font-weight: 700; fill: #1F3F60; }
      .card-title { font-family: 'Source Sans Pro', sans-serif; font-size: 30px; font-weight: 700; fill: #2C3E50; text-anchor: middle; }
      .body { font-family: 'Latin Modern Roman', serif; font-size: 26px; fill: #2C3E50; text-anchor: middle; }
      .small { font-family: 'Source Sans Pro', sans-serif; font-size: 25px; font-weight: 600; fill: #596A73; text-anchor: middle; }
      .left-small { font-family: 'Source Sans Pro', sans-serif; font-size: 25px; font-weight: 600; fill: #2C3E50; }
      .badge { font-family: 'Source Sans Pro', sans-serif; font-size: 25px; font-weight: 700; fill: #F7F3E9; text-anchor: middle; letter-spacing: 1px; }
      .formula { font-family: 'Latin Modern Roman', serif; font-size: 27px; font-weight: 700; fill: #2C3E50; text-anchor: middle; }
      .footer { font-family: 'Source Sans Pro', sans-serif; font-size: 25px; font-weight: 600; fill: #2C3E50; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#F7F3E9"/>
  <path d="M52 72 H1548" stroke="#D2E0E2" stroke-width="2"/>
  <path d="M52 72 H285" stroke="#9A6B10" stroke-width="7"/>
  <text x="52" y="43" class="eyebrow">APPEND-ONLY QUALIFICATION BOUNDARY</text>
  <text x="52" y="123" class="headline">A failed attempt is evidence; it is not qualification</text>

  <path d="M718 305 H772" fill="none" stroke="#9A6B10" stroke-width="4" marker-end="url(#v5-arrow-gold)"/>
  <path d="M600 170 C720 136 960 136 1062 190" fill="none" stroke="#1F3F60" stroke-width="4" stroke-dasharray="11 9" marker-end="url(#v5-arrow-navy)"/>
  <rect x="666" y="130" width="328" height="43" rx="12" fill="#F7F3E9"/>
  <text x="830" y="158" class="small">C5 direct child of C4</text>

  <g>
    <rect x="52" y="170" width="666" height="274" rx="20" fill="#D2E0E2" stroke="#1F3F60" stroke-width="4"/>
    <rect x="76" y="190" width="76" height="36" rx="18" fill="#1F3F60"/>
    <text x="114" y="216" class="badge">C4</text>
    <text x="430" y="214" class="card-title">Published bytes · hosted attempt 1</text>
    <text x="88" y="260" class="left-small">fixed</text>
    <rect x="276" y="238" width="112" height="38" rx="19" fill="#8F302A"/>
    <text x="332" y="265" class="badge">CI FAIL</text>
    <text x="414" y="265" class="left-small">41 success · 4 failed</text>
    <text x="88" y="313" class="left-small">observed</text>
    <rect x="260" y="291" width="182" height="38" rx="19" fill="#1F6968"/>
    <text x="351" y="318" class="badge">CODEQL PASS</text>
    <text x="468" y="318" class="left-small">four roles</text>
    <text x="88" y="366" class="left-small">no rewrite</text>
    <rect x="260" y="344" width="204" height="38" rx="19" fill="#8F302A"/>
    <text x="362" y="371" class="badge">V4 GATE FAIL</text>
    <text x="490" y="371" class="left-small">checkout residue</text>
    <text x="385" y="420" class="formula">Q4 = CI4 AND CodeQL4 AND D4 = false</text>

    <rect x="772" y="188" width="245" height="238" rx="20" fill="url(#v5-blocked-hatch)" stroke="#9A6B10" stroke-width="5"/>
    <rect x="783" y="199" width="223" height="216" rx="15" fill="#F7F3E9" stroke="#9A6B10" stroke-width="2"/>
    <rect x="810" y="217" width="168" height="38" rx="19" fill="#8F302A"/>
    <text x="894" y="244" class="badge">R4 UNISSUED</text>
    <text x="894" y="302" class="card-title">Fail closed</text>
    <text x="894" y="344" class="body">R4 issued iff Q4</text>
    <text x="894" y="381" class="body">Q4 is false</text>

    <rect x="1062" y="170" width="486" height="274" rx="20" fill="#F7F3E9" stroke="#1F3F60" stroke-width="4"/>
    <rect x="1082" y="189" width="76" height="36" rx="18" fill="#1F3F60"/>
    <text x="1120" y="215" class="badge">C5</text>
    <text x="1334" y="218" class="card-title">Five bounded repairs</text>
    <text x="1097" y="258" class="left-small">1</text>
    <text x="1125" y="258" class="left-small">normalize exact checkout residue</text>
    <text x="1097" y="291" class="left-small">2</text>
    <text x="1125" y="291" class="left-small">isolate release fixture from parent Git</text>
    <text x="1097" y="324" class="left-small">3</text>
    <text x="1125" y="324" class="left-small">rebind reviewed zeta prose</text>
    <text x="1097" y="357" class="left-small">4</text>
    <text x="1125" y="357" class="left-small">rebind certified-SxPID containers</text>
    <text x="1097" y="390" class="left-small">5</text>
    <text x="1125" y="390" class="left-small">replace stale v3 README-token demand</text>
    <text x="1305" y="428" class="small">fresh r10; zero numerical-result change</text>
  </g>

  <path d="M1305 444 V510 H352" fill="none" stroke="#1F3F60" stroke-width="4" marker-end="url(#v5-arrow-navy)"/>
  <text x="826" y="494" class="small">freeze corrected bytes before a fresh attempt-1 evaluation</text>

  <g>
    <rect x="52" y="522" width="620" height="210" rx="20" fill="#D2E0E2" stroke="#1F6968" stroke-width="4"/>
    <text x="352" y="565" class="card-title">Fresh C5 qualification only</text>
    <rect x="76" y="594" width="140" height="38" rx="19" fill="#1F6968"/>
    <text x="146" y="621" class="badge">L5 LOCAL</text>
    <rect x="232" y="594" width="94" height="38" rx="19" fill="#1F6968"/>
    <text x="279" y="621" class="badge">CI5</text>
    <rect x="342" y="594" width="138" height="38" rx="19" fill="#1F6968"/>
    <text x="411" y="621" class="badge">CODEQL5</text>
    <rect x="496" y="594" width="130" height="38" rx="19" fill="#1F6968"/>
    <text x="561" y="621" class="badge">V5 GATE</text>
    <text x="352" y="676" class="formula">Q5 = L5 AND CI5 AND CodeQL5 AND D5</text>
    <text x="352" y="711" class="small">one exact C5 · attempt 1 · all terminal success</text>

    <rect x="750" y="522" width="390" height="210" rx="20" fill="#F7F3E9" stroke="#1F6968" stroke-width="5"/>
    <rect x="770" y="541" width="76" height="36" rx="18" fill="#1F6968"/>
    <text x="808" y="567" class="badge">R5</text>
    <text x="990" y="567" class="card-title">Q5 permits R5</text>
    <text x="945" y="620" class="body">retain successor capture</text>
    <text x="945" y="660" class="body">derive typed receipt once</text>
    <text x="945" y="700" class="body">regenerate manifest last</text>

    <rect x="1190" y="522" width="358" height="210" rx="20" fill="#F7F3E9" stroke="#9A6B10" stroke-width="4"/>
    <text x="1369" y="566" class="card-title">Evidence, not authority</text>
    <text x="1369" y="611" class="body">predecessor failure retained</text>
    <text x="1369" y="649" class="body">successor observation retained</text>
    <text x="1369" y="687" class="body">claims remain bounded</text>
  </g>

  <path d="M672 627 H740" fill="none" stroke="#1F6968" stroke-width="5" marker-end="url(#v5-arrow-teal)"/>
  <text x="710" y="582" class="small">if true</text>
  <path d="M1140 627 H1180" fill="none" stroke="#9A6B10" stroke-width="4" marker-end="url(#v5-arrow-gold)"/>

  <rect x="52" y="772" width="1496" height="86" rx="16" fill="#D2E0E2"/>
  <rect x="52" y="772" width="9" height="86" rx="4" fill="#9A6B10"/>
  <text x="82" y="807" class="footer">PROCESS CUT: C4 stays published · R4 stays unissued · C5 is a new child · R5 needs fresh all-success evidence.</text>
  <text x="82" y="842" class="footer">NONIMPLICATION: no PID/KSG correctness · no authentication · no independence · no scientific novelty.</text>
</svg>
