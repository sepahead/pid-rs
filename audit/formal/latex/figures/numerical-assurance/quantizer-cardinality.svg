<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xml:lang="en" width="168mm" height="94mm" viewBox="0 0 1680 940" role="img" aria-labelledby="title desc">
  <title id="title">Nominal, reachable, and observed quantizer cardinalities</title>
  <desc id="desc">Nested patterned regions show nominal joint labels N, finite-binary64 reachable joint labels R, and observed joint label tuples O, with O no larger than R and R no larger than N. A separate population-support box is outside the nesting and explicitly not implied.</desc>
  <defs>
    <pattern id="top-pattern" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M0 24 L24 0" stroke="#F7F3E9" stroke-width="1.6" opacity="0.13"/>
      <circle cx="6" cy="6" r="2.2" fill="#DCA520" opacity="0.35"/>
    </pattern>
    <pattern id="nominal-pattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M0 10 H20 M10 0 V20" stroke="#916400" stroke-width="1.2" opacity="0.15"/>
    </pattern>
    <pattern id="reachable-pattern" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <path d="M0 0 V18" stroke="#1F6968" stroke-width="3" opacity="0.14"/>
    </pattern>
    <pattern id="observed-pattern" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2.1" fill="#2C3E50" opacity="0.18"/>
      <circle cx="12" cy="12" r="2.1" fill="#DCA520" opacity="0.35"/>
    </pattern>
    <style>
      .sans { font-family: "Source Sans Pro"; }
      .kicker { font-size: 22px; font-weight: 700; fill: #916400; letter-spacing: 2.5px; }
      .title { font-size: 42px; font-weight: 700; fill: #2C3E50; }
      .subtitle { font-size: 24px; font-weight: 600; fill: #1F6968; }
      .set-title { font-size: 32px; font-weight: 700; fill: #2C3E50; }
      .formula { font-family: "Latin Modern Sans"; font-size: 28px; font-weight: 400; fill: #2C3E50; }
      .body { font-size: 23px; font-weight: 400; fill: #2C3E50; }
      .small { font-size: 22px; font-weight: 600; fill: #647072; }
      .callout { font-size: 24px; font-weight: 700; fill: #2C3E50; }
      .label { font-size: 22px; font-weight: 700; fill: #1F6968; letter-spacing: 1.4px; }
    </style>
  </defs>

  <rect width="1680" height="940" fill="#F7F3E9"/>
  <rect width="1680" height="74" fill="#2C3E50"/>
  <rect width="1680" height="74" fill="url(#top-pattern)"/>

  <g class="sans">
    <rect x="80" y="114" width="13" height="42" fill="#DCA520"/>
    <text x="114" y="132" class="kicker">QUANTIZER REPORT SEMANTICS</text>
    <text x="114" y="181" class="title">Three counts, three different questions</text>
    <text x="114" y="221" class="subtitle">Observed labels are reachable; reachable labels are nominal. Population support is separate.</text>
    <path d="M80 247 H1600" stroke="#2C3E50" stroke-width="2" opacity="0.20"/>
    <path d="M80 247 H425" stroke="#916400" stroke-width="5"/>

    <g transform="translate(80 278)">
      <rect width="1060" height="550" rx="25" fill="url(#nominal-pattern)" stroke="#916400" stroke-width="3"/>
      <text x="31" y="53" class="set-title">Nominal joint labels</text>
      <text x="800" y="53" class="formula">N = B^D</text>
      <text x="31" y="91" class="small">Requested combinatorial label space</text>

      <rect x="100" y="120" width="865" height="370" rx="22" fill="#E8F0ED"/>
      <rect x="100" y="120" width="865" height="370" rx="22" fill="url(#reachable-pattern)" stroke="#1F6968" stroke-width="3"/>
      <text x="132" y="174" class="set-title">Finite-binary64 reachable labels</text>
      <text x="700" y="174" class="formula">R = product r_d</text>
      <text x="132" y="214" class="small">At least one finite represented input maps to each label</text>

      <rect x="220" y="252" width="625" height="185" rx="20" fill="#F2EBDA"/>
      <rect x="220" y="252" width="625" height="185" rx="20" fill="url(#observed-pattern)" stroke="#2C3E50" stroke-width="3"/>
      <text x="252" y="306" class="set-title">Observed joint tuples</text>
      <text x="724" y="306" class="formula">O</text>
      <text x="252" y="350" class="body">Present in the evaluated rows</text>
      <text x="252" y="400" class="formula">O &lt;= R &lt;= N</text>

      <text x="31" y="530" class="formula">N - O = (N - R) + (R - O)</text>
    </g>

    <g transform="translate(1185 278)">
      <rect width="415" height="263" rx="22" fill="#F7F3E9" stroke="#916400" stroke-width="3" stroke-dasharray="14 10"/>
      <text x="28" y="48" class="label">SEPARATE OBJECT</text>
      <text x="28" y="94" class="set-title">Population support</text>
      <text x="28" y="139" class="body">Positive probability under a</text>
      <text x="28" y="173" class="body">declared population law</text>
      <path d="M28 199 H387" stroke="#916400" stroke-width="1.5" opacity="0.45"/>
      <text x="28" y="236" class="callout">Not implied by N, R, or O</text>
    </g>

    <g transform="translate(1185 567)">
      <rect width="415" height="261" rx="22" fill="#E8F0ED" stroke="#1F6968" stroke-width="2.5"/>
      <text x="28" y="47" class="label">REPORT DIFFERENCES</text>
      <text x="28" y="91" class="formula">N - R</text>
      <text x="132" y="91" class="body">structurally unreachable</text>
      <text x="28" y="137" class="formula">R - O</text>
      <text x="132" y="137" class="body">reachable but unobserved</text>
      <text x="28" y="183" class="formula">N - O</text>
      <text x="132" y="183" class="body">legacy empty-cell field</text>
      <path d="M28 205 H387" stroke="#1F6968" stroke-width="1.5" opacity="0.40"/>
      <text x="28" y="226" class="small">None means only</text>
      <text x="28" y="250" class="small">u128 product overflow.</text>
    </g>

    <g transform="translate(80 858)">
      <rect width="1520" height="54" rx="12" fill="#2C3E50"/>
      <text x="27" y="36" style="font: 700 22px 'Source Sans Pro'; fill:#F7F3E9; letter-spacing:1.1px">DO NOT COMPACT SILENTLY: REPEATED EDGES ARE PART OF THE FITTED MAP AND ITS PROVENANCE</text>
    </g>
  </g>
</svg>
