<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xml:lang="en" width="180mm" height="120mm" viewBox="0 0 1800 1200" role="img" aria-labelledby="small-ball-title small-ball-desc">
  <title id="small-ball-title">Common-radius population bridge: coordinates, overlaps, and cancellation</title>
  <desc id="small-ball-desc">This figure summarizes the conditional population lemma in the adjacent text. The two sources take values in the same measured space M, but occupy separate source coordinates. Equal-radius balls have the same volume v r. Each source event is the preimage of its own ball under its source variable; the drawings do not imply independence or empty event overlap. The source-source overlap is little o of v r, and the target-source-source overlap is little o of the product w r v r. Local essential bounds are sufficient, not necessary, for these overlap conditions. Inclusion-exclusion leaves leading terms with a common volume factor, which cancels in the probability ratio before taking the natural logarithm. A first-order source overlap can change the denominator. The full hypotheses, density expansions, and limit are stated in the adjacent text. This is a population lemma, not a kNN or finite-sample guarantee.</desc>
  <defs>
    <pattern id="title-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0 H0 V28" fill="none" stroke="#1F6968" stroke-width="1.2" opacity="0.08"/>
    </pattern>
    <marker id="radius-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0 0 L7 3.5 L0 7 Z" fill="#2C3E50"/>
    </marker>
    <style>
      .sans { font-family: "Source Sans Pro"; fill: #2C3E50; }
      .title { font-size: 46px; font-weight: 700; fill: #1F3F60; }
      .kicker { font-size: 29px; font-weight: 700; letter-spacing: 2px; fill: #916400; }
      .subtitle { font-size: 34px; font-weight: 400; fill: #1F6968; }
      .step { font-size: 30px; font-weight: 700; letter-spacing: 1px; fill: #916400; }
      .panel-title { font-size: 35px; font-weight: 700; fill: #1F6968; }
      .body { font-size: 34px; font-weight: 400; }
      .label { font-size: 34px; font-weight: 600; }
      .formula { font-family: "Source Sans Pro"; font-size: 36px; font-weight: 400; fill: #2C3E50; }
      .factor { font-family: "Source Sans Pro"; font-size: 66px; fill: #1F3F60; }
      .sub { font-size: 72%; baseline-shift: sub; }
      .boundary { font-size: 34px; font-weight: 600; }
    </style>
  </defs>
  <rect width="1800" height="1200" fill="#F7F3E9"/>
  <g class="sans">
    <rect x="54" y="34" width="1692" height="130" rx="18" fill="url(#title-grid)" stroke="#D2E0E2" stroke-width="2"/>
    <rect x="54" y="34" width="12" height="130" rx="6" fill="#B28218"/>
    <text x="92" y="71" class="kicker">CONDITIONAL POPULATION BRIDGE</text>
    <text x="92" y="119" class="title">Common radius: coordinates, overlaps, and cancellation</text>
    <text x="92" y="153" class="subtitle">Use the full hypotheses and density expansions in the adjacent text.</text>

    <!-- The cards are coordinate copies, not disjoint events in one sample space. -->
    <g id="source-coordinates" transform="translate(54 190)">
      <rect width="520" height="742" rx="20" fill="#F7F3E9" stroke="#1F6968" stroke-width="2.5"/>
      <text x="28" y="43" class="step">STEP 1 · COORDINATES</text>
      <text x="28" y="89" class="panel-title">Keep the sources distinct</text>
      <text x="28" y="136" class="body">Separate source coordinates</text>
      <text x="28" y="178" class="body">in the same measured space M.</text>

      <g id="source-one-coordinate" transform="translate(26 205)">
        <rect width="468" height="148" rx="14" fill="#F7F3E9" stroke="#D2E0E2" stroke-width="3"/>
        <text x="22" y="42" class="label">Source 1 coordinate</text>
        <circle cx="73" cy="98" r="34" fill="#D2E0E2" fill-opacity="0.40" stroke="#1F6968" stroke-width="3"/>
        <line x1="73" y1="98" x2="102" y2="98" stroke="#2C3E50" stroke-width="2.5" marker-end="url(#radius-arrow)"/>
        <text x="132" y="88" class="body">radius r</text>
        <text x="132" y="129" class="formula">ball volume v<tspan class="sub">r</tspan></text>
      </g>
      <g id="source-two-coordinate" transform="translate(26 373)">
        <rect width="468" height="148" rx="14" fill="#F7F3E9" stroke="#D2E0E2" stroke-width="3"/>
        <text x="22" y="42" class="label">Source 2 coordinate</text>
        <circle cx="73" cy="98" r="34" fill="#D2E0E2" fill-opacity="0.40" stroke="#1F6968" stroke-width="3"/>
        <line x1="73" y1="98" x2="102" y2="98" stroke="#2C3E50" stroke-width="2.5" marker-end="url(#radius-arrow)"/>
        <text x="132" y="88" class="body">radius r</text>
        <text x="132" y="129" class="formula">ball volume v<tspan class="sub">r</tspan></text>
      </g>
      <g id="target-coordinate" transform="translate(26 547)">
        <rect width="468" height="163" rx="14" fill="#F7F3E9" stroke="#916400" stroke-width="2.5"/>
        <text x="22" y="43" class="label">Target coordinate in N</text>
        <text x="22" y="86" class="body">Same radius r.</text>
        <text x="22" y="131" class="formula">Ball volume w<tspan class="sub">r</tspan>.</text>
      </g>
    </g>

    <g id="overlap-orders" transform="translate(600 190)">
      <rect width="570" height="742" rx="20" fill="#F7F3E9" stroke="#916400" stroke-width="2.5"/>
      <text x="28" y="43" class="step">STEP 2 · OVERLAPS</text>
      <text x="28" y="89" class="panel-title">Control both event overlaps</text>
      <g id="source-overlap" transform="translate(26 133)">
        <rect width="518" height="191" rx="14" fill="#F7F3E9" stroke="#D2E0E2" stroke-width="3"/>
        <text x="23" y="46" class="label">Source overlap</text>
        <text x="23" y="103" class="formula">Pr(E<tspan class="sub">1,r</tspan> ∩ E<tspan class="sub">2,r</tspan>)</text>
        <text x="23" y="160" class="formula">= o(v<tspan class="sub">r</tspan>)</text>
      </g>
      <g id="target-source-overlap" transform="translate(26 348)">
        <rect width="518" height="215" rx="14" fill="#F7F3E9" stroke="#D2E0E2" stroke-width="3"/>
        <text x="23" y="46" class="label">Target-source triple overlap</text>
        <text x="23" y="112" class="formula">Pr(C<tspan class="sub">r</tspan> ∩ E<tspan class="sub">1,r</tspan> ∩ E<tspan class="sub">2,r</tspan>)</text>
        <text x="23" y="178" class="formula">= o(w<tspan class="sub">r</tspan>v<tspan class="sub">r</tspan>)</text>
      </g>
      <text x="28" y="626" class="body">Local essential bounds</text>
      <text x="28" y="670" class="body">are sufficient conditions.</text>
      <text x="28" y="714" class="body">They are not necessary.</text>
    </g>

    <g id="cancellation" transform="translate(1196 190)">
      <rect width="550" height="742" rx="20" fill="#F7F3E9" stroke="#1F3F60" stroke-width="2.5"/>
      <text x="28" y="43" class="step">STEP 3 · CANCELLATION</text>
      <text x="28" y="89" class="panel-title">Cancel the common factor</text>
      <rect x="26" y="133" width="498" height="162" rx="14" fill="#D2E0E2" fill-opacity="0.30" stroke="#D2E0E2" stroke-width="2.5"/>
      <text x="275" y="186" class="label" text-anchor="middle">Common volume factor</text>
      <text x="275" y="263" class="factor" text-anchor="middle">w<tspan class="sub">r</tspan>v<tspan class="sub">r</tspan></text>
      <text x="28" y="359" class="body">Use inclusion-exclusion.</text>
      <text x="28" y="405" class="body">Numerator and denominator</text>
      <text x="28" y="450" class="formula">share the factor w<tspan class="sub">r</tspan>v<tspan class="sub">r</tspan>.</text>
      <text x="28" y="522" class="body">Cancel it in the ratio.</text>
      <text x="28" y="568" class="body">Then take the natural log.</text>
      <text x="28" y="650" class="body">Positive limiting density</text>
      <text x="28" y="695" class="body">sums are required.</text>
    </g>

    <!-- A plain text field, with ornament confined to a narrow labelled rail. -->
    <g id="failure-boundary" transform="translate(54 958)">
      <rect width="1692" height="204" rx="16" fill="#F7F3E9" stroke="#743E37" stroke-width="2.5"/>
      <rect width="12" height="204" rx="6" fill="#743E37"/>
      <text x="38" y="43" class="step" style="fill:#743E37">FIRST-ORDER OVERLAP · FAILURE BOUNDARY</text>
      <text x="38" y="88" class="formula">If Pr(E<tspan class="sub">1,r</tspan> ∩ E<tspan class="sub">2,r</tspan>) = κ v<tspan class="sub">r</tspan> + o(v<tspan class="sub">r</tspan>), with κ &gt; 0, the union denominator changes.</text>
      <text x="38" y="133" class="body">The stated density ratio then need not follow. The full hypotheses and proof are in the text.</text>
      <text x="38" y="180" class="boundary">Conditional population lemma; no kNN or finite-sample guarantee.</text>
    </g>
  </g>
</svg>
