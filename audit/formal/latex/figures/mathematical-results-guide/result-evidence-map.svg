<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xml:lang="en" width="180mm" height="106mm" viewBox="0 0 1800 1060" role="img" aria-labelledby="result-evidence-title result-evidence-desc">
  <title id="result-evidence-title">Evidence and publication status map for nine pid-rs result families</title>
  <desc id="result-evidence-desc">Two columns contain nine result cards. Every card separately states analytic, formal, bounded-executable, and report or integration evidence. Evidence in one category does not automatically transfer to another.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#1F6968" stroke-width="1.2" opacity=".09"/></pattern>
    <pattern id="analytic" width="15" height="15" patternUnits="userSpaceOnUse"><path d="M0 4H15M0 11H15" stroke="#916400" stroke-width="2" opacity=".34"/></pattern>
    <pattern id="formal" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(36)"><path d="M0 0V14" stroke="#2C3E50" stroke-width="3" opacity=".23"/></pattern>
    <pattern id="bounded" width="15" height="15" patternUnits="userSpaceOnUse"><circle cx="4" cy="4" r="2.2" fill="#916400" opacity=".4"/></pattern>
    <pattern id="report" width="18" height="18" patternUnits="userSpaceOnUse"><path d="M0 18L18 0" stroke="#DCA520" stroke-width="2" opacity=".2"/></pattern>
    <pattern id="open" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M-5 5L5-5M0 20L20 0M15 25L25 15" stroke="#916400" stroke-width="2" opacity=".2"/></pattern>
    <style>
      .sans { font-family: "Source Sans Pro"; }
      .title { font-size: 49px; font-weight: 700; fill: #2C3E50; }
      .kicker { font-size: 24px; font-weight: 700; fill: #916400; letter-spacing: 3px; }
      .subtitle { font-size: 27px; font-weight: 600; fill: #1F6968; }
      .legend { font-size: 24px; font-weight: 600; fill: #2C3E50; }
      .column { font-size: 26px; font-weight: 700; fill: #1F6968; letter-spacing: 1.2px; }
      .number { font-size: 28px; font-weight: 700; fill: #2C3E50; text-anchor: middle; }
      .family { font-size: 31px; font-weight: 700; fill: #2C3E50; }
      .tag { font-size: 22px; font-weight: 700; fill: #916400; letter-spacing: .8px; }
      .evidence { font-size: 23px; font-weight: 600; fill: #2C3E50; }
      .status { font-size: 23px; font-weight: 700; fill: #1F6968; }
      .boundary-title { font-size: 24px; font-weight: 700; fill: #916400; letter-spacing: 1.4px; }
      .boundary { font-size: 25px; font-weight: 600; fill: #2C3E50; }
    </style>
  </defs>
  <rect width="1800" height="1060" fill="#F7F3E9"/>
  <g class="sans">
    <rect x="50" y="38" width="1700" height="112" rx="18" fill="url(#grid)" stroke="#2C3E50" stroke-width="2" stroke-opacity=".22"/>
    <rect x="50" y="38" width="14" height="112" rx="7" fill="#DCA520"/>
    <text x="88" y="73" class="kicker">MATHEMATICAL RESULT LEDGER</text>
    <text x="88" y="123" class="title">Nine result families</text>
    <text x="650" y="120" class="subtitle">Four evidence questions · read every card literally.</text>
    <g transform="translate(58 172)">
      <circle cx="18" cy="18" r="16" fill="url(#analytic)" stroke="#916400" stroke-width="2"/><text x="45" y="26" class="legend">A · analytic</text>
      <rect x="258" y="2" width="32" height="32" rx="3" fill="url(#formal)" stroke="#2C3E50" stroke-width="2"/><text x="305" y="26" class="legend">F · formal subclaim</text>
      <path d="M670 2H700L716 18L700 34H670L654 18Z" fill="url(#bounded)" stroke="#916400" stroke-width="2"/><text x="730" y="26" class="legend">B · bounded executable</text>
      <rect x="1167" y="2" width="36" height="32" rx="4" fill="url(#report)" stroke="#916400" stroke-width="2"/><text x="1218" y="26" class="legend">S · report / integration state</text>
    </g>
    <text x="54" y="248" class="column">FOUNDATIONAL AND FINITE-LAW RESULTS</text>
    <text x="925" y="248" class="column">HIGHER-SOURCE, NUMERICAL, AND CONTINUOUS RESULTS</text>

    <g transform="translate(50 270)"><rect width="825" height="130" rx="18" fill="#F7F3E9" stroke="#2C3E50" stroke-width="2" stroke-opacity=".35"/><circle cx="43" cy="39" r="26" fill="url(#analytic)" stroke="#916400" stroke-width="2.5"/><text x="43" y="48" class="number">1</text><text x="84" y="43" class="family">Foundational categorical Sx audit</text><text x="84" y="82" class="tag">A</text><text x="112" y="82" class="evidence">exact semantics + counterexamples</text><text x="530" y="82" class="tag">F</text><text x="558" y="82" class="evidence">Lean factorization slice</text><rect y="101" width="825" height="29" fill="url(#report)"/><text x="20" y="123" class="status">B · witnesses + bounded checks</text><text x="805" y="123" class="status" text-anchor="end">S · SCOPED REPORT</text></g>
    <g transform="translate(50 410)"><rect width="825" height="130" rx="18" fill="#DCA520" fill-opacity=".035" stroke="#2C3E50" stroke-width="2" stroke-opacity=".35"/><circle cx="43" cy="39" r="26" fill="url(#analytic)" stroke="#916400" stroke-width="2.5"/><text x="43" y="48" class="number">2</text><text x="84" y="43" class="family">Finite-alphabet plug-in convergence</text><text x="84" y="82" class="tag">A</text><text x="112" y="82" class="evidence">exact-real convergence</text><text x="530" y="82" class="tag">F</text><text x="558" y="82" class="evidence">Lean continuity core</text><rect y="101" width="825" height="29" fill="url(#report)"/><text x="20" y="123" class="status">B · fixtures + Rust comparison</text><text x="805" y="123" class="status" text-anchor="end">S · SCOPED REPORT</text></g>
    <g transform="translate(50 550)"><rect width="825" height="130" rx="18" fill="#F7F3E9" stroke="#2C3E50" stroke-width="2" stroke-opacity=".35"/><circle cx="43" cy="39" r="26" fill="url(#analytic)" stroke="#916400" stroke-width="2.5"/><text x="43" y="48" class="number">3</text><text x="84" y="37" class="family">Support-change-tolerant averaged</text><text x="84" y="65" class="family">Sx continuity</text><text x="84" y="91" class="tag">A</text><text x="112" y="91" class="evidence">exact continuity moduli</text><text x="530" y="91" class="tag">F</text><text x="558" y="91" class="evidence">Lean algebraic subclaims</text><rect y="101" width="825" height="29" fill="url(#report)"/><text x="20" y="123" class="status">B · 18 law pairs + replay</text><text x="805" y="123" class="status" text-anchor="end">S · SCOPED REPORT</text></g>
    <g transform="translate(50 690)"><rect width="825" height="130" rx="18" fill="#DCA520" fill-opacity=".035" stroke="#2C3E50" stroke-width="2" stroke-opacity=".35"/><circle cx="43" cy="39" r="26" fill="url(#analytic)" stroke="#916400" stroke-width="2.5"/><text x="43" y="48" class="number">4</text><text x="84" y="37" class="family">Dependency-color concentration</text><text x="84" y="65" class="family">and local bounds</text><text x="84" y="91" class="tag">A</text><text x="112" y="91" class="evidence">probability theorem</text><text x="530" y="91" class="tag">F</text><text x="558" y="91" class="evidence">deterministic subclaims</text><rect y="101" width="825" height="29" fill="url(#report)"/><text x="20" y="123" class="status">B · oracle + Rust checks</text><text x="805" y="123" class="status" text-anchor="end">S · SCOPED REPORT</text></g>
    <g transform="translate(50 830)"><rect width="825" height="130" rx="18" fill="#F7F3E9" stroke="#2C3E50" stroke-width="2" stroke-opacity=".35"/><circle cx="43" cy="39" r="26" fill="url(#analytic)" stroke="#916400" stroke-width="2.5"/><text x="43" y="48" class="number">5</text><text x="84" y="43" class="family">Exact two-source Sx assurance</text><text x="84" y="82" class="tag">A</text><text x="112" y="82" class="evidence">count-to-atom + product theorem</text><text x="530" y="82" class="tag">F</text><text x="558" y="82" class="evidence">Lean bridge + algebra</text><rect y="101" width="825" height="29" fill="url(#open)"/><text x="20" y="123" class="status">B · certifier + bounded routes</text><text x="805" y="123" class="status" text-anchor="end">S · INTEGRATION OPEN</text></g>

    <g transform="translate(925 270)"><rect width="825" height="130" rx="18" fill="#DCA520" fill-opacity=".035" stroke="#2C3E50" stroke-width="2" stroke-opacity=".35"/><circle cx="43" cy="39" r="26" fill="url(#analytic)" stroke="#916400" stroke-width="2.5"/><text x="43" y="48" class="number">6</text><text x="84" y="37" class="family">SxPID3 source-marginal factorization</text><text x="84" y="65" class="family">and bounded exact audit</text><text x="84" y="91" class="tag">A</text><text x="112" y="91" class="evidence">source-only factor</text><text x="500" y="91" class="tag">F</text><text x="528" y="91" class="evidence">Lean generic theorem</text><rect y="101" width="825" height="29" fill="url(#report)"/><text x="20" y="123" class="status">B · 20,348 tables · two routes</text><text x="805" y="123" class="status" text-anchor="end">S · INTEGRATED / SCOPED</text></g>
    <g transform="translate(925 410)"><rect width="825" height="130" rx="18" fill="#F7F3E9" stroke="#2C3E50" stroke-width="2" stroke-opacity=".35"/><circle cx="43" cy="39" r="26" fill="url(#analytic)" stroke="#916400" stroke-width="2.5"/><text x="43" y="48" class="number">7</text><text x="84" y="37" class="family">Represented-binary64 and</text><text x="84" y="65" class="family">quantizer assurance</text><text x="84" y="91" class="tag">A</text><text x="112" y="91" class="evidence">exact represented sum</text><text x="500" y="91" class="tag">F</text><text x="528" y="91" class="evidence">no end-to-end proof</text><rect y="101" width="825" height="29" fill="url(#report)"/><text x="20" y="123" class="status">B · oracles + bounded tests</text><text x="805" y="123" class="status" text-anchor="end">S · ASSURANCE REPORT</text></g>
    <g transform="translate(925 550)"><rect width="825" height="130" rx="18" fill="#DCA520" fill-opacity=".035" stroke="#2C3E50" stroke-width="2" stroke-opacity=".35"/><circle cx="43" cy="39" r="26" fill="url(#analytic)" stroke="#916400" stroke-width="2.5"/><text x="43" y="48" class="number">8</text><text x="84" y="37" class="family">KSG integer-harmonic</text><text x="84" y="65" class="family">local arithmetic</text><text x="84" y="91" class="tag">A</text><text x="112" y="91" class="evidence">harmonic identity + sharp bound</text><text x="500" y="91" class="tag">F</text><text x="528" y="91" class="evidence">Lean + Z3 subclaims</text><rect y="101" width="825" height="29" fill="url(#open)"/><text x="20" y="123" class="status">B · 8,198-row corpus</text><text x="805" y="123" class="status" text-anchor="end">S · CORE GO / INTEGRATION NO-GO</text></g>
    <g transform="translate(925 690)"><rect width="825" height="130" rx="18" fill="#F7F3E9" stroke="#2C3E50" stroke-width="2" stroke-opacity=".35"/><circle cx="43" cy="39" r="26" fill="url(#analytic)" stroke="#916400" stroke-width="2.5"/><text x="43" y="48" class="number">9</text><text x="84" y="37" class="family">Common-radius manifold</text><text x="84" y="65" class="family">small-ball bridge</text><text x="84" y="91" class="tag">A</text><text x="112" y="91" class="evidence">conditional limit + boundary test</text><text x="500" y="91" class="tag">F</text><text x="528" y="91" class="evidence">no machine proof</text><rect y="101" width="825" height="29" fill="url(#open)"/><text x="20" y="123" class="status">B · no finite-sample evidence</text><text x="805" y="123" class="status" text-anchor="end">S · ESTIMATOR OPEN</text></g>
    <g transform="translate(925 840)"><rect width="825" height="120" rx="18" fill="url(#grid)" stroke="#916400" stroke-width="2.5"/><rect width="14" height="120" rx="7" fill="#DCA520"/><text x="38" y="40" class="boundary-title">NO PROOF TRANSFER BY PROXIMITY</text><text x="38" y="76" class="boundary">A theorem, formal subclaim, bounded corpus,</text><text x="38" y="107" class="boundary">and publication state answer different questions.</text></g>
    <path d="M50 997H1750" stroke="#2C3E50" stroke-width="2" opacity=".22"/><path d="M50 997H430" stroke="#916400" stroke-width="5"/>
    <text x="50" y="1033" class="boundary">Completion is per card. Follow the linked report for assumptions, costs, counterexamples, and strongest nonclaim.</text>
  </g>
</svg>
