<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1270" viewBox="0 0 1200 1270" role="img" aria-labelledby="title desc">
  <title id="title">Current Galadriel PID use and proposed sensor-placement research</title>
  <desc id="desc">A two-lane diagram. The upper teal lane contains four ordered stages that summarize three implemented offline synthetic PID studies across two binaries: the frozen categorical CREBAIN law and generated categorical XOR law use Makkeh-Gutknecht-Wibral PID, while a generated continuous sign-parity law uses the distinct Ehrlich PID2 estimator. Galadriel validates declared contracts and emits record-only evidence; there is no edge to fusion, alerts, authorization, or commands. The lower bronze lane is a separate proposed research program. Candidate map locations, devices, and scenarios enter a mission-objective placement baseline. Low-arity categorical PID audits only shortlisted portfolios whose devices are grouped into two to four declared PID sources. Held-out evidence decides whether to adopt, retain only as an audit, or omit PID. Target custody is source-disjoint by procedure, not statistically independent. No current Galadriel placement implementation or theorem is claimed.</desc>
  <defs>
    <pattern id="girih" width="92" height="92" patternUnits="userSpaceOnUse">
      <path d="M46 2 68 24 90 46 68 68 46 90 24 68 2 46 24 24Z" fill="none" stroke="#D2E0E2" stroke-width="1.3" opacity=".20"/>
      <path d="M46 2V90M2 46H90M24 24 68 68M68 24 24 68" fill="none" stroke="#D2E0E2" stroke-width=".8" opacity=".14"/>
    </pattern>
    <pattern id="crosshatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M0 0V18" stroke="#916400" stroke-width="2" opacity=".12"/>
    </pattern>
    <filter id="shadow" x="-5%" y="-12%" width="110%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#2C3E50" flood-opacity=".13"/>
    </filter>
    <marker id="arrowTeal" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto">
      <path d="M0 0 5 2.5 0 5Z" fill="#1F6968"/>
    </marker>
    <marker id="arrowBronze" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto">
      <path d="M0 0 5 2.5 0 5Z" fill="#916400"/>
    </marker>
    <style>
      .title{font:700 34px 'Avenir Next',Avenir,Arial,sans-serif;fill:#F7F3E9;letter-spacing:.3px}
      .subtitle{font:500 19px 'Avenir Next',Avenir,Arial,sans-serif;fill:#D2E0E2}
      .lane{font:700 18px 'Avenir Next',Avenir,Arial,sans-serif;letter-spacing:2px}
      .step{font:700 19px 'Avenir Next',Avenir,Arial,sans-serif;fill:#F7F3E9}
      .nodeTitle{font:700 22px 'Avenir Next',Avenir,Arial,sans-serif;fill:#2C3E50}
      .body{font:500 18px 'Avenir Next',Avenir,Arial,sans-serif;fill:#2C3E50}
      .small{font:500 16px 'Avenir Next',Avenir,Arial,sans-serif;fill:#455A64}
      .fire{font:700 18px 'Avenir Next',Avenir,Arial,sans-serif;fill:#F7F3E9;letter-spacing:.3px}
    </style>
  </defs>

  <rect width="1200" height="1270" fill="#F7F3E9"/>
  <rect width="1200" height="148" fill="#1F3F60"/>
  <rect width="1200" height="148" fill="url(#girih)"/>
  <rect y="132" width="1200" height="16" fill="#1F6968"/>
  <text x="60" y="61" class="title">PID IN GALADRIEL: CURRENT AND PROPOSED LANES</text>
  <text x="60" y="103" class="subtitle">Shared vocabulary does not create a shared method, estimand, or implementation.</text>

  <text x="60" y="191" class="lane" fill="#1F6968">CURRENT · IMPLEMENTED OFFLINE SYNTHETIC STUDIES</text>
  <rect x="45" y="211" width="1110" height="468" rx="23" fill="#EDF5F3" stroke="#1F6968" stroke-width="2"/>

  <g filter="url(#shadow)">
    <rect x="84" y="244" width="1032" height="82" rx="16" fill="#FFFFFF" stroke="#1F6968" stroke-width="2"/>
    <circle cx="124" cy="285" r="25" fill="#1F6968"/>
    <text x="124" y="292" class="step" text-anchor="middle">1</text>
    <text x="169" y="278" class="nodeTitle">Three synthetic studies</text>
    <text x="169" y="305" class="small">Frozen CREBAIN categorical · generated categorical XOR · generated continuous sign parity</text>

    <rect x="84" y="346" width="1032" height="82" rx="16" fill="#FFFFFF" stroke="#1F6968" stroke-width="2"/>
    <circle cx="124" cy="387" r="25" fill="#1F6968"/>
    <text x="124" y="394" class="step" text-anchor="middle">2</text>
    <text x="169" y="380" class="nodeTitle">Two offline binaries</text>
    <text x="169" y="407" class="small">CREBAIN fixture binary · default justification binary · schema validation and call preflight</text>

    <rect x="84" y="448" width="1032" height="82" rx="16" fill="#FFFFFF" stroke="#1F6968" stroke-width="2"/>
    <circle cx="124" cy="489" r="25" fill="#1F6968"/>
    <text x="124" y="496" class="step" text-anchor="middle">3</text>
    <text x="169" y="482" class="nodeTitle">Two distinct PID families</text>
    <text x="169" y="509" class="small">Categorical MGW PID2/PID3 · continuous Ehrlich PID2 · atoms are never pooled or transferred</text>

    <rect x="84" y="550" width="1032" height="82" rx="16" fill="#FFFFFF" stroke="#1F6968" stroke-width="2"/>
    <circle cx="124" cy="591" r="25" fill="#1F6968"/>
    <text x="124" y="598" class="step" text-anchor="middle">4</text>
    <text x="169" y="584" class="nodeTitle">Record-only evidence</text>
    <text x="169" y="611" class="small">JSON · Markdown · plain text · algebra and hostile controls · no operational authority edge</text>
  </g>

  <path d="M124 326V341" stroke="#1F6968" stroke-width="3" marker-end="url(#arrowTeal)"/>
  <path d="M124 428V443" stroke="#1F6968" stroke-width="3" marker-end="url(#arrowTeal)"/>
  <path d="M124 530V545" stroke="#1F6968" stroke-width="3" marker-end="url(#arrowTeal)"/>
  <rect x="224" y="646" width="752" height="38" rx="19" fill="#743E37"/>
  <text x="600" y="671" class="fire" text-anchor="middle">NO EDGE TO FUSION · ALERTS · AUTHORIZATION · COMMANDS</text>

  <text x="60" y="735" class="lane" fill="#916400">PROPOSED · MAP-BASED SENSOR-PORTFOLIO RESEARCH</text>
  <rect x="45" y="755" width="1110" height="454" rx="23" fill="#FBF5E8" stroke="#916400" stroke-width="2"/>
  <rect x="45" y="755" width="1110" height="454" rx="23" fill="url(#crosshatch)"/>

  <g filter="url(#shadow)">
    <rect x="84" y="786" width="1032" height="82" rx="16" fill="#FFFFFF" stroke="#916400" stroke-width="2"/>
    <circle cx="124" cy="827" r="25" fill="#916400"/>
    <text x="124" y="834" class="step" text-anchor="middle">1</text>
    <text x="169" y="820" class="nodeTitle">Candidates and scenarios</text>
    <text x="169" y="847" class="small">Map sites · devices · costs · source-disjoint target custody, with no independence claim</text>

    <rect x="84" y="888" width="1032" height="82" rx="16" fill="#FFFFFF" stroke="#916400" stroke-width="2"/>
    <circle cx="124" cy="929" r="25" fill="#916400"/>
    <text x="124" y="936" class="step" text-anchor="middle">2</text>
    <text x="169" y="922" class="nodeTitle">Primary optimizer</text>
    <text x="169" y="949" class="small">Task loss · coverage · joint MI · robust utility · Fisher information · Bayesian design</text>

    <rect x="84" y="990" width="1032" height="82" rx="16" fill="#FFFFFF" stroke="#916400" stroke-width="2"/>
    <circle cx="124" cy="1031" r="25" fill="#916400"/>
    <text x="124" y="1038" class="step" text-anchor="middle">3</text>
    <text x="169" y="1024" class="nodeTitle">Low-arity PID audit</text>
    <text x="169" y="1051" class="small">Two to four declared PID sources · full named atom vector · PID arity is not device count</text>

    <rect x="84" y="1092" width="1032" height="82" rx="16" fill="#FFFFFF" stroke="#916400" stroke-width="2"/>
    <circle cx="124" cy="1133" r="25" fill="#916400"/>
    <text x="124" y="1140" class="step" text-anchor="middle">4</text>
    <text x="169" y="1126" class="nodeTitle">Outer evidence gate</text>
    <text x="169" y="1153" class="small">Held-out sites and missions · baselines · dropout · latency · adopt, audit only, or omit PID</text>
  </g>

  <path d="M124 868V883" stroke="#916400" stroke-width="3" marker-end="url(#arrowBronze)"/>
  <path d="M124 970V985" stroke="#916400" stroke-width="3" marker-end="url(#arrowBronze)"/>
  <path d="M124 1072V1087" stroke="#916400" stroke-width="3" marker-end="url(#arrowBronze)"/>
  <text x="600" y="1242" class="small" text-anchor="middle">No current Galadriel ground set, placement objective, search algorithm, or placement theorem exists.</text>
</svg>
