<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Durable promotion state machine for PID research</title>
  <desc id="desc">Seven connected stages move research from discovery through freeze, classification, preservation, integration, verification, and retirement. Separate mainline and archive-only branches show that durable recovery and project acceptance are different axes, while stop conditions explain why cleanup comes last.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f1e6"/>
      <stop offset="1" stop-color="#e6f0ef"/>
    </linearGradient>
    <linearGradient id="nodeA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#124c64"/>
      <stop offset="1" stop-color="#0a3448"/>
    </linearGradient>
    <linearGradient id="nodeB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#277053"/>
      <stop offset="1" stop-color="#174836"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#16313a" flood-opacity=".20"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 L12 6 L0 12 Z" fill="#2f6677"/>
    </marker>
    <style>
      .sans { font-family: "Latin Modern Sans", sans-serif; }
      .title { font-size: 42px; font-weight: 780; fill: #12313f; }
      .subtitle { font-size: 20px; fill: #45616d; }
      .step { font-size: 22px; font-weight: 780; fill: #fff; }
      .stepNum { font-size: 15px; font-weight: 800; fill: #072a38; }
      .body { font-size: 16px; fill: #173743; }
      .small { font-size: 14px; fill: #49636d; }
      .nodeHint { font-size: 14px; font-weight: 620; fill: #d9edf5; }
      .nodeHintGreen { font-size: 14px; font-weight: 620; fill: #dff5e9; }
      .nodeHintRed { font-size: 14px; font-weight: 620; fill: #ffe6e2; }
      .ladderTitle { font-size: 19px; font-weight: 790; fill: #183d4b; }
      .ladder { font-size: 15px; font-weight: 670; fill: #173743; }
      .stop { font-size: 16px; font-weight: 740; fill: #7c2428; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <path d="M0 725 C300 640 520 860 830 745 C1120 638 1360 720 1600 655 V900 H0 Z" fill="#d8e8e4" opacity=".72"/>
  <g class="sans">
    <text x="70" y="78" class="title">Durable promotion: cleanup is the final proof obligation</text>
    <text x="70" y="116" class="subtitle">Every byte needs a disposition; every required unique payload needs a durable successor and tested recovery route.</text>

    <path d="M176 300 H1390" stroke="#2f6677" stroke-width="6" marker-end="url(#arrow)"/>

    <g filter="url(#shadow)">
      <circle cx="175" cy="300" r="82" fill="url(#nodeA)"/>
      <circle cx="383" cy="300" r="82" fill="url(#nodeA)"/>
      <circle cx="591" cy="300" r="82" fill="url(#nodeA)"/>
      <circle cx="799" cy="300" r="82" fill="url(#nodeB)"/>
      <circle cx="1007" cy="300" r="82" fill="url(#nodeB)"/>
      <circle cx="1215" cy="300" r="82" fill="url(#nodeB)"/>
      <circle cx="1423" cy="300" r="82" fill="#723238"/>
    </g>

    <g>
      <circle cx="175" cy="254" r="16" fill="#9ed9ef"/><text x="175" y="260" text-anchor="middle" class="stepNum">1</text>
      <circle cx="383" cy="254" r="16" fill="#9ed9ef"/><text x="383" y="260" text-anchor="middle" class="stepNum">2</text>
      <circle cx="591" cy="254" r="16" fill="#9ed9ef"/><text x="591" y="260" text-anchor="middle" class="stepNum">3</text>
      <circle cx="799" cy="254" r="16" fill="#9de2bd"/><text x="799" y="260" text-anchor="middle" class="stepNum">4</text>
      <circle cx="1007" cy="254" r="16" fill="#9de2bd"/><text x="1007" y="260" text-anchor="middle" class="stepNum">5</text>
      <circle cx="1215" cy="254" r="16" fill="#9de2bd"/><text x="1215" y="260" text-anchor="middle" class="stepNum">6</text>
      <circle cx="1423" cy="254" r="16" fill="#ffc0b8"/><text x="1423" y="260" text-anchor="middle" class="stepNum">7</text>
    </g>

    <text x="175" y="308" text-anchor="middle" class="step">Discover</text>
    <text x="383" y="308" text-anchor="middle" class="step">Freeze</text>
    <text x="591" y="308" text-anchor="middle" class="step">Classify</text>
    <text x="799" y="308" text-anchor="middle" class="step">Preserve</text>
    <text x="1007" y="308" text-anchor="middle" class="step">Integrate</text>
    <text x="1215" y="308" text-anchor="middle" class="step">Verify</text>
    <text x="1423" y="308" text-anchor="middle" class="step">Retire</text>

    <text x="175" y="340" text-anchor="middle" class="nodeHint">search · failures</text>
    <text x="383" y="340" text-anchor="middle" class="nodeHint">stop writers</text>
    <text x="591" y="340" text-anchor="middle" class="nodeHint">meaning · risk</text>
    <text x="799" y="340" text-anchor="middle" class="nodeHintGreen">off-host copy</text>
    <text x="1007" y="340" text-anchor="middle" class="nodeHintGreen">explicit paths</text>
    <text x="1215" y="340" text-anchor="middle" class="nodeHintGreen">main · gates</text>
    <text x="1423" y="340" text-anchor="middle" class="nodeHintRed">only after proof</text>

    <g filter="url(#shadow)">
      <rect x="70" y="442" width="935" height="328" rx="26" fill="#ffffff" stroke="#9ab6bf" stroke-width="2"/>
      <rect x="1040" y="442" width="490" height="328" rx="26" fill="#fff9f5" stroke="#d7a7a3" stroke-width="2"/>
    </g>

    <text x="105" y="487" class="ladderTitle">Storage ladder — availability &#x2260; acceptance</text>

    <g>
      <rect x="105" y="525" width="115" height="54" rx="12" fill="#e9eff1"/><text x="162" y="557" text-anchor="middle" class="ladder">Scratch</text>
      <path d="M220 552 H247" stroke="#7895a0" stroke-width="3" marker-end="url(#arrow)"/>
      <rect x="250" y="525" width="125" height="54" rx="12" fill="#dce9ec"/><text x="312" y="548" text-anchor="middle" class="ladder"><tspan x="312">Dirty</tspan><tspan x="312" dy="18">worktree</tspan></text>
      <path d="M375 552 H402" stroke="#7895a0" stroke-width="3" marker-end="url(#arrow)"/>
      <rect x="405" y="525" width="115" height="54" rx="12" fill="#cee3e5"/><text x="462" y="557" text-anchor="middle" class="ladder">Local ref</text>

      <path d="M520 542 C540 542 540 505 562 505" fill="none" stroke="#7895a0" stroke-width="3" marker-end="url(#arrow)"/>
      <rect x="565" y="478" width="145" height="54" rx="12" fill="#bdddd8"/><text x="637" y="501" text-anchor="middle" class="ladder"><tspan x="637">Remote side</tspan><tspan x="637" dy="18">or archive ref</tspan></text>
      <path d="M710 505 H742" stroke="#7895a0" stroke-width="3" marker-end="url(#arrow)"/>
      <rect x="745" y="478" width="205" height="54" rx="12" fill="#d6e6df"/><text x="847" y="501" text-anchor="middle" class="ladder"><tspan x="847">Restricted / scholarly</tspan><tspan x="847" dy="18">archive-only outcome</tspan></text>

      <path d="M520 562 C540 562 540 599 562 599" fill="none" stroke="#7895a0" stroke-width="3" marker-end="url(#arrow)"/>
      <rect x="565" y="572" width="145" height="54" rx="12" fill="#abd6c5"/><text x="637" y="604" text-anchor="middle" class="ladder">Remote main</text>
      <path d="M710 599 H742" stroke="#7895a0" stroke-width="3" marker-end="url(#arrow)"/>
      <rect x="745" y="572" width="205" height="54" rx="12" fill="#97cdb4"/><text x="847" y="595" text-anchor="middle" class="ladder"><tspan x="847">Accepted release</tspan><tspan x="847" dy="18">then external archive</tspan></text>
    </g>

    <rect x="105" y="654" width="865" height="90" rx="18" fill="#eaf6f0" stroke="#7bb493"/>
    <text x="135" y="687" class="body">
      <tspan x="135" dy="0">Archive-only preserves rejected, restricted, or non-mainline material without calling it accepted.</tspan>
      <tspan x="135" dy="25">CI artifacts expire; hashes bind bytes but do not make them available, true, or authentic.</tspan>
      <tspan x="135" dy="25">Unsigned Git commits and no agent attribution remain repository policy.</tspan>
    </text>

    <text x="1075" y="487" class="ladderTitle">Retirement gate — every row must be true</text>
    <g class="body">
      <text x="1080" y="525"><tspan fill="#8e3438">●</tspan><tspan dx="10">No active process owns the lane</tspan></text>
      <text x="1080" y="562"><tspan fill="#8e3438">●</tspan><tspan dx="10">All dirty / ignored bytes classified</tspan></text>
      <text x="1080" y="599"><tspan fill="#8e3438">●</tspan><tspan dx="10">Unique science has a durable successor</tspan></text>
      <text x="1080" y="636"><tspan fill="#8e3438">●</tspan><tspan dx="10">Mainline: remote head + gates exact</tspan></text>
      <text x="1080" y="673"><tspan fill="#8e3438">●</tspan><tspan dx="10">Archive-only: locator + recovery exact</tspan></text>
      <text x="1080" y="710"><tspan fill="#8e3438">●</tspan><tspan dx="10">Post-removal inventory passes</tspan></text>
    </g>
    <text x="1285" y="746" text-anchor="middle" class="stop">NO RESET · NO FORCE · NO GC BEFORE THIS GATE</text>

    <text x="70" y="842" class="body">Any dirty worktree with unclassified unique bytes is a protected source, never a cleanup target.</text>
    <text x="70" y="873" class="small">Per-path manifests and hashes belong in JSON/TSV; this figure is the reusable human process.</text>
  </g>
</svg>
