<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760" role="img" aria-labelledby="title desc">
  <title id="title">Durable promotion: seven ordered stages and a post-removal completion check</title>
  <desc id="desc">Seven numbered nodes direct work from discovery to freeze, classification, preservation, integration, verification, and bounded removal. Retirement becomes complete only after a post-removal inventory and successor-retrieval check pass.</desc>
  <defs>
    <pattern id="grain" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M2 5H8M12 14H18M5 18H9" stroke="#D2E0E2" stroke-width="1" opacity=".62"/></pattern>
    <pattern id="archive" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><path d="M0 0V16" stroke="#1F6968" stroke-width="3" opacity=".17"/></pattern>
    <pattern id="retire" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="4" cy="4" r="1.7" fill="#743E37" opacity=".18"/></pattern>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5L0 11Z" fill="#1F6968"/></marker>
    <style>
      .sans { font-family: SourceSansPro, sans-serif; }
      .title { font-size: 34px; font-weight: 750; fill: #1F3F60; }
      .subtitle { font-size: 18px; fill: #1F6968; }
      .kicker { font-size: 17px; font-weight: 780; letter-spacing: 2px; fill: #1F6968; }
      .step { font-size: 21px; font-weight: 780; fill: #F7F3E9; }
      .number { font-size: 19px; font-weight: 800; fill: #1F3F60; }
      .hint { font-size: 15px; fill: #F7F3E9; }
      .body { font-size: 19px; fill: #2C3E50; }
      .small { font-size: 16px; fill: #596A73; }
      .stop { font-size: 18px; font-weight: 780; fill: #743E37; }
    </style>
  </defs>
  <rect width="1100" height="760" fill="#F7F3E9"/><rect width="1100" height="760" fill="url(#grain)"/>
  <g class="sans">
    <text x="65" y="66" class="kicker">FIGURE 3 - DURABLE PROMOTION</text>
    <text x="65" y="112" class="title">Retirement ends after the post-removal check</text>
    <text x="65" y="143" class="subtitle">Six stages establish removal eligibility; the seventh removes one lane and audits the result.</text>
    <path d="M176 292H922" stroke="#1F6968" stroke-width="5" marker-end="url(#arrow)"/>
    <g>
      <circle cx="150" cy="292" r="70" fill="#1F3F60"/><circle cx="150" cy="248" r="16" fill="#D2E0E2"/><text x="150" y="255" text-anchor="middle" class="number">1</text><text x="150" y="299" text-anchor="middle" class="step">Discover</text><text x="150" y="328" text-anchor="middle" class="hint">search and failures</text>
      <circle cx="275" cy="292" r="70" fill="#1F3F60"/><circle cx="275" cy="248" r="16" fill="#D2E0E2"/><text x="275" y="255" text-anchor="middle" class="number">2</text><text x="275" y="299" text-anchor="middle" class="step">Freeze</text><text x="275" y="328" text-anchor="middle" class="hint">stop writers</text>
      <circle cx="400" cy="292" r="70" fill="#1F3F60"/><circle cx="400" cy="248" r="16" fill="#D2E0E2"/><text x="400" y="255" text-anchor="middle" class="number">3</text><text x="400" y="299" text-anchor="middle" class="step">Classify</text><text x="400" y="328" text-anchor="middle" class="hint">meaning and risk</text>
      <circle cx="525" cy="292" r="70" fill="#1F6968"/><circle cx="525" cy="248" r="16" fill="#D2E0E2"/><text x="525" y="255" text-anchor="middle" class="number">4</text><text x="525" y="299" text-anchor="middle" class="step">Preserve</text><text x="525" y="328" text-anchor="middle" class="hint">verified copy</text>
      <circle cx="650" cy="292" r="70" fill="#1F6968"/><circle cx="650" cy="248" r="16" fill="#D2E0E2"/><text x="650" y="255" text-anchor="middle" class="number">5</text><text x="650" y="299" text-anchor="middle" class="step">Integrate</text><text x="650" y="328" text-anchor="middle" class="hint">explicit paths</text>
      <circle cx="775" cy="292" r="70" fill="#1F6968"/><circle cx="775" cy="248" r="16" fill="#D2E0E2"/><text x="775" y="255" text-anchor="middle" class="number">6</text><text x="775" y="299" text-anchor="middle" class="step">Verify</text><text x="775" y="328" text-anchor="middle" class="hint">main and gates</text>
      <circle cx="900" cy="292" r="70" fill="#743E37"/><circle cx="900" cy="248" r="16" fill="#F2DED9"/><text x="900" y="255" text-anchor="middle" class="number">7</text><text x="900" y="299" text-anchor="middle" class="step">Remove</text><text x="900" y="328" text-anchor="middle" class="hint">then inventory</text>
    </g>
    <rect x="65" y="420" width="970" height="190" rx="22" fill="#FFFFFF" stroke="#1F6968" stroke-width="3"/><rect x="65" y="420" width="970" height="190" rx="22" fill="url(#archive)"/>
    <text x="100" y="468" class="body"><tspan x="100" dy="0">The order prevents a false cleanup story:</tspan><tspan x="100" dy="35">discover every variant; freeze writers; classify its scientific and custody role;</tspan><tspan x="100" dy="30">preserve unique bytes; integrate exact paths; verify the destination-specific gates;</tspan><tspan x="100" dy="30">remove one lane; then inventory and retrieve before declaring retirement complete.</tspan></text>
    <rect x="65" y="650" width="970" height="52" rx="16" fill="#F2DED9" stroke="#743E37" stroke-width="2"/><rect x="65" y="650" width="970" height="52" rx="16" fill="url(#retire)"/>
    <text x="550" y="683" text-anchor="middle" class="stop">NO DESTRUCTIVE RESET - NO PLAIN FORCE PUSH - NO GC BEFORE THIS GATE</text>
    <text x="65" y="735" class="small">Numbered stages and patterned fills supplement the palette; no scientific or accessibility assurance follows from this diagram.</text>
  </g>
</svg>
