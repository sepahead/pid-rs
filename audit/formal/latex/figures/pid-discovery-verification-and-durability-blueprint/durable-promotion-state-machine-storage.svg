<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760" role="img" aria-labelledby="title desc">
  <title id="title">Durable promotion: storage paths and retirement gate</title>
  <desc id="desc">Two explicit paths leave a local reference. The preservation path leads to a remote side or archive reference and then to a scholarly or restricted archive. The mainline path leads to remote main and then to a named project release. These storage states remain distinct from mathematical truth and scientific acceptance. A separate retirement checklist requires all listed conditions.</desc>
  <defs>
    <pattern id="grain" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M2 5H8M12 14H18M5 18H9" stroke="#D2E0E2" stroke-width="1" opacity=".62"/></pattern>
    <pattern id="availability" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)"><path d="M0 0V14" stroke="#1F6968" stroke-width="3" opacity=".16"/></pattern>
    <pattern id="gate" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="4" cy="4" r="1.6" fill="#743E37" opacity=".18"/></pattern>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5L0 11Z" fill="#1F6968"/></marker>
    <style>
      .sans { font-family: "Latin Modern Sans", sans-serif; }
      .title { font-size: 34px; font-weight: 750; fill: #1F3F60; }
      .subtitle { font-size: 18px; fill: #1F6968; }
      .kicker { font-size: 17px; font-weight: 780; letter-spacing: 2px; fill: #1F6968; }
      .panel { font-size: 24px; font-weight: 760; fill: #1F3F60; }
      .label { font-size: 16px; font-weight: 700; fill: #2C3E50; }
      .body { font-size: 17px; fill: #2C3E50; }
      .small { font-size: 16px; fill: #596A73; }
      .gate { font-size: 17px; fill: #743E37; }
      .gateTitle { font-size: 24px; font-weight: 760; fill: #743E37; }
    </style>
  </defs>
  <rect width="1100" height="760" fill="#F7F3E9"/><rect width="1100" height="760" fill="url(#grain)"/>
  <g class="sans">
    <text x="65" y="66" class="kicker">FIGURE 2B - DURABLE PROMOTION</text>
    <text x="65" y="112" class="title">Availability, acceptance, and recovery are different claims</text>
    <text x="65" y="143" class="subtitle">Archive-only material may be durable without becoming a mainline or scientific acceptance claim.</text>
    <rect x="65" y="190" width="570" height="470" rx="22" fill="#FFFFFF" stroke="#1F6968" stroke-width="3"/><rect x="65" y="190" width="570" height="470" rx="22" fill="url(#availability)"/>
    <text x="100" y="238" class="panel">Storage and promotion paths</text>
    <rect x="100" y="278" width="105" height="55" rx="12" fill="#E8F0ED"/><text x="152.5" y="311" text-anchor="middle" class="label">Scratch</text><path d="M205 306H225" stroke="#1F6968" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="229" y="278" width="120" height="55" rx="12" fill="#D2E0E2"/><text x="289" y="301" text-anchor="middle" class="label"><tspan x="289">Dirty</tspan><tspan x="289" dy="17">worktree</tspan></text><path d="M349 306H369" stroke="#1F6968" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="373" y="278" width="120" height="55" rx="12" fill="#BBDDD7"/><text x="433" y="311" text-anchor="middle" class="label">Local ref</text>
    <path d="M433 333V349H205V366" fill="none" stroke="#1F6968" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M433 333V366" fill="none" stroke="#1F6968" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="100" y="370" width="210" height="70" rx="12" fill="#D2E0E2"/><text x="205" y="391" text-anchor="middle" class="small">PRESERVATION PATH</text><text x="205" y="410" text-anchor="middle" class="label"><tspan x="205">Remote side or</tspan><tspan x="205" dy="17">archive ref</tspan></text>
    <rect x="373" y="370" width="184" height="70" rx="12" fill="#A6D6C4"/><text x="465" y="391" text-anchor="middle" class="small">MAINLINE PATH</text><text x="465" y="425" text-anchor="middle" class="label">Remote main</text>
    <path d="M205 440V476" fill="none" stroke="#1F6968" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M465 440V476" fill="none" stroke="#1F6968" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="100" y="480" width="210" height="62" rx="12" fill="#E8F0ED"/><text x="205" y="504" text-anchor="middle" class="label"><tspan x="205">Scholarly or</tspan><tspan x="205" dy="17">restricted archive</tspan></text>
    <rect x="373" y="480" width="184" height="62" rx="12" fill="#BBDDD7"/><text x="465" y="504" text-anchor="middle" class="label"><tspan x="465">Named project</tspan><tspan x="465" dy="17">release</tspan></text>
    <text x="100" y="580" class="body"><tspan x="100" dy="0">Archive-only storage can preserve rejected or restricted work.</tspan><tspan x="100" dy="22">Remote main and a named release are separate states.</tspan><tspan x="100" dy="22">Hashes bind bytes; no layer alone proves availability,</tspan><tspan x="100" dy="22">authenticity, mathematical truth, or scientific acceptance.</tspan></text>
    <rect x="675" y="190" width="360" height="470" rx="22" fill="#FFF9F5" stroke="#743E37" stroke-width="3"/><rect x="675" y="190" width="360" height="470" rx="22" fill="url(#gate)"/>
    <text x="710" y="238" class="gateTitle">Retirement gate</text>
    <text x="710" y="282" class="gate"><tspan x="710" dy="0">1. No active process owns the lane.</tspan><tspan x="710" dy="46">2. Dirty and ignored bytes are classified.</tspan><tspan x="710" dy="46">3. Unique science has a</tspan><tspan x="730" dy="22">durable successor.</tspan><tspan x="710" dy="42">4. Remote head and relevant</tspan><tspan x="730" dy="22">gates are exact.</tspan><tspan x="710" dy="42">5. Archive-only material has</tspan><tspan x="730" dy="22">locator and recovery.</tspan><tspan x="710" dy="42">6. Post-removal inventory passes.</tspan></text>
    <text x="710" y="620" class="gateTitle">Every row must be true.</text>
    <text x="65" y="715" class="small">The storage and retirement diagrams are project-defined process guidance, not a release, custody, authenticity, or accessibility certificate.</text>
  </g>
</svg>
