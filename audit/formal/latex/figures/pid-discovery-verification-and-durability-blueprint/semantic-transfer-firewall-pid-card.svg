<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760" role="img" aria-labelledby="title desc">
  <title id="title">Semantic transfer firewall: PID analogue and promotion evidence</title>
  <desc id="desc">The left panel separates the selected future direct SxPID3 baseline from a conditional semantic-DAG optimization. The right panel names evidence still required for promotion. A lower blocked band identifies prime-gap material and scientific inferences that do not transfer.</desc>
  <defs>
    <pattern id="grain" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M2 5H8M12 14H18M5 18H9" stroke="#D2E0E2" stroke-width="1" opacity=".62"/></pattern>
    <pattern id="pidHatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)"><path d="M0 0V14" stroke="#1F6968" stroke-width="3" opacity=".18"/></pattern>
    <pattern id="gateBars" width="16" height="14" patternUnits="userSpaceOnUse"><path d="M0 4H16M0 11H16" stroke="#1F3F60" stroke-width="2" opacity=".14"/></pattern>
    <pattern id="blocked" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0V16" stroke="#743E37" stroke-width="3" opacity=".16"/></pattern>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#1F6968"/></marker>
    <style>
      .sans { font-family: SourceSansPro, sans-serif; }
      .title { font-size: 34px; font-weight: 750; fill: #1F3F60; }
      .subtitle { font-size: 18px; fill: #1F6968; }
      .kicker { font-size: 17px; font-weight: 780; letter-spacing: 2px; fill: #1F6968; }
      .panelTitle { font-size: 27px; font-weight: 760; fill: #1F3F60; }
      .body { font-size: 18px; fill: #2C3E50; }
      .small { font-size: 16px; fill: #596A73; }
      .number { font-size: 18px; font-weight: 800; fill: #F7F3E9; }
      .pill { font-size: 15px; font-weight: 760; fill: #1F3F60; letter-spacing: 1.2px; }
      .fireTitle { font-size: 17px; font-weight: 800; fill: #743E37; letter-spacing: 1px; }
      .fire { font-size: 15px; fill: #743E37; }
    </style>
  </defs>
  <rect width="1100" height="760" fill="#F7F3E9"/><rect width="1100" height="760" fill="url(#grain)"/>
  <g class="sans">
    <text x="65" y="66" class="kicker">FIGURE 2 - TRANSFER FIREWALL</text>
    <text x="65" y="112" class="title">Adopt a proof role only after PID-specific evidence</text>
    <text x="65" y="143" class="subtitle">The proposed assurance route is not a new PID measure and does not transfer the source conclusion.</text>
    <rect x="65" y="190" width="430" height="420" rx="22" fill="#E8F0ED" stroke="#1F6968" stroke-width="3"/><rect x="65" y="190" width="430" height="420" rx="22" fill="url(#pidHatch)"/>
    <circle cx="105" cy="235" r="22" fill="#1F6968"/><text x="105" y="242" text-anchor="middle" class="number">3</text>
    <rect x="143" y="215" width="178" height="38" rx="19" fill="#D2E0E2"/><text x="232" y="240" text-anchor="middle" class="pill">PID ANALOGUE</text>
    <text x="102" y="306" class="panelTitle">SxPID3 assurance pilot</text>
    <text x="102" y="344" class="body"><tspan x="102" dy="0">SELECTED FUTURE BASELINE</tspan><tspan x="102" dy="27">Canonical count bytes to</tspan><tspan x="102" dy="27">direct 108 keyed products</tspan><tspan x="102" dy="27">and exact signs.</tspan><tspan x="102" dy="37">CONDITIONAL OPTIMIZATION</tspan><tspan x="102" dy="27">Semantic mass DAG only if</tspan><tspan x="102" dy="27">proved and benchmarked.</tspan><tspan x="102" dy="37">Complete target: proposed/open.</tspan></text>
    <path d="M507 401H574" stroke="#1F6968" stroke-width="5" marker-end="url(#arrow)"/>
    <rect x="605" y="190" width="430" height="420" rx="22" fill="#FFFFFF" stroke="#1F3F60" stroke-width="3"/><rect x="605" y="190" width="430" height="420" rx="22" fill="url(#gateBars)"/>
    <circle cx="645" cy="235" r="22" fill="#1F3F60"/><text x="645" y="242" text-anchor="middle" class="number">4</text>
    <rect x="683" y="215" width="212" height="38" rx="19" fill="#D2E0E2"/><text x="789" y="240" text-anchor="middle" class="pill">PROMOTION GATE</text>
    <text x="642" y="306" class="panelTitle">Evidence still required</text>
    <text x="642" y="350" class="body"><tspan x="642" dy="0">Generated-answer-blind</tspan><tspan x="642" dy="30">Concrete Lean and finite SMT</tspan><tspan x="642" dy="30">Exact rational products</tspan><tspan x="642" dy="30">Independent directed bounds</tspan><tspan x="642" dy="30">Keyed Rust refinement</tspan><tspan x="642" dy="30">Bounded corpus and mutations</tspan><tspan x="642" dy="30">Fresh custody and durability</tspan></text>
    <rect x="65" y="642" width="970" height="78" rx="18" fill="#F2DED9" stroke="#743E37" stroke-width="2"/><rect x="65" y="642" width="970" height="78" rx="18" fill="url(#blocked)"/>
    <text x="550" y="672" text-anchor="middle" class="fireTitle">NONTRANSFER FIREWALL - THESE CLAIMS DO NOT CROSS</text>
    <text x="550" y="699" text-anchor="middle" class="fire">Sieve formulas, 246, the 50-tuple, and Bombieri-Vinogradov do not validate KSG, population PID, calibration, causality, or novelty.</text>
    <text x="65" y="744" class="small">The complete assurance target remains proposed/open despite scoped partial evidence.</text>
  </g>
</svg>
