<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Semantic transfer firewall from PrimeGaps to PID assurance</title>
  <desc id="desc">A four-stage diagram separates source meaning, a seven-field transfer card, a PID-specific analogue, and acceptance evidence. A red firewall blocks prime-gap conclusions and numerical constants from entering PID claims.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071521"/>
      <stop offset="1" stop-color="#102b3a"/>
    </linearGradient>
    <linearGradient id="source" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f607a"/>
      <stop offset="1" stop-color="#17455c"/>
    </linearGradient>
    <linearGradient id="pid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#306b53"/>
      <stop offset="1" stop-color="#1d4c3b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000" flood-opacity="0.30"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 L12 6 L0 12 Z" fill="#9ed9ef"/>
    </marker>
    <style>
      .sans { font-family: "Latin Modern Sans", sans-serif; }
      .title { font-size: 42px; font-weight: 750; fill: #f4f8fa; letter-spacing: .2px; }
      .subtitle { font-size: 21px; fill: #b9d1dc; }
      .kicker { font-size: 16px; font-weight: 760; fill: #87d2ee; letter-spacing: 2.2px; }
      .cardTitle { font-size: 25px; font-weight: 760; fill: #fff; }
      .body { font-size: 18px; fill: #e6f1f4; }
      .small { font-size: 15px; fill: #c5d9e1; }
      .fireTitle { font-size: 18px; font-weight: 800; fill: #ffd9d5; letter-spacing: 1px; }
      .fire { font-size: 16px; fill: #ffe7e3; }
      .pill { font-size: 15px; font-weight: 760; fill: #08202c; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1430" cy="90" r="190" fill="#1b4960" opacity=".22"/>
  <circle cx="110" cy="820" r="240" fill="#164c3a" opacity=".20"/>

  <g class="sans">
    <text x="80" y="78" class="kicker">PID DISCOVERY &amp; VERIFICATION BLUEPRINT</text>
    <text x="80" y="132" class="title">Transfer the proof role — never the conclusion</text>
    <text x="80" y="171" class="subtitle">Every borrowed method crosses a typed semantic firewall before it earns a PID-specific use.</text>

    <g filter="url(#shadow)">
      <rect x="75" y="245" width="320" height="390" rx="24" fill="url(#source)" stroke="#5db4d1" stroke-width="2"/>
      <rect x="425" y="245" width="350" height="390" rx="24" fill="#173647" stroke="#8acfe7" stroke-width="2"/>
      <rect x="825" y="245" width="330" height="390" rx="24" fill="url(#pid)" stroke="#74c8a2" stroke-width="2"/>
      <rect x="1190" y="245" width="335" height="390" rx="24" fill="#24354b" stroke="#9db8e2" stroke-width="2"/>
    </g>

    <rect x="103" y="273" width="132" height="30" rx="15" fill="#9ed9ef"/>
    <text x="169" y="294" text-anchor="middle" class="pill">ORIGIN</text>
    <text x="105" y="345" class="cardTitle">PrimeGaps meaning</text>
    <text x="105" y="390" class="body">
      <tspan x="105" dy="0">Untrusted search proposes</tspan>
      <tspan x="105" dy="29">one existential polynomial.</tspan>
      <tspan x="105" dy="42">Exact finite kernels check</tspan>
      <tspan x="105" dy="29">a stored rational inequality.</tspan>
      <tspan x="105" dy="42">A named analytic bridge plus</tspan>
      <tspan x="105" dy="29">Bombieri–Vinogradov yields</tspan>
      <tspan x="105" dy="29">a conditional prime-gap result.</tspan>
    </text>

    <rect x="453" y="273" width="150" height="30" rx="15" fill="#bde8f4"/>
    <text x="528" y="294" text-anchor="middle" class="pill">TRANSFER CARD</text>
    <text x="455" y="345" class="cardTitle">Seven required fields</text>
    <text x="455" y="389" class="body">
      <tspan x="455" dy="0">1. Source meaning</tspan>
      <tspan x="455" dy="30">2. PID analogue</tspan>
      <tspan x="455" dy="30">3. Preserved assumptions</tspan>
      <tspan x="455" dy="30">4. Changed assumptions</tspan>
      <tspan x="455" dy="30">5. Prohibited inference</tspan>
      <tspan x="455" dy="30">6. Required evidence</tspan>
      <tspan x="455" dy="30">7. Disposition</tspan>
    </text>

    <rect x="853" y="273" width="150" height="30" rx="15" fill="#9de2bd"/>
    <text x="928" y="294" text-anchor="middle" class="pill">PID ANALOGUE</text>
    <text x="855" y="345" class="cardTitle">SxPID3 pilot</text>
    <text x="855" y="390" class="body">
      <tspan x="855" dy="0">Canonical count bytes</tspan>
      <tspan x="855" dy="29">→ semantic mass graph</tspan>
      <tspan x="855" dy="29">→ normalized rational</tspan>
      <tspan x="855" dy="29">→ exact sign + interval</tspan>
      <tspan x="855" dy="42">Two views preserve both</tspan>
      <tspan x="855" dy="29">meaning and cancellation.</tspan>
      <tspan x="855" dy="42">Still a proposed assurance</tspan>
      <tspan x="855" dy="29">architecture, not a new PID.</tspan>
    </text>

    <rect x="1218" y="273" width="160" height="30" rx="15" fill="#c9d8f1"/>
    <text x="1298" y="294" text-anchor="middle" class="pill">PROMOTION GATE</text>
    <text x="1220" y="345" class="cardTitle">Evidence that can count</text>
    <text x="1220" y="390" class="body">
      <tspan x="1220" dy="0">Source-blind reconstruction</tspan>
      <tspan x="1220" dy="29">Concrete Lean + finite SMT</tspan>
      <tspan x="1220" dy="29">Exact rational products</tspan>
      <tspan x="1220" dy="29">Independent directed bounds</tspan>
      <tspan x="1220" dy="29">Keyed Rust refinement</tspan>
      <tspan x="1220" dy="29">Bounded corpus + mutations</tspan>
      <tspan x="1220" dy="29">Fresh custody + durability</tspan>
    </text>

    <path d="M395 440 H420" stroke="#9ed9ef" stroke-width="5" marker-end="url(#arrow)"/>
    <path d="M775 440 H815" stroke="#9ed9ef" stroke-width="5" marker-end="url(#arrow)"/>
    <path d="M1155 440 H1180" stroke="#9ed9ef" stroke-width="5" marker-end="url(#arrow)"/>

    <g filter="url(#shadow)">
      <rect x="155" y="685" width="1290" height="142" rx="26" fill="#5b2425" stroke="#ff9387" stroke-width="2"/>
    </g>
    <text x="800" y="723" text-anchor="middle" class="fireTitle">NONTRANSFER FIREWALL — THESE CLAIMS DO NOT CROSS</text>
    <text x="800" y="761" text-anchor="middle" class="fire">
      <tspan x="800" dy="0">Sieve formulas · 246 · the 50-tuple · Bombieri–Vinogradov · certificate margin · existential decoder semantics</tspan>
      <tspan x="800" dy="30">Exact categorical products do not validate KSG, continuous support, population PID, calibration, causality, or scientific novelty.</tspan>
    </text>

    <text x="80" y="870" class="small">Councils and formal tools generate attacks and bounded evidence; the integrator still owns semantic judgment.</text>
  </g>
</svg>
