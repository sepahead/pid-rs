<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xml:lang="en" width="160mm" height="90mm" viewBox="0 0 1600 900" role="img" aria-labelledby="v6-title v6-desc" data-predecessor="C5" data-failed-contract="v5" data-successor="C6" data-receipt="R6" data-r5-status="permanently-unissued" data-defect="cartesian-cross-toolchain-association" data-repair-count="1">
  <title id="v6-title">C5 failed its attempt-one publication gate, so R5 is unissued; C6 corrects one cross-toolchain association rule</title>
  <desc id="v6-desc">Published C5 remains immutable. Its CodeQL route passed, while repository CI and the dedicated composite-v5 workflow recorded publication-gate failure. The repository CI v4 lane and dedicated v5 lane emitted analogous embedded-Form versus standalone-figure diagnostics: two observations at the same named Cartesian association-rule failure surface, not two repairs or evidence that either publication is defective. Reproducing the wrong-lane rule proves neither a unique cause nor the only possible remedy. The versioned checkers compared every rebuilt and committed report with every rebuilt and committed figure, even though both TeX reports referenced the committed figure. This Cartesian wrong-lane comparison makes Q5 false and leaves R5 permanently unissued. L5 is one fresh exact-C5 local qualification observation without first-attempt authority; only the hosted C5 terms require attempt one. A direct-child C6 makes one claimed defect repair, the bounded association-rule correction: reports bind to the committed figure they reference, while fresh and committed standalone figures are compared separately. Only one fresh exact-C6 local closure observation plus hosted attempt-one CI, CodeQL, and dedicated-v6 success can make Q6 true and permit R6; the local record is not a first-attempt authority. A typed durable local-closure record must bind exact clean C6, the fixed local command, bounded output, and tool identities before it establishes L6; the receipt validates that record and the fresh hosted capture before deriving all four terms. The local observation is unsigned, correlated, unauthenticated, non-atomic, and not a complete executable inventory. It does not pass ambient variables to the command; bounded scans reject named secret-like patterns and private-path prefixes without proving privacy. The clean endpoints use ordinary Git status plus selected metadata checks; repository-ignored products and uninspected Git metadata remain outside the observation and may remain side inputs, so this is not a hermetic closure. The diagram grants no science, mathematics, PID, KSG, security, application, authentication, independence, PDF-UA, or renderer-independence credit.</desc>
