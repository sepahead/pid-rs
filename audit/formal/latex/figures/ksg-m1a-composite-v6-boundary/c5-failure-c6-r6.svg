      .headline { font-family: 'Source Sans Pro', sans-serif; font-size: 39px; font-weight: 700; fill: #1F3F60; }
      .card-title { font-family: 'Source Sans Pro', sans-serif; font-size: 30px; font-weight: 700; fill: #2C3E50; text-anchor: middle; }
      .body { font-family: 'Latin Modern Roman', serif; font-size: 26px; fill: #2C3E50; text-anchor: middle; }
      .small { font-family: 'Source Sans Pro', sans-serif; font-size: 25px; font-weight: 600; fill: #596A73; text-anchor: middle; }
      .left-small { font-family: 'Source Sans Pro', sans-serif; font-size: 25px; font-weight: 600; fill: #2C3E50; }
      .badge { font-family: 'Source Sans Pro', sans-serif; font-size: 25px; font-weight: 700; fill: #F7F3E9; text-anchor: middle; letter-spacing: 1px; }
      .formula { font-family: 'Latin Modern Roman', serif; font-size: 27px; font-weight: 700; fill: #2C3E50; text-anchor: middle; }
      .footer { font-family: 'Source Sans Pro', sans-serif; font-size: 25px; font-weight: 600; fill: #2C3E50; }
    </style>
  </defs>

