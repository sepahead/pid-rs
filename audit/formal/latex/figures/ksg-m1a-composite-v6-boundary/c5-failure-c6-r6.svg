    <text x="561" y="621" class="badge">V6 GATE</text>
    <text x="352" y="676" class="formula">Q6 = L6 AND CI6 AND CodeQL6 AND D6</text>
    <text x="352" y="711" class="small">fresh local record + hosted attempt 1 success</text>

