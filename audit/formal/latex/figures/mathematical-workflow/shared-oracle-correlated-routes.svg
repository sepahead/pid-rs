<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xml:lang="en" width="160mm" height="76mm" viewBox="0 0 1600 760" role="img" aria-labelledby="oracle-title oracle-desc">
  <title id="oracle-title">Correlated routes through a shared oracle</title>
  <desc id="oracle-desc">Five named test suites all converge on one shared semantic oracle before reaching a comparison result. A candidate lower route uses a separate formulation and distinct verifier, but earns dependency-disjoint status only after its assumptions and cuts are audited. The shared oracle is a common cut, so suite count is not independence.</desc>
  <defs>
    <marker id="oracle-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#1F6968"/>
    </marker>
    <pattern id="oracle-hatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="14" stroke="#B28218" stroke-width="4"/>
    </pattern>
    <style>
      .heading { font-family: 'Source Sans Pro', sans-serif; font-size: 31px; font-weight: 700; fill: #1F3F60; }
      .eyebrow { font-family: 'Source Sans Pro', sans-serif; font-size: 18px; font-weight: 700; letter-spacing: 2px; fill: #596A73; }
      .node-title { font-family: 'Source Sans Pro', sans-serif; font-size: 21px; font-weight: 700; fill: #2C3E50; text-anchor: middle; }
      .node-body { font-family: 'Latin Modern Roman', serif; font-size: 18px; font-weight: 400; fill: #2C3E50; text-anchor: middle; }
      .small { font-family: 'Source Sans Pro', sans-serif; font-size: 17px; font-weight: 600; fill: #596A73; }
      .badge { font-family: 'Source Sans Pro', sans-serif; font-size: 16px; font-weight: 700; fill: #F7F3E9; text-anchor: middle; letter-spacing: 1px; }
    </style>
  </defs>

  <rect width="1600" height="760" fill="#F7F3E9"/>
  <path d="M52 72 H1548" stroke="#D2E0E2" stroke-width="2"/>
  <path d="M52 72 H260" stroke="#B28218" stroke-width="7"/>
  <text x="52" y="43" class="eyebrow">EVIDENCE INDEPENDENCE</text>
  <text x="52" y="122" class="heading">Five routes may still be one route semantically</text>

  <g fill="none" stroke="#1F6968" stroke-width="4" marker-end="url(#oracle-arrow)">
    <path d="M310 190 C470 190 495 260 620 329"/>
    <path d="M310 275 C470 275 505 305 620 347"/>
    <path d="M310 360 H620"/>
    <path d="M310 445 C470 445 505 415 620 373"/>
    <path d="M310 530 C470 530 495 460 620 391"/>
    <path d="M910 360 H1055"/>
    <path d="M1305 360 H1508"/>
  </g>

  <g>
    <rect x="74" y="153" width="236" height="68" rx="13" fill="#F7F3E9" stroke="#1F3F60" stroke-width="3"/>
    <text x="192" y="195" class="node-title">Suite 1 · fixture</text>
    <rect x="74" y="238" width="236" height="68" rx="13" fill="#F7F3E9" stroke="#1F3F60" stroke-width="3"/>
    <text x="192" y="280" class="node-title">Suite 2 · property</text>
    <rect x="74" y="323" width="236" height="68" rx="13" fill="#F7F3E9" stroke="#1F3F60" stroke-width="3"/>
    <text x="192" y="365" class="node-title">Suite 3 · corpus</text>
    <rect x="74" y="408" width="236" height="68" rx="13" fill="#F7F3E9" stroke="#1F3F60" stroke-width="3"/>
    <text x="192" y="450" class="node-title">Suite 4 · mutation</text>
    <rect x="74" y="493" width="236" height="68" rx="13" fill="#F7F3E9" stroke="#1F3F60" stroke-width="3"/>
    <text x="192" y="535" class="node-title">Suite 5 · replay</text>

    <rect x="620" y="285" width="290" height="150" rx="20" fill="url(#oracle-hatch)" stroke="#B28218" stroke-width="5"/>
    <rect x="632" y="297" width="266" height="126" rx="14" fill="#F7F3E9" stroke="#B28218" stroke-width="2"/>
    <rect x="704" y="309" width="122" height="28" rx="14" fill="#B28218"/>
    <text x="765" y="329" class="badge">SHARED CUT</text>
    <text x="765" y="371" class="node-title">Semantic oracle C</text>
    <text x="765" y="401" class="node-body">same algebra, same assumptions</text>

    <rect x="1055" y="306" width="250" height="108" rx="17" fill="#D2E0E2" stroke="#1F6968" stroke-width="4"/>
    <text x="1180" y="351" class="node-title">Comparison result</text>
    <text x="1180" y="383" class="node-body">agreement with C</text>

    <rect x="1508" y="326" width="40" height="68" rx="8" fill="#1F3F60"/>
    <text x="1528" y="351" class="badge" transform="rotate(90 1528 351)">PASS</text>
  </g>

  <path d="M51 606 H1549" stroke="#D2E0E2" stroke-width="2"/>
  <text x="74" y="592" class="small">Candidate separate route: audit formulation, implementation, failure mode, assumptions, and custody</text>
  <g fill="none" stroke="#1F3F60" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#oracle-arrow)">
    <path d="M310 661 H640"/>
    <path d="M910 661 H1110"/>
    <path d="M1360 661 H1508"/>
  </g>
  <g>
    <rect x="74" y="626" width="236" height="70" rx="13" fill="#F7F3E9" stroke="#1F3F60" stroke-width="3"/>
    <text x="192" y="669" class="node-title">Separate formulation</text>
    <rect x="640" y="626" width="270" height="70" rx="13" fill="#F7F3E9" stroke="#1F3F60" stroke-width="3"/>
    <text x="775" y="669" class="node-title">Distinct verifier</text>
    <rect x="1110" y="626" width="250" height="70" rx="13" fill="#F7F3E9" stroke="#B28218" stroke-width="3" stroke-dasharray="10 7"/>
    <text x="1235" y="669" class="node-title">Independence audit</text>
    <rect x="1508" y="627" width="40" height="68" rx="8" fill="#B28218"/>
    <text x="1528" y="651" class="badge" transform="rotate(90 1528 651)">OPEN</text>
  </g>

  <text x="1015" y="495" class="small">Suite count measures breadth; route analysis records independence evidence.</text>
</svg>
