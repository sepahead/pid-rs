<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xml:lang="en" width="160mm" height="64mm" viewBox="0 0 1600 640" role="img" aria-labelledby="four-object-title four-object-desc">
  <title id="four-object-title">Four-object assurance chain</title>
  <desc id="four-object-desc">Four distinct cards run left to right from population functional through estimator and executable result to consumer decision. Lettered arrows bind target correspondence, implementation refinement, and consumer qualification as separate obligations.</desc>
  <defs>
    <marker id="four-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 z" fill="#1F6968"/>
    </marker>
    <style>
      .heading { font-family: 'Source Sans Pro', sans-serif; font-size: 40px; font-weight: 700; fill: #1F3F60; }
      .eyebrow { font-family: 'Source Sans Pro', sans-serif; font-size: 25px; font-weight: 700; letter-spacing: 2px; fill: #596A73; }
      .card-title { font-family: 'Source Sans Pro', sans-serif; font-size: 30px; font-weight: 700; fill: #2C3E50; }
      .body { font-family: 'Latin Modern Roman', serif; font-size: 27px; font-weight: 400; fill: #2C3E50; }
      .small { font-family: 'Source Sans Pro', sans-serif; font-size: 25px; font-weight: 600; fill: #596A73; }
      .step { font-family: 'Source Sans Pro', sans-serif; font-size: 25px; font-weight: 700; fill: #F7F3E9; text-anchor: middle; }
    </style>
  </defs>

  <rect width="1600" height="640" fill="#F7F3E9"/>
  <path d="M52 72 H1548" stroke="#D2E0E2" stroke-width="2"/>
  <path d="M52 72 H260" stroke="#B28218" stroke-width="7"/>
  <text x="52" y="43" class="eyebrow">ASSURANCE ARCHITECTURE</text>
  <text x="52" y="122" class="heading">Keep the scientific objects distinct</text>

  <g transform="translate(52 170)">
    <rect width="322" height="326" rx="18" fill="#F7F3E9" stroke="#1F3F60" stroke-width="3"/>
    <rect width="322" height="15" rx="7" fill="#1F3F60"/>
    <circle cx="43" cy="65" r="24" fill="#1F3F60"/>
    <text x="43" y="72" class="step">1</text>
    <text x="80" y="60" class="card-title">Population</text>
    <text x="80" y="90" class="card-title">functional</text>
    <path d="M30 119 H292" stroke="#D2E0E2" stroke-width="2"/>
    <text x="30" y="158" class="body">The quantity defined</text>
    <text x="30" y="187" class="body">at the law or model.</text>
    <text x="30" y="238" class="small">Question</text>
    <text x="30" y="268" class="body">What is the estimand?</text>
  </g>

  <g transform="translate(446 170)">
    <rect width="322" height="326" rx="18" fill="#F7F3E9" stroke="#1F6968" stroke-width="3"/>
    <rect width="322" height="15" rx="7" fill="#1F6968"/>
    <circle cx="43" cy="65" r="24" fill="#1F6968"/>
    <text x="43" y="72" class="step">2</text>
    <text x="80" y="60" class="card-title">Finite-sample</text>
    <text x="80" y="90" class="card-title">estimator</text>
    <path d="M30 119 H292" stroke="#D2E0E2" stroke-width="2"/>
    <text x="30" y="158" class="body">The rule applied to</text>
    <text x="30" y="187" class="body">observed data.</text>
    <text x="30" y="238" class="small">Question</text>
    <text x="30" y="268" class="body">Which assumptions?</text>
  </g>

  <g transform="translate(840 170)">
    <rect width="322" height="326" rx="18" fill="#F7F3E9" stroke="#1F3F60" stroke-width="3"/>
    <rect width="322" height="15" rx="7" fill="#1F3F60"/>
    <circle cx="43" cy="65" r="24" fill="#1F3F60"/>
    <text x="43" y="72" class="step">3</text>
    <text x="80" y="60" class="card-title">Executable</text>
    <text x="80" y="90" class="card-title">result</text>
    <path d="M30 119 H292" stroke="#D2E0E2" stroke-width="2"/>
    <text x="30" y="158" class="body">The bytes, logs, and</text>
    <text x="30" y="187" class="body">observed outputs.</text>
    <text x="30" y="238" class="small">Question</text>
    <text x="30" y="268" class="body">What actually ran?</text>
  </g>

  <g transform="translate(1234 170)">
    <rect width="314" height="326" rx="18" fill="#F7F3E9" stroke="#1F6968" stroke-width="3"/>
    <rect width="314" height="15" rx="7" fill="#1F6968"/>
    <circle cx="43" cy="65" r="24" fill="#1F6968"/>
    <text x="43" y="72" class="step">4</text>
    <text x="80" y="60" class="card-title">Consumer</text>
    <text x="80" y="90" class="card-title">decision</text>
    <path d="M30 119 H284" stroke="#D2E0E2" stroke-width="2"/>
    <text x="30" y="158" class="body">The action justified</text>
    <text x="30" y="187" class="body">by accepted evidence.</text>
    <text x="30" y="238" class="small">Question</text>
    <text x="30" y="268" class="body">What may be claimed?</text>
  </g>

  <g fill="none" stroke="#1F6968" stroke-width="5" marker-end="url(#four-arrow)">
    <path d="M377 333 H432"/>
    <path d="M771 333 H826"/>
    <path d="M1165 333 H1220"/>
  </g>
  <g>
    <circle cx="404" cy="295" r="19" fill="#1F3F60"/>
    <circle cx="798" cy="295" r="19" fill="#1F3F60"/>
    <circle cx="1192" cy="295" r="19" fill="#1F3F60"/>
    <text x="404" y="302" class="step">A</text>
    <text x="798" y="302" class="step">B</text>
    <text x="1192" y="302" class="step">C</text>
  </g>

  <rect x="52" y="520" width="1496" height="80" rx="9" fill="#D2E0E2"/>
  <rect x="52" y="520" width="12" height="80" rx="6" fill="#B28218"/>
  <text x="84" y="550" class="small">A: target correspondence · B: implementation refinement · C: consumer qualification</text>
  <text x="84" y="584" class="body">Each mapping needs evidence; one object cannot discharge another.</text>
</svg>
