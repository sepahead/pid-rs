[package]
name = "pid-certified-sxpid"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
build = "build.rs"
publish = false
license = "MIT OR Apache-2.0"
repository = "https://github.com/sepahead/pid-rs"
description = "Offline directed-rounding reference certifier for finite categorical PID expressions"

[dependencies]
rug = { version = "=1.30.0", default-features = false, features = ["float", "rational", "std"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.11.0"

[dev-dependencies]

[lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[lints.clippy]
uninlined_format_args = "warn"

# This audit tool has a separate lockfile and native LGPL dependency boundary. It is deliberately
# not a member of the published pid-rs workspace.
[workspace]
