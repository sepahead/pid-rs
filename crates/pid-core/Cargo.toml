[package]
name = "pid-core"
description = "Empirical and fitted-quantized PID, report-first KSG MI, and quarantined continuous PID research APIs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
documentation = "https://docs.rs/pid-core"
readme = "README.md"
keywords = ["information-theory", "mutual-information", "entropy", "pid", "estimator"]
categories = ["science", "mathematics", "algorithms"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[lib]
name = "pid_core"
path = "src/lib.rs"

[features]
default = []
# Exact data-parallel KSG kNN (bit-identical results to the serial path; rayon-backed).
parallel = ["dep:rayon"]
# Default-off scientific research surfaces. The default build exposes only the stable empirical,
# fitted-quantized, conditional Euclidean-report, and diagnostic APIs. Keep these feature names
# explicit so users and release tooling can select and audit one research family at a time.
experimental-continuous = []
experimental-hyperbolic = ["experimental-continuous"]
experimental-heuristics = ["experimental-continuous"]
experimental-hierarchy = ["experimental-continuous"]
research-mixed-dimension-pid3 = ["experimental-continuous"]
experimental-pipelines = ["experimental-continuous", "research-mixed-dimension-pid3"]
experimental-all = [
    "experimental-continuous",
    "experimental-hyperbolic",
    "experimental-heuristics",
    "experimental-hierarchy",
    "research-mixed-dimension-pid3",
    "experimental-pipelines",
]

[dependencies]
anyhow.workspace = true
nalgebra.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
pid-runlog.workspace = true
rayon = { workspace = true, optional = true }

[dev-dependencies]
# `default-features = false` drops criterion's plotting/HTML deps (plotters, tinytemplate,
# …), keeping the dev-dependency tree — and the cargo-deny supply-chain surface — small.
criterion = { version = "0.8", default-features = false }

[[bench]]
name = "estimators"
harness = false
required-features = ["experimental-all"]

[[example]]
name = "ksg_and_pid"
path = "examples/ksg_and_pid.rs"
required-features = ["experimental-continuous"]

[[bin]]
name = "exp0"
path = "src/bin/exp0.rs"
required-features = ["experimental-all"]
