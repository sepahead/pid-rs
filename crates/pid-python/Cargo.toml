[package]
name = "pid-python"
description = "Typed Python bindings for empirical categorical and fitted-quantized PID plus report-first KSG mutual information"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
publish = false # built as a Python wheel via maturin, not published on crates.io

[lib]
name = "pid_core_rs"
crate-type = ["cdylib"]
path = "src/v1.rs"

[features]
default = []
# `extension-module` tells PyO3 not to link libpython (symbols are resolved by the host
# interpreter at import time). It is required for wheel builds and is enabled by
# maturin (see pyproject.toml). It is OFF by default so plain `cargo build`/`cargo test`/
# `cargo clippy` link against libpython normally instead of failing with undefined symbols.
extension-module = ["pyo3/extension-module"]
# Default Python wheels expose only the 1.0 stable scientific surface. Research estimators and
# compatibility wrappers are compiled only into explicitly experimental wheels.
python-experimental = ["pid-core/experimental-all"]

[dependencies]
pyo3 = { version = "0.29.0", features = ["abi3-py311"] }
numpy = "0.29.0"
pid-core = { version = "1.0.0", path = "../pid-core", default-features = false }
